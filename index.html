<!DOCTYPE html>
<html lang="en">

<style>
* {

<body>

<canvas id="canvas"></canvas>

<div id="ui">
    <div id="startScreen">

        <h1>Birthday Fireworks</h1>

        <p>
            A continuous 5-minute fireworks show followed by
            a special text-firework finale.
        </p>

        <input
            id="nameInput"
            type="text"
            maxlength="20"
            autocomplete="off"
            autocapitalize="characters"
            placeholder="Enter a name"
        >

        <button id="startButton">
            Start Show
        </button>

    </div>
</div>

<script>
"use strict";


/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

let width = 0;
let height = 0;
let dpr = 1;

function resize() {

    dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    width =
        window.innerWidth;

    height =
        window.innerHeight;

    canvas.width =
        Math.floor(
            width * dpr
        );

    canvas.height =
        Math.floor(
            height * dpr
        );

    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

window.addEventListener(
    "resize",
    resize
);

resize();


/* =========================================================
   AUDIO ENGINE
========================================================= */

let audioContext = null;
let masterGain = null;
let compressor = null;
let noiseBuffer = null;
let audioReady = false;


/*
    Audio is initialized from the Start button because
    iOS and other browsers require a user interaction
    before Web Audio can play.
*/

function initAudio() {

    if (audioReady) {

        if (
            audioContext &&
            audioContext.state ===
                "suspended"
        ) {
            audioContext.resume();
        }

        return;
    }

    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

    if (!AudioContext) {
        return;
    }

    audioContext =
        new AudioContext();

    compressor =
        audioContext.createDynamicsCompressor();

    compressor.threshold.value =
        -18;

    compressor.knee.value =
        18;

    compressor.ratio.value =
        7;

    compressor.attack.value =
        0.003;

    compressor.release.value =
        0.18;

    masterGain =
        audioContext.createGain();

    /*
        Keeps the fireworks audible without
        making the synthesized booms painfully loud.
    */

    masterGain.gain.value =
        0.30;

    masterGain.connect(
        compressor
    );

    compressor.connect(
        audioContext.destination
    );

    createGlobalNoiseBuffer();

    audioReady = true;

    if (
        audioContext.state ===
        "suspended"
    ) {
        audioContext.resume();
    }
}


/* =========================================================
   GLOBAL NOISE BUFFER
========================================================= */

function createGlobalNoiseBuffer() {

    if (!audioContext) {
        return;
    }

    const sampleRate =
        audioContext.sampleRate;

    const duration = 2;

    const length =
        Math.floor(
            sampleRate *
            duration
        );

    noiseBuffer =
        audioContext.createBuffer(
            1,
            length,
            sampleRate
        );

    const data =
        noiseBuffer.getChannelData(0);

    for (
        let i = 0;
        i < length;
        i++
    ) {

        /*
            Slightly shaped noise rather than
            completely harsh white noise.
        */

        data[i] =
            (
                Math.random() * 2 -
                1
            ) *
            0.85;
    }
}


/* =========================================================
   AUDIO TIME
========================================================= */

function getAudioTime() {

    if (!audioContext) {
        return 0;
    }

    return (
        audioContext.currentTime +
        0.015
    );
}


/* =========================================================
   OSCILLATOR
========================================================= */

function createTone(
    startFrequency,
    endFrequency,
    duration,
    volume,
    waveform = "sine",
    delay = 0
) {

    if (!audioReady) {
        return;
    }

    const now =
        getAudioTime() +
        delay;

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type =
        waveform;

    oscillator.frequency.setValueAtTime(
        Math.max(
            20,
            startFrequency
        ),
        now
    );

    if (
        endFrequency !==
        startFrequency
    ) {

        oscillator.frequency.exponentialRampToValueAtTime(
            Math.max(
                20,
                endFrequency
            ),
            now + duration
        );
    }

    gain.gain.setValueAtTime(
        0.0001,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        Math.max(
            0.0002,
            volume
        ),
        now + 0.006
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + duration
    );

    oscillator.connect(gain);
    gain.connect(masterGain);

    oscillator.start(now);

    oscillator.stop(
        now +
        duration +
        0.03
    );
}


/* =========================================================
   FILTERED NOISE
========================================================= */

function createNoiseBurst(
    duration,
    volume,
    filterType,
    frequency,
    delay = 0,
    resonance = 0.7
) {

    if (
        !audioReady ||
        !noiseBuffer
    ) {
        return;
    }

    const now =
        getAudioTime() +
        delay;

    const source =
        audioContext.createBufferSource();

    const filter =
        audioContext.createBiquadFilter();

    const gain =
        audioContext.createGain();

    source.buffer =
        noiseBuffer;

    filter.type =
        filterType;

    filter.frequency.value =
        frequency;

    filter.Q.value =
        resonance;

    gain.gain.setValueAtTime(
        0.0001,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        Math.max(
            0.0002,
            volume
        ),
        now + 0.004
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + duration
    );

    source.connect(filter);
    filter.connect(gain);
    gain.connect(masterGain);

    source.start(now);

    source.stop(
        now +
        duration +
        0.03
    );
}


/* =========================================================
   ROCKET WHISTLE
========================================================= */

function playRocketSound(
    power = 1
) {

    if (!audioReady) {
        return;
    }

    const duration =
        random(
            0.34,
            0.62
        );

    /*
        Main whistle.
    */

    createTone(
        random(260, 390),
        random(1200, 1900),
        duration,
        0.055 * power,
        "sine"
    );

    /*
        Harmonic gives the whistle more
        of a real rocket character.
    */

    createTone(
        random(520, 720),
        random(1900, 2700),
        duration * 0.82,
        0.017 * power,
        "triangle",
        0.015
    );

    /*
        Very quiet air rushing underneath.
    */

    createNoiseBurst(
        duration * 0.72,
        0.018 * power,
        "bandpass",
        1800
    );
}


/* =========================================================
   FIREWORK BOOM
========================================================= */

function playBoom(
    intensity = 1,
    size = "normal",
    delay = 0
) {

    if (!audioReady) {
        return;
    }

    let duration =
        0.32;

    let volume =
        0.24;

    if (size === "large") {

        duration =
            0.48;

        volume =
            0.30;
    }

    if (size === "soft") {

        duration =
            0.52;

        volume =
            0.16;
    }

    /*
        Deep low-frequency pressure wave.
    */

    createTone(
        random(70, 95),
        random(27, 40),
        duration,
        volume * intensity,
        "sine",
        delay
    );

    /*
        Slightly higher body of the explosion.
    */

    createTone(
        random(115, 155),
        random(45, 65),
        duration * 0.72,
        volume * 0.55 * intensity,
        "triangle",
        delay
    );

    /*
        The actual explosive "air" component.
    */

    createNoiseBurst(
        duration * 0.95,
        0.17 * intensity,
        "lowpass",
        random(700, 1100),
        delay,
        0.5
    );

    /*
        Very short high-energy transient.
    */

    createNoiseBurst(
        0.075,
        0.10 * intensity,
        "highpass",
        random(2800, 4600),
        delay
    );
}


/* =========================================================
   SHARP FIREWORK SNAP
========================================================= */

function playSnap(
    intensity = 1,
    delay = 0
) {

    if (!audioReady) {
        return;
    }

    createNoiseBurst(
        0.055,
        0.10 * intensity,
        "highpass",
        random(3500, 6500),
        delay
    );

    createTone(
        random(700, 1000),
        random(180, 300),
        0.12,
        0.025 * intensity,
        "triangle",
        delay
    );
}


/* =========================================================
   RANDOM CRACKLES
========================================================= */

function playCrackleSounds(
    amount = 12,
    intensity = 1,
    spread = 0.65
) {

    if (!audioReady) {
        return;
    }

    /*
        Keep the number of Web Audio nodes reasonable
        even when many fireworks are on screen.
    */

    amount =
        Math.min(
            amount,
            18
        );

    for (
        let i = 0;
        i < amount;
        i++
    ) {

        const delay =
            random(
                0.025,
                spread
            );

        createNoiseBurst(
            random(
                0.018,
                0.045
            ),
            random(
                0.018,
                0.045
            ) *
            intensity,
            "highpass",
            random(
                2500,
                7000
            ),
            delay
        );

        /*
            Some pops get a tiny pitched body.
        */

        if (
            Math.random() <
            0.42
        ) {

            createTone(
                random(
                    500,
                    1100
                ),
                random(
                    100,
                    260
                ),
                random(
                    0.045,
                    0.11
                ),
                random(
                    0.008,
                    0.018
                ) *
                intensity,
                "triangle",
                delay
            );
        }
    }
}


/* =========================================================
   STANDARD FIREWORK SOUND
========================================================= */

function playStandardFireworkSound(
    type,
    intensity = 1
) {

    if (!audioReady) {
        return;
    }

    if (type === "ring") {

        playBoom(
            intensity,
            "normal"
        );

        playSnap(
            intensity * 0.7,
            0.035
        );

        createTone(
            650,
            1800,
            0.38,
            0.025 * intensity,
            "sine",
            0.035
        );

        createNoiseBurst(
            0.38,
            0.028 * intensity,
            "bandpass",
            3200,
            0.04
        );

        return;
    }


    if (type === "doubleRing") {

        /*
            Two audible explosions corresponding
            to the two expanding rings.
        */

        playBoom(
            intensity,
            "normal",
            0
        );

        playSnap(
            intensity * 0.75,
            0.035
        );

        createTone(
            580,
            1600,
            0.32,
            0.022 * intensity,
            "sine",
            0.04
        );

        playBoom(
            intensity * 0.88,
            "normal",
            0.13
        );

        playSnap(
            intensity * 0.75,
            0.16
        );

        createTone(
            720,
            2200,
            0.34,
            0.020 * intensity,
            "sine",
            0.17
        );

        return;
    }


    if (type === "willow") {

        playBoom(
            intensity * 0.82,
            "soft"
        );

        createNoiseBurst(
            0.95,
            0.055 * intensity,
            "lowpass",
            1500,
            0.08
        );

        playCrackleSounds(
            7,
            intensity * 0.7,
            0.95
        );

        return;
    }


    if (type === "crackle") {

        playBoom(
            intensity,
            "normal"
        );

        playSnap(
            intensity,
            0.035
        );

        playCrackleSounds(
            17,
            intensity,
            0.72
        );

        return;
    }


    if (type === "chrysanthemum") {

        playBoom(
            intensity * 1.05,
            "large"
        );

        playSnap(
            intensity,
            0.035
        );

        createNoiseBurst(
            0.48,
            0.055 * intensity,
            "bandpass",
            2300,
            0.045
        );

        playCrackleSounds(
            8,
            intensity * 0.7,
            0.60
        );

        return;
    }


    if (type === "peony") {

        playBoom(
            intensity,
            "large"
        );

        playSnap(
            intensity * 0.85,
            0.035
        );

        return;
    }


    if (type === "fan") {

        playBoom(
            intensity * 0.75,
            "normal"
        );

        playSnap(
            intensity * 0.75,
            0.05
        );

        playSnap(
            intensity * 0.68,
            0.17
        );

        playSnap(
            intensity * 0.60,
            0.29
        );

        return;
    }


    if (type === "heart") {

        playBoom(
            intensity * 0.82,
            "soft"
        );

        createTone(
            680,
            440,
            0.30,
            0.025 * intensity,
            "sine",
            0.05
        );

        createTone(
            880,
            540,
            0.30,
            0.021 * intensity,
            "sine",
            0.16
        );

        return;
    }


    if (type === "spiral") {

        playBoom(
            intensity,
            "normal"
        );

        createTone(
            350,
            1250,
            0.55,
            0.025 * intensity,
            "triangle",
            0.04
        );

        createTone(
            1250,
            380,
            0.48,
            0.018 * intensity,
            "sine",
            0.19
        );

        return;
    }


    if (type === "cross") {

        playBoom(
            intensity,
            "normal"
        );

        playSnap(
            intensity,
            0.06
        );

        playSnap(
            intensity * 0.85,
            0.19
        );

        return;
    }


    if (type === "rainbow") {

        playBoom(
            intensity,
            "large"
        );

        createTone(
            520,
            1050,
            0.42,
            0.024 * intensity,
            "sine",
            0.04
        );

        createTone(
            660,
            1320,
            0.42,
            0.020 * intensity,
            "sine",
            0.07
        );

        createTone(
            780,
            1560,
            0.42,
            0.017 * intensity,
            "sine",
            0.10
        );

        return;
    }


    if (type === "golden") {

        playBoom(
            intensity,
            "large"
        );

        createNoiseBurst(
            0.80,
            0.048 * intensity,
            "bandpass",
            4200,
            0.06
        );

        playCrackleSounds(
            10,
            intensity * 0.72,
            0.90
        );

        return;
    }


    /*
        Sphere and other standard fireworks.
    */

    playBoom(
        intensity,
        "normal"
    );

    playSnap(
        intensity * 0.82,
        0.035
    );
}


/* =========================================================
   TEXT FIREWORK SOUND
========================================================= */

function playTextFireworkSound(
    intensity = 1.25
) {

    if (!audioReady) {
        return;
    }

    /*
        Large launch.
    */

    createTone(
        180,
        1050,
        0.65,
        0.065 * intensity,
        "sine"
    );

    createTone(
        360,
        2100,
        0.55,
        0.018 * intensity,
        "triangle",
        0.02
    );

    createNoiseBurst(
        0.50,
        0.025 * intensity,
        "bandpass",
        1900
    );

    /*
        Big explosion when the letters form.
    */

    playBoom(
        intensity,
        "large",
        0.58
    );

    playSnap(
        intensity,
        0.61
    );

    /*
        Sparkling formation sound.
    */

    for (
        let i = 0;
        i < 8;
        i++
    ) {

        const delay =
            0.70 +
            i * 0.075;

        createNoiseBurst(
            0.035,
            0.016 * intensity,
            "highpass",
            random(3500, 7000),
            delay
        );
    }
}

const rockets = [];
const particles = [];

const palettes = [

/* =========================================================
   HELPERS
========================================================= */

function random(
    min,
    max
) {

    return Math.random() *
        (max - min) +
        min;
}

function randomInt(
    min,
    max
) {

    return Math.floor(
        random(
            min,
            max + 1
        )
    );
}

function pick(
    array
) {

    return array[
        Math.floor(
            Math.random() *
            array.length
        )
    ];
}

function clamp(
    value,
    min,
    max
) {

    return Math.max(
        min,
        Math.min(
            max,
            value
        )
    );
}

/* =========================================================
   CREATE ROCKET
========================================================= */

function createRocket(
    targetX,
    targetY,
    palette,
    type,
    power = 1,
    text = null,
    delay = 0
) {

    const startX =
        random(
            width * 0.08,
            width * 0.92
        );

    const startY =
        height +
        random(
            15,
            80
        );

    const dx =
        targetX -
        startX;

    const dy =
        targetY -
        startY;

    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );

    const speed =
        random(
            8.5,
            11.5
        ) *
        power;

    rockets.push({

        x: startX,
        y: startY,

        vx:
            dx /
            distance *
            speed,

        vy:
            dy /
            distance *
            speed,

        targetX,
        targetY,

        palette,
        type,

        age:
            -delay,

        trail: [],

        text,
        exploded: false
    });

    if (delay === 0) {

        playRocketSound(
            Math.min(
                power,
                1.5
            )
        );
    }
}


/* =========================================================
   CREATE EXPLOSION
========================================================= */

function createExplosion(
    rocket
) {

    const {
        x,
        y,
        palette,
        type
    } = rocket;

    const baseCount = {

        sphere: 110,
        ring: 120,
        doubleRing: 105,
        willow: 130,
        crackle: 125,
        chrysanthemum: 145,
        peony: 125,
        fan: 100,
        heart: 105,
        spiral: 120,
        cross: 115,
        rainbow: 150,
        golden: 135

    }[type] || 110;

    const count =
        Math.floor(
            baseCount *
            random(
                0.82,
                1.12
            )
        );


    for (
        let i = 0;
        i < count;
        i++
    ) {

        let angle;
        let speed;

        if (
            type === "ring"
        ) {

            angle =
                Math.PI * 2 * i /
                count +
                random(
                    -0.025,
                    0.025
                );

            speed =
                random(
                    3.2,
                    5.8
                );

        } else if (
            type === "doubleRing"
        ) {

            const ring =
                i % 2 === 0
                    ? 0
                    : 1;

            angle =
                Math.PI * 2 *
                Math.floor(i / 2) /
                Math.ceil(count / 2) +
                random(
                    -0.025,
                    0.025
                );

            speed =
                ring === 0
                    ? random(
                        3.0,
                        4.4
                    )
                    : random(
                        5.2,
                        6.8
                    );

        } else if (
            type === "fan"
        ) {

            angle =
                Math.PI *
                random(
                    1.08,
                    1.92
                );

            speed =
                random(
                    3.5,
                    7
                );

        } else if (
            type === "heart"
        ) {

            const t =
                Math.PI * 2 *
                i /
                count;

            const hx =
                16 *
                Math.pow(
                    Math.sin(t),
                    3
                );

            const hy =
                -(
                    13 *
                    Math.cos(t) -
                    5 *
                    Math.cos(
                        2 * t
                    ) -
                    2 *
                    Math.cos(
                        3 * t
                    ) -
                    Math.cos(
                        4 * t
                    )
                );

            const scale =
                random(
                    0.20,
                    0.34
                );

            particles.push({

                x,
                y,

                vx:
                    hx *
                    scale,

                vy:
                    hy *
                    scale,

                gravity:
                    0.012,

                drag:
                    0.985,

                life:
                    random(
                        100,
                        150
                    ),

                maxLife:
                    150,

                size:
                    random(
                        1.1,
                        2.5
                    ),

                color:
                    pick(palette),

                twinkle:
                    Math.random() *
                    Math.PI *
                    2
            });

            continue;

        } else if (
            type === "spiral"
        ) {

            angle =
                i *
                0.21 +
                random(
                    -0.03,
                    0.03
                );

            speed =
                2.4 +
                i /
                count *
                4.2;

        } else if (
            type === "cross"
        ) {

            const arm =
                i % 4;

            angle =
                arm *
                Math.PI /
                2 +
                random(
                    -0.055,
                    0.055
                );

            speed =
                random(
                    3.0,
                    6.5
                );

        } else if (
            type === "rainbow"
        ) {

            angle =
                Math.PI * 2 *
                i /
                count +
                random(
                    -0.025,
                    0.025
                );

            speed =
                random(
                    3.0,
                    6.2
                );

        } else {

            angle =
                random(
                    0,
                    Math.PI * 2
                );

            speed =
                random(
                    2.8,
                    6.5
                );
        }


        const vx =
            Math.cos(angle) *
            speed;

        const vy =
            Math.sin(angle) *
            speed;


        let gravity =
            0.025;

        let drag =
            0.982;

        let life =
            random(
                72,
                125
            );


        if (
            type === "willow"
        ) {

            gravity =
                random(
                    0.035,
                    0.055
                );

            drag =
                random(
                    0.975,
                    0.988
                );

            life =
                random(
                    125,
                    190
                );
        }


        if (
            type === "crackle"
        ) {

            gravity =
                0.032;

            drag =
                0.979;

            life =
                random(
                    75,
                    120
                );
        }


        if (
            type === "golden"
        ) {

            gravity =
                random(
                    0.025,
                    0.045
                );

            drag =
                0.983;

            life =
                random(
                    110,
                    175
                );
        }


        particles.push({

            x,
            y,

            vx,
            vy,

            gravity,
            drag,

            life,
            maxLife:
                life,

            size:
                type === "crackle"
                    ? random(
                        1.0,
                        2.3
                    )
                    : random(
                        1.2,
                        2.7
                    ),

            color:
                type === "rainbow"
                    ? `hsl(${
                        Math.floor(
                            i /
                            count *
                            360
                        )
                    },100%,70%)`
                    : pick(palette),

            twinkle:
                Math.random() *
                Math.PI *
                2,

            crackle:
                type === "crackle"
        });
    }


    /*
        Central flash.
    */

    for (
        let i = 0;
        i < 20;
        i++
    ) {

        const angle =
            random(
                0,
                Math.PI * 2
            );

        const speed =
            random(
                0.5,
                3.2
            );

        particles.push({

            x,
            y,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            gravity:
                0.01,

            drag:
                0.94,

            life:
                random(
                    15,
                    28
                ),

            maxLife:
                28,

            size:
                random(
                    1.5,
                    3.5
                ),

            color:
                "#ffffff",

            twinkle:
                Math.random() *
                Math.PI *
                2
        });
    }


    playStandardFireworkSound(
        type,
        1
    );
}

/* =========================================================
   TEXT TARGETS
========================================================= */

function createLetterTargets(
    text
) {

    text =
        text
            .toUpperCase()
            .replace(
                /[^A-Z ]/g,
                ""
            );

    if (!text) {
        text = "ZAYDEN";
    }

    const cell =
        clamp(
            Math.min(
                22,
                width /
                    Math.max(
                        text.length *
                        6.2,
                        1
                    ),
                height / 10
            ),
            7,
            22
        );

    const letterWidth =
        5 * cell;

    const spacing =
        cell * 1.35;

    const totalWidth =
        text.length *
        letterWidth +
        Math.max(
            0,
            text.length - 1
        ) *
        spacing;

    const startX =
        (
            width -
            totalWidth
        ) / 2;

    const startY =
        height * 0.38;

    const targets = [];

    for (
        let letterIndex = 0;
        letterIndex <
            text.length;
        letterIndex++
    ) {

        const letter =
            FONT[
                text[
                    letterIndex
                ]
            ] ||
            FONT[" "];


        const offsetX =
            startX +
            letterIndex *
            (
                letterWidth +
                spacing
            );


        for (
            let row = 0;
            row < 7;
            row++
        ) {

            for (
                let col = 0;
                col < 5;
                col++
            ) {

                if (
                    letter[row][col] ===
                    "1"
                ) {

                    targets.push({

                        x:
                            offsetX +
                            col * cell +
                            cell / 2,

                        y:
                            startY +
                            row * cell +
                            cell / 2
                    });
                }
            }
        }
    }

    return targets;
}

/* =========================================================
   TEXT EXPLOSION
========================================================= */

function createTextExplosion(
    rocket
) {

    textParticles.length = 0;

    const targets =
        rocket.textTargets ||
        [];

    const palette =
        rocket.palette;

    if (!targets.length) {
        return;
    }

    const centerX =
        rocket.x;

    const centerY =
        rocket.y;


    for (
        let i = 0;
        i < targets.length &&
        textParticles.length <
            MAX_TEXT_PARTICLES;
        i++
    ) {

        const target =
            targets[i];

        const angle =
            random(
                0,
                Math.PI * 2
            );

        const distance =
            random(
                40,
                150
            );

        textParticles.push({

            x:
                centerX +
                Math.cos(angle) *
                distance,

            y:
                centerY +
                Math.sin(angle) *
                distance,

            vx:
                random(
                    -1.5,
                    1.5
                ),

            vy:
                random(
                    -1.5,
                    1.5
                ),

            targetX:
                target.x,

            targetY:
                target.y,

            life: 0,

            maxLife:
                300,

            size:
                random(
                    1.5,
                    3
                ),

            color:
                pick(palette),

            phase:
                random(
                    0,
                    Math.PI * 2
                )
        });
    }


    for (
        let i = 0;
        i < 80;
        i++
    ) {

        if (
            textParticles.length >=
            MAX_TEXT_PARTICLES
        ) {
            break;
        }

        const angle =
            random(
                0,
                Math.PI * 2
            );

        const speed =
            random(
                1.5,
                5.5
            );

        textParticles.push({

            x: centerX,
            y: centerY,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            targetX:
                centerX,

            targetY:
                centerY,

            life: 0,

            maxLife:
                random(
                    35,
                    70
                ),

            size:
                random(
                    1,
                    2
                ),

            color:
                pick(palette),

            phase:
                random(
                    0,
                    Math.PI * 2
                ),

            spark: true
        });
    }


    playTextFireworkSound(
        1.25
    );
}


/* =========================================================
   UPDATE TEXT PARTICLES
========================================================= */

function updateTextParticles() {

    for (
        let i =
            textParticles.length - 1;
        i >= 0;
        i--
    ) {

        const p =
            textParticles[i];

        p.life++;


        if (p.spark) {

            p.x += p.vx;
            p.y += p.vy;

            p.vx *= 0.97;
            p.vy *= 0.97;

        } else {

            const dx =
                p.targetX -
                p.x;

            const dy =
                p.targetY -
                p.y;


            if (
                p.life < 38
            ) {

                p.vx +=
                    dx *
                    0.035;

                p.vy +=
                    dy *
                    0.035;

                p.vx *= 0.82;
                p.vy *= 0.82;

                p.x += p.vx;
                p.y += p.vy;

            } else {

                p.x =
                    p.targetX +
                    Math.sin(
                        p.life *
                        0.09 +
                        p.phase
                    ) *
                    0.45;

                p.y =
                    p.targetY +
                    Math.cos(
                        p.life *
                        0.08 +
                        p.phase
                    ) *
                    0.45;
            }
        }


        if (
            p.life >
            p.maxLife
        ) {

            textParticles.splice(
                i,
                1
            );
        }
    }
}


/* =========================================================
   UPDATE PARTICLES
========================================================= */

function updateParticles() {

    for (
        let i =
            particles.length - 1;
        i >= 0;
        i--
    ) {

        const p =
            particles[i];

        p.vx *= p.drag;
        p.vy *= p.drag;

        p.vy +=
            p.gravity;

        p.x += p.vx;
        p.y += p.vy;

        p.life--;


        if (
            p.crackle &&
            Math.random() <
                0.025
        ) {

            for (
                let j = 0;
                j < 3;
                j++
            ) {

                const angle =
                    random(
                        0,
                        Math.PI * 2
                    );

                const speed =
                    random(
                        1,
                        3
                    );

                particles.push({

                    x: p.x,
                    y: p.y,

                    vx:
                        Math.cos(angle) *
                        speed,

                    vy:
                        Math.sin(angle) *
                        speed,

                    gravity:
                        0.035,

                    drag:
                        0.96,

                    life:
                        random(
                            20,
                            40
                        ),

                    maxLife:
                        40,

                    size:
                        random(
                            0.8,
                            1.8
                        ),

                    color:
                        "#ffffff",

                    twinkle:
                        Math.random() *
                        Math.PI *
                        2
                });
            }
        }


        if (
            p.life <= 0
        ) {

            particles.splice(
                i,
                1
            );
        }
    }
}


/* =========================================================
   UPDATE ROCKETS
========================================================= */

function updateRockets() {

    for (
        let i =
            rockets.length - 1;
        i >= 0;
        i--
    ) {

        const r =
            rockets[i];

        r.age++;

        if (
            r.age < 0
        ) {
            continue;
        }


        r.trail.push({

            x: r.x,
            y: r.y

        });


        if (
            r.trail.length >
            9
        ) {

            r.trail.shift();
        }


        r.x += r.vx;
        r.y += r.vy;

        r.vy +=
            0.018;


        const dx =
            r.targetX -
            r.x;

        const dy =
            r.targetY -
            r.y;

        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        if (
            distance < 18 ||
            r.y <= r.targetY
        ) {

            if (
                !r.exploded
            ) {

                r.exploded =
                    true;


                if (
                    r.type === "text"
                ) {

                    createTextExplosion(
                        r
                    );

                } else {

                    createExplosion(
                        r
                    );
                }
            }


            rockets.splice(
                i,
                1
            );
        }
    }
}


/* =========================================================
   DRAW ROCKETS
========================================================= */

function drawRockets() {

    for (
        const r of rockets
    ) {

        if (
            r.age < 0
        ) {
            continue;
        }


        for (
            let i = 0;
            i < r.trail.length;
            i++
        ) {

            const point =
                r.trail[i];

            const alpha =
                i /
                r.trail.length;

            ctx.globalAlpha =
                alpha *
                0.55;

            ctx.fillStyle =
                "#ffffff";

            ctx.beginPath();

            ctx.arc(
                point.x,
                point.y,
                1.5,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }


        ctx.globalAlpha =
            1;

        ctx.fillStyle =
            "#ffffff";

        ctx.beginPath();

        ctx.arc(
            r.x,
            r.y,
            2.2,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }
}


/* =========================================================
   DRAW PARTICLES
========================================================= */

function drawParticles() {

    for (
        const p of particles
    ) {

        const alpha =
            clamp(
                p.life /
                p.maxLife,
                0,
                1
            );

        const twinkle =
            0.72 +
            Math.sin(
                p.life *
                0.35 +
                p.twinkle
            ) *
            0.28;

        ctx.globalAlpha =
            alpha *
            twinkle;

        ctx.fillStyle =
            p.color;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.globalAlpha =
        1;
}


/* =========================================================
   DRAW TEXT PARTICLES
========================================================= */

function drawTextParticles() {

    for (
        const p of textParticles
    ) {

        const alpha =
            p.spark
                ? clamp(
                    1 -
                    p.life /
                    p.maxLife,
                    0,
                    1
                )
                : 0.82 +
                  Math.sin(
                      p.life *
                      0.12 +
                      p.phase
                  ) *
                  0.18;

        ctx.globalAlpha =
            alpha;

        ctx.fillStyle =
            p.color;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fill();


        if (!p.spark) {

            ctx.globalAlpha =
                alpha *
                0.25;

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                p.size *
                3.5,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }
    }

    ctx.globalAlpha =
        1;
}


/* =========================================================
   SHOW SETTINGS
========================================================= */

const SHOW_DURATION =
    5 * 60 * 1000;

const FIREWORK_BUFFER =
    400;

const MIN_LAUNCH_INTERVAL =
    550;

const MAX_LAUNCH_INTERVAL =
    800;

const MAX_ROCKETS =
    28;

const MAX_PARTICLES =
    3400;

const MAX_TEXT_PARTICLES =
    700;


/* =========================================================
   SHOW STATE
========================================================= */

let showRunning =
    false;

let finaleRunning =
    false;

let showFinished =
    false;

let showStartTime =
    0;

let nextLaunchTime =
    0;

let nextSpecialTime =
    0;

let showItemIndex =
    0;

let birthdayName =
    "ZAYDEN";


/* =========================================================
   LAUNCH SHOW ITEM
========================================================= */

function launchShowItem(
    intensity = 1
) {

    if (
        rockets.length >=
            MAX_ROCKETS ||
        particles.length >=
            MAX_PARTICLES *
            0.88
    ) {
        return;
    }


    const item =
        showItems[
            showItemIndex %
            showItems.length
        ];

    showItemIndex++;


    const palette =
        palettes[
            item.palette %
            palettes.length
        ];


    const power =
        random(
            0.88,
            1.12
        ) *
        intensity;


    for (
        let i = 0;
        i < item.count;
        i++
    ) {

        const targetX =
            random(
                width * 0.10,
                width * 0.90
            );

        const targetY =
            random(
                height * 0.13,
                height * 0.53
            );


        createRocket(

            targetX,
            targetY,

            palette,

            item.type,

            power
        );
    }
}


/* =========================================================
   SPECIAL SEQUENCE
========================================================= */

function specialSequence(
    intensity
) {

    const sequence =
        randomInt(
            0,
            5
        );


    if (
        sequence === 0
    ) {

        for (
            let i = 0;
            i < 4;
            i++
        ) {

            setTimeout(
                () => {

                    if (
                        !showRunning
                    ) {
                        return;
                    }

                    launchShowItem(
                        intensity *
                        random(
                            0.9,
                            1.15
                        )
                    );

                },
                i * 180
            );
        }


    } else if (
        sequence === 1
    ) {

        for (
            let i = 0;
            i < 6;
            i++
        ) {

            setTimeout(
                () => {

                    if (
                        !showRunning
                    ) {
                        return;
                    }

                    const palette =
                        palettes[
                            randomInt(
                                0,
                                palettes.length - 1
                            )
                        ];


                    createRocket(

                        width *
                        random(
                            0.12,
                            0.88
                        ),

                        height *
                        random(
                            0.18,
                            0.50
                        ),

                        palette,

                        pick([
                            "ring",
                            "sphere",
                            "doubleRing"
                        ]),

                        intensity
                    );

                },
                i * 145
            );
        }


    } else if (
        sequence === 2
    ) {

        for (
            let i = 0;
            i < 5;
            i++
        ) {

            setTimeout(
                () => {

                    if (
                        !showRunning
                    ) {
                        return;
                    }

                    const palette =
                        palettes[
                            randomInt(
                                0,
                                palettes.length - 1
                            )
                        ];


                    createRocket(

                        width *
                        (
                            0.20 +
                            i *
                            0.15
                        ),

                        height *
                        random(
                            0.20,
                            0.46
                        ),

                        palette,

                        pick([
                            "fan",
                            "cross",
                            "spiral"
                        ]),

                        intensity
                    );

                },
                i * 170
            );
        }


    } else if (
        sequence === 3
    ) {

        for (
            let i = 0;
            i < 3;
            i++
        ) {

            setTimeout(
                () => {

                    if (
                        !showRunning
                    ) {
                        return;
                    }

                    launchShowItem(
                        intensity *
                        1.25
                    );

                },
                i * 230
            );
        }


    } else if (
        sequence === 4
    ) {

        for (
            let i = 0;
            i < 7;
            i++
        ) {

            setTimeout(
                () => {

                    if (
                        !showRunning
                    ) {
                        return;
                    }

                    const palette =
                        palettes[
                            randomInt(
                                0,
                                palettes.length - 1
                            )
                        ];


                    createRocket(

                        width *
                        random(
                            0.08,
                            0.92
                        ),

                        height *
                        random(
                            0.15,
                            0.48
                        ),

                        palette,

                        pick([
                            "willow",
                            "golden",
                            "crackle"
                        ]),

                        intensity
                    );

                },
                i * 130
            );
        }


    } else {

        for (
            let i = 0;
            i < 8;
            i++
        ) {

            setTimeout(
                () => {

                    if (
                        !showRunning
                    ) {
                        return;
                    }

                    launchShowItem(
                        intensity *
                        random(
                            0.95,
                            1.3
                        )
                    );

                },
                i * 115
            );
        }
    }
}


/* =========================================================
   MAIN SHOW SCHEDULER
========================================================= */

function scheduleMainShow(
    now
) {

    if (
        !showRunning ||
        finaleRunning
    ) {
        return;
    }


    const elapsed =
        now -
        showStartTime;


    const progress =
        clamp(
            elapsed /
            SHOW_DURATION,
            0,
            1
        );


    if (
        elapsed >=
        SHOW_DURATION
    ) {

        beginFinale();

        return;
    }


    let intensity =
        1;


    if (
        progress > 0.55
    ) {
        intensity +=
            0.18;
    }


    if (
        progress > 0.70
    ) {
        intensity +=
            0.25;
    }


    if (
        progress > 0.80
    ) {
        intensity +=
            0.65;
    }


    if (
        progress > 0.93
    ) {
        intensity +=
            0.8;
    }


    if (
        now +
        FIREWORK_BUFFER >=
        nextLaunchTime
    ) {

        launchShowItem(
            intensity
        );

        nextLaunchTime =
            now +
            random(
                MIN_LAUNCH_INTERVAL,
                MAX_LAUNCH_INTERVAL
            );
    }


    if (
        now +
        FIREWORK_BUFFER >=
        nextSpecialTime
    ) {

        specialSequence(
            intensity
        );

        nextSpecialTime =
            now +
            random(
                2600,
                5200
            );
    }


    if (
        progress > 0.92 &&
        Math.random() <
            0.018
    ) {

        specialSequence(
            intensity *
            1.35
        );
    }
}


/* =========================================================
   FINALE
========================================================= */

function beginFinale() {

    if (
        finaleRunning ||
        showFinished
    ) {
        return;
    }


    showRunning =
        false;

    finaleRunning =
        true;


    rockets.length = 0;
    particles.length = 0;
    textParticles.length = 0;


    const palette = [

        "#ffffff",
        "#ffe066",
        "#74c0fc",
        "#ff6b6b"

    ];


    const happyTargets =
        createLetterTargets(
            "HAPPY"
        );

    const birthdayTargets =
        createLetterTargets(
            "BIRTHDAY"
        );

    const nameTargets =
        createLetterTargets(
            birthdayName
        );


    /*
        HAPPY
    */

    setTimeout(
        () => {

            createTextRocket(

                width * 0.50,

                height * 0.34,

                palette,

                happyTargets

            );

        },
        400
    );


    /*
        BIRTHDAY
    */

    setTimeout(
        () => {

            createTextRocket(

                width * 0.50,

                height * 0.34,

                palette,

                birthdayTargets

            );

        },
        5000
    );


    /*
        NAME
    */

    setTimeout(
        () => {

            createTextRocket(

                width * 0.50,

                height * 0.34,

                palette,

                nameTargets

            );

        },
        9700
    );


    /*
        FINAL NAME
    */

    setTimeout(
        () => {

            createTextRocket(

                width * 0.50,

                height * 0.34,

                palette,

                nameTargets

            );

        },
        13500
    );


    /*
        Finish.
    */

    setTimeout(
        () => {

            finaleRunning =
                false;

            setTimeout(
                () => {

                    showFinished =
                        true;

                },
                1600
            );

        },
        18100
    );
}


/* =========================================================
   BACKGROUND
========================================================= */

function drawBackground() {

    ctx.globalCompositeOperation =
        "source-over";

    ctx.fillStyle =
        "rgba(0, 0, 8, 0.22)";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );
}


/* =========================================================
   DRAW
========================================================= */

function draw() {

    drawBackground();

    ctx.globalCompositeOperation =
        "lighter";

    drawRockets();

    drawParticles();

    drawTextParticles();

    ctx.globalCompositeOperation =
        "source-over";

    ctx.globalAlpha =
        1;
}


/* =========================================================
   MAIN LOOP
========================================================= */

function loop(
    now
) {

    if (
        showRunning
    ) {

        scheduleMainShow(
            now
        );
    }


    updateRockets();

    updateParticles();

    updateTextParticles();

    draw();


    requestAnimationFrame(
        loop
    );
}


requestAnimationFrame(
    loop
);


/* =========================================================
   START
========================================================= */

const startScreen =
    document.getElementById(
        "startScreen"
    );

const nameInput =
    document.getElementById(
        "nameInput"
    );

const startButton =
    document.getElementById(
        "startButton"
    );


function startShow() {

    if (
        showRunning ||
        finaleRunning
    ) {
        return;
    }


    /*
        Must happen from the button tap/click
        for mobile audio permissions.
    */

    initAudio();


    let enteredName =
        nameInput.value
            .toUpperCase()
            .replace(
                /[^A-Z ]/g,
                ""
            )
            .replace(
                /\s+/g,
                " "
            )
            .trim()
            .slice(
                0,
                20
            );


    if (
        !enteredName
    ) {

        enteredName =
            "ZAYDEN";
    }


    birthdayName =
        enteredName;


    startScreen.classList.add(
        "hidden"
    );


    rockets.length = 0;

    particles.length = 0;

    textParticles.length = 0;


    showItemIndex =
        0;


    showRunning =
        true;

    finaleRunning =
        false;

    showFinished =
        false;


    showStartTime =
        performance.now();


    const now =
        showStartTime;


    nextLaunchTime =
        now + 100;

    nextSpecialTime =
        now + 1200;
}


startButton.addEventListener(
    "click",
    startShow
);


/* =========================================================
   ENTER TO START
========================================================= */

nameInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Enter"
        ) {

            startButton.click();
        }
    }
);


/* =========================================================
   TOUCH / GESTURE PREVENTION
========================================================= */

document.addEventListener(
    "touchmove",
    event => {

        event.preventDefault();

    },
    {
        passive: false
    }
);


document.addEventListener(
    "gesturestart",
    event => {

        event.preventDefault();

    }
);


document.addEventListener(
    "dblclick",
    event => {

        event.preventDefault();

    }
);

</script>
