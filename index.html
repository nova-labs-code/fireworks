"use strict";

/* =========================================================
   CANVAS
========================================================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let width = 0;
let height = 0;
let dpr = 1;

function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);

    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resize);
resize();


/* =========================================================
   AUDIO
   Explosion sounds only.
   NO ROCKET WHISTLE.
========================================================= */

let audioContext = null;
let masterGain = null;
let compressor = null;
let noiseBuffer = null;

function initAudio() {
    if (audioContext) {
        if (audioContext.state === "suspended") {
            audioContext.resume();
        }
        return;
    }

    const AudioCtx =
        window.AudioContext ||
        window.webkitAudioContext;

    if (!AudioCtx) {
        return;
    }

    audioContext = new AudioCtx();

    compressor = audioContext.createDynamicsCompressor();

    compressor.threshold.value = -24;
    compressor.knee.value = 20;
    compressor.ratio.value = 8;
    compressor.attack.value = 0.003;
    compressor.release.value = 0.18;

    masterGain = audioContext.createGain();
    masterGain.gain.value = 0.72;

    compressor.connect(masterGain);
    masterGain.connect(audioContext.destination);

    createNoiseBuffer();

    if (audioContext.state === "suspended") {
        audioContext.resume();
    }
}

function createNoiseBuffer() {
    if (!audioContext) return;

    const length =
        Math.floor(audioContext.sampleRate * 2);

    noiseBuffer =
        audioContext.createBuffer(
            1,
            length,
            audioContext.sampleRate
        );

    const data =
        noiseBuffer.getChannelData(0);

    for (let i = 0; i < length; i++) {
        data[i] =
            Math.random() * 2 - 1;
    }
}

function getAudioTime() {
    return audioContext
        ? audioContext.currentTime
        : 0;
}

function createTone(
    frequency,
    duration,
    volume,
    type = "sine",
    startTime = null,
    endFrequency = null
) {
    if (!audioContext) return;

    const now =
        startTime === null
            ? getAudioTime()
            : startTime;

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type = type;

    oscillator.frequency.setValueAtTime(
        frequency,
        now
    );

    if (endFrequency !== null) {
        oscillator.frequency.exponentialRampToValueAtTime(
            Math.max(20, endFrequency),
            now + duration
        );
    }

    gain.gain.setValueAtTime(
        0.0001,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        Math.max(0.0001, volume),
        now + Math.min(0.008, duration * 0.15)
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + duration
    );

    oscillator.connect(gain);
    gain.connect(compressor);

    oscillator.start(now);
    oscillator.stop(now + duration + 0.03);
}

function createNoiseBurst(
    duration,
    volume,
    filterFrequency,
    startTime = null
) {
    if (!audioContext || !noiseBuffer) return;

    const now =
        startTime === null
            ? getAudioTime()
            : startTime;

    const source =
        audioContext.createBufferSource();

    source.buffer = noiseBuffer;

    const filter =
        audioContext.createBiquadFilter();

    filter.type = "lowpass";
    filter.frequency.value =
        filterFrequency;
    filter.Q.value = 0.7;

    const gain =
        audioContext.createGain();

    gain.gain.setValueAtTime(
        0.0001,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        Math.max(0.0001, volume),
        now + 0.004
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + duration
    );

    source.connect(filter);
    filter.connect(gain);
    gain.connect(compressor);

    source.start(now);
    source.stop(now + duration + 0.02);
}

function playBoom(strength = 1) {
    if (!audioContext) return;

    const now = getAudioTime();

    createTone(
        55,
        0.45,
        0.34 * strength,
        "sine",
        now,
        28
    );

    createTone(
        85,
        0.28,
        0.20 * strength,
        "triangle",
        now,
        38
    );

    createNoiseBurst(
        0.30,
        0.22 * strength,
        900,
        now
    );
}

function playSnap(strength = 1) {
    if (!audioContext) return;

    const now = getAudioTime();

    createNoiseBurst(
        0.055,
        0.13 * strength,
        6500,
        now
    );

    createTone(
        1150,
        0.055,
        0.07 * strength,
        "square",
        now,
        480
    );
}

function playCrackleSounds(
    amount = 1,
    strength = 1
) {
    if (!audioContext) return;

    const now = getAudioTime();

    const count =
        Math.floor(3 + amount * 5);

    for (let i = 0; i < count; i++) {
        const delay =
            Math.random() * 0.34;

        createNoiseBurst(
            0.018 + Math.random() * 0.035,
            0.025 * strength,
            3500 + Math.random() * 4000,
            now + delay
        );
    }
}

function playStandardFireworkSound(type) {
    if (!audioContext) return;

    if (
        type === "crackle" ||
        type === "willow"
    ) {
        playBoom(0.85);
        playCrackleSounds(1.4, 1);
        return;
    }

    if (
        type === "doubleRing" ||
        type === "ring"
    ) {
        playBoom(0.95);
        playSnap(0.8);
        return;
    }

    if (
        type === "fan"
    ) {
        playBoom(0.75);
        playSnap(0.6);
        return;
    }

    playBoom(0.82);
    playSnap(0.45);
}

function playTextFireworkSound() {
    if (!audioContext) return;

    /*
       Deliberately no launch sound.
       This is ONLY the explosion.
    */

    const now = getAudioTime();

    createNoiseBurst(
        0.12,
        0.22,
        5200,
        now
    );

    createTone(
        62,
        0.55,
        0.38,
        "sine",
        now,
        25
    );

    createTone(
        92,
        0.34,
        0.23,
        "triangle",
        now,
        35
    );

    createNoiseBurst(
        0.28,
        0.20,
        1100,
        now
    );

    playCrackleSounds(
        1.8,
        1.15
    );
}


/* =========================================================
   UTILITIES
========================================================= */

function random(min, max) {
    return Math.random() *
        (max - min) + min;
}

function randomInt(min, max) {
    return Math.floor(
        random(min, max + 1)
    );
}

function pick(array) {
    return array[
        Math.floor(
            Math.random() * array.length
        )
    ];
}

function clamp(value, min, max) {
    return Math.max(
        min,
        Math.min(max, value)
    );
}

/* =========================================================
   PARTICLE SYSTEM
========================================================= */

const particles = [];
const rockets = [];
const textParticles = [];

const MAX_ROCKETS = 28;
const MAX_PARTICLES = 3400;

const GRAVITY = 0.035;

function addParticle(
    x,
    y,
    vx,
    vy,
    color,
    life = 80,
    size = 1.2,
    alpha = 1
) {
    if (
        particles.length >= MAX_PARTICLES
    ) {
        return;
    }

    particles.push({
        x,
        y,
        vx,
        vy,
        color,
        life,
        maxLife: life,
        size,
        alpha,
        friction: random(0.982, 0.994),
        gravity: GRAVITY * random(0.65, 1.15),
        twinkle: Math.random() < 0.32
    });
}


/* =========================================================
   NORMAL ROCKET
========================================================= */

function createRocket(
    targetX,
    targetY,
    type,
    palette
) {
    if (rockets.length >= MAX_ROCKETS) {
        return;
    }

    const x =
        random(
            width * 0.10,
            width * 0.90
        );

    const y = height + 15;

    const dx = targetX - x;
    const dy = targetY - y;

    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );

    const speed =
        random(8.5, 11.5);

    rockets.push({
        x,
        y,
        vx: dx / distance * speed,
        vy: dy / distance * speed,
        targetX,
        targetY,
        type,
        palette,
        trail: [],
        dead: false
    });
}


/* =========================================================
   NORMAL EXPLOSIONS
========================================================= */

function createExplosion(
    x,
    y,
    type,
    palette
) {
    const baseCount =
        randomInt(105, 175);

    playStandardFireworkSound(type);

    if (type === "sphere") {

        for (let i = 0; i < baseCount; i++) {

            const angle =
                random(0, Math.PI * 2);

            const speed =
                random(2.2, 7.3);

            addParticle(
                x,
                y,
                Math.cos(angle) * speed,
                Math.sin(angle) * speed,
                pick(palette),
                randomInt(55, 100),
                random(0.8, 1.7)
            );
        }

        return;
    }

    if (type === "ring") {

        const count = 155;

        for (let i = 0; i < count; i++) {

            const angle =
                i / count *
                Math.PI * 2;

            const speed =
                random(4.6, 6.4);

            addParticle(
                x,
                y,
                Math.cos(angle) * speed,
                Math.sin(angle) * speed,
                pick(palette),
                randomInt(65, 105),
                random(0.8, 1.6)
            );
        }

        return;
    }

    if (type === "doubleRing") {

        const count = 180;

        for (let i = 0; i < count; i++) {

            const angle =
                i / count *
                Math.PI * 2;

            const ring =
                i % 2;

            const speed =
                ring === 0
                    ? random(3.2, 4.5)
                    : random(5.5, 7.0);

            addParticle(
                x,
                y,
                Math.cos(angle) * speed,
                Math.sin(angle) * speed,
                pick(palette),
                randomInt(65, 105),
                random(0.75, 1.55)
            );
        }

        return;
    }

    if (type === "willow") {

        for (let i = 0; i < 145; i++) {

            const angle =
                random(0, Math.PI * 2);

            const speed =
                random(2.0, 6.0);

            addParticle(
                x,
                y,
                Math.cos(angle) * speed,
                Math.sin(angle) * speed,
                pick(palette),
                randomInt(90, 145),
                random(0.8, 1.55)
            );
        }

        return;
    }

    if (type === "crackle") {

        for (let i = 0; i < 165; i++) {

            const angle =
                random(0, Math.PI * 2);

            const speed =
                random(2.5, 7.5);

            addParticle(
                x,
                y,
                Math.cos(angle) * speed,
                Math.sin(angle) * speed,
                pick(palette),
                randomInt(50, 95),
                random(0.8, 1.8)
            );
        }

        return;
    }

    if (type === "chrysanthemum") {

        const count = 190;

        for (let i = 0; i < count; i++) {

            const angle =
                i / count *
                Math.PI * 2;

            const speed =
                random(4.0, 7.2);

            addParticle(
                x,
                y,
                Math.cos(angle) * speed,
                Math.sin(angle) * speed,
                pick(palette),
                randomInt(65, 105),
                random(0.75, 1.5)
            );
        }

        return;
    }

    if (type === "peony") {

        for (let i = 0; i < 170; i++) {

            const angle =
                random(0, Math.PI * 2);

            const speed =
                random(2.5, 6.5);

            addParticle(
                x,
                y,
                Math.cos(angle) * speed,
                Math.sin(angle) * speed,
                pick(palette),
                randomInt(60, 100),
                random(0.85, 1.65)
            );
        }

        return;
    }

    if (type === "fan") {

        const directions = [
            -1.25,
            -0.62,
            0,
            0.62,
            1.25
        ];

        for (const direction of directions) {

            for (let i = 0; i < 32; i++) {

                const angle =
                    direction +
                    random(-0.09, 0.09);

                const speed =
                    random(3.0, 7.0);

                addParticle(
                    x,
                    y,
                    Math.cos(angle) * speed,
                    Math.sin(angle) * speed,
                    pick(palette),
                    randomInt(55, 95),
                    random(0.8, 1.55)
                );
            }
        }

        return;
    }

    if (type === "heart") {

        const count = 160;

        for (let i = 0; i < count; i++) {

            const t =
                i / count *
                Math.PI * 2;

            const hx =
                16 *
                Math.pow(
                    Math.sin(t),
                    3
                );

            const hy =
                -(
                    13 * Math.cos(t) -
                    5 * Math.cos(2 * t) -
                    2 * Math.cos(3 * t) -
                    Math.cos(4 * t)
                );

            const scale =
                random(0.22, 0.38);

            addParticle(
                x,
                y,
                hx * scale,
                hy * scale,
                pick(palette),
                randomInt(65, 105),
                random(0.8, 1.6)
            );
        }

        return;
    }

    if (type === "spiral") {

        const count = 180;

        for (let i = 0; i < count; i++) {

            const t =
                i / count *
                Math.PI * 8;

            const speed =
                1.2 +
                i / count * 5.5;

            addParticle(
                x,
                y,
                Math.cos(t) * speed,
                Math.sin(t) * speed,
                pick(palette),
                randomInt(60, 105),
                random(0.8, 1.6)
            );
        }

        return;
    }

    if (type === "rainbow") {

        const rainbow = [
            "#ff3b30",
            "#ff9500",
            "#ffcc00",
            "#34c759",
            "#00c7be",
            "#007aff",
            "#af52de"
        ];

        const count = 180;

        for (let i = 0; i < count; i++) {

            const angle =
                i / count *
                Math.PI * 2;

            const speed =
                random(3.0, 7.0);

            addParticle(
                x,
                y,
                Math.cos(angle) * speed,
                Math.sin(angle) * speed,
                rainbow[
                    i % rainbow.length
                ],
                randomInt(60, 100),
                random(0.8, 1.6)
            );
        }

        return;
    }

    if (type === "golden") {

        for (let i = 0; i < 180; i++) {

            const angle =
                random(0, Math.PI * 2);

            const speed =
                random(2.0, 6.8);

            addParticle(
                x,
                y,
                Math.cos(angle) * speed,
                Math.sin(angle) * speed,
                pick([
                    "#fffbe6",
                    "#fff0a8",
                    "#ffd75a",
                    "#ffb300"
                ]),
                randomInt(80, 130),
                random(0.8, 1.65)
            );
        }

        return;
    }

    /*
       Fallback.
    */

    for (let i = 0; i < baseCount; i++) {

        const angle =
            random(0, Math.PI * 2);

        const speed =
            random(2.5, 7);

        addParticle(
            x,
            y,
            Math.cos(angle) * speed,
            Math.sin(angle) * speed,
            pick(palette),
            randomInt(60, 100),
            random(0.8, 1.6)
        );
    }
}


/* =========================================================
   ROCKET UPDATE
========================================================= */

function updateRockets() {

    for (let i = rockets.length - 1; i >= 0; i--) {

        const rocket = rockets[i];

        if (rocket.dead) {
            rockets.splice(i, 1);
            continue;
        }

        rocket.trail.push({
            x: rocket.x,
            y: rocket.y
        });

        if (rocket.trail.length > 10) {
            rocket.trail.shift();
        }

        rocket.x += rocket.vx;
        rocket.y += rocket.vy;

        const dx =
            rocket.targetX - rocket.x;

        const dy =
            rocket.targetY - rocket.y;

        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );

        if (distance < 16) {

            createExplosion(
                rocket.x,
                rocket.y,
                rocket.type,
                rocket.palette
            );

            rocket.dead = true;
            rockets.splice(i, 1);
        }
    }
}

function drawRockets() {

    ctx.save();

    for (const rocket of rockets) {

        if (rocket.trail.length > 1) {

            ctx.beginPath();

            ctx.moveTo(
                rocket.trail[0].x,
                rocket.trail[0].y
            );

            for (
                let i = 1;
                i < rocket.trail.length;
                i++
            ) {
                ctx.lineTo(
                    rocket.trail[i].x,
                    rocket.trail[i].y
                );
            }

            ctx.strokeStyle =
                "rgba(255,255,255,0.35)";

            ctx.lineWidth = 1;

            ctx.stroke();
        }

        ctx.beginPath();

        ctx.arc(
            rocket.x,
            rocket.y,
            1.7,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = "#ffffff";
        ctx.fill();
    }

    ctx.restore();
}


/* =========================================================
   NORMAL PARTICLE UPDATE
========================================================= */

function updateParticles() {

    for (
        let i = particles.length - 1;
        i >= 0;
        i--
    ) {

        const p = particles[i];

        p.x += p.vx;
        p.y += p.vy;

        p.vx *= p.friction;
        p.vy *= p.friction;

        p.vy += p.gravity;

        p.life--;

        if (p.life <= 0) {
            particles.splice(i, 1);
        }
    }
}

function drawParticles() {

    ctx.save();

    for (const p of particles) {

        const lifeRatio =
            p.life / p.maxLife;

        let alpha =
            lifeRatio *
            p.alpha;

        if (p.twinkle) {

            alpha *=
                0.65 +
                Math.random() * 0.35;
        }

        ctx.globalAlpha =
            clamp(alpha, 0, 1);

        ctx.fillStyle = p.color;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.restore();
}


/* =========================================================
   HIGH-RES TEXT FIREWORK
========================================================= */

const PARTICLES_PER_TEXT_PIXEL = 3;
const MAX_TEXT_PARTICLES = 4000;

const TEXT_SAMPLE_STEP = 2;

const TEXT_PARTICLE_CLUSTER_RADIUS = 0.85;

const TEXT_HOLD_JITTER = 0.28;

const textCanvas =
    document.createElement("canvas");

const textCtx =
    textCanvas.getContext("2d");


function createLetterTargets(text) {

    const fontSize =
        clamp(
            Math.floor(
                Math.min(
                    width * 0.20,
                    height * 0.25
                )
            ),
            70,
            210
        );

    const padding = 40;

    textCtx.font =
        `900 ${fontSize}px Arial Black, Arial, sans-serif`;

    const measurement =
        textCtx.measureText(text);

    const textWidth =
        Math.ceil(
            measurement.width
        );

    const textHeight =
        Math.ceil(
            fontSize * 1.15
        );

    textCanvas.width =
        textWidth + padding * 2;

    textCanvas.height =
        textHeight + padding * 2;

    textCtx.clearRect(
        0,
        0,
        textCanvas.width,
        textCanvas.height
    );

    textCtx.font =
        `900 ${fontSize}px Arial Black, Arial, sans-serif`;

    textCtx.textAlign = "center";
    textCtx.textBaseline = "middle";

    /*
       A stroke makes narrow characters
       more readable without making the
       particle clusters huge.
    */

    textCtx.lineJoin = "round";
    textCtx.lineWidth = 3;

    textCtx.strokeStyle =
        "white";

    textCtx.fillStyle =
        "white";

    const centerX =
        textCanvas.width / 2;

    const centerY =
        textCanvas.height / 2;

    textCtx.strokeText(
        text,
        centerX,
        centerY
    );

    textCtx.fillText(
        text,
        centerX,
        centerY
    );

    const image =
        textCtx.getImageData(
            0,
            0,
            textCanvas.width,
            textCanvas.height
        );

    const targets = [];

    for (
        let y = 0;
        y < textCanvas.height;
        y += TEXT_SAMPLE_STEP
    ) {

        for (
            let x = 0;
            x < textCanvas.width;
            x += TEXT_SAMPLE_STEP
        ) {

            const index =
                (y * textCanvas.width + x) * 4;

            const alpha =
                image.data[index + 3];

            if (alpha > 100) {

                targets.push({
                    x:
                        x -
                        textCanvas.width / 2,

                    y:
                        y -
                        textCanvas.height / 2
                });
            }
        }
    }

    return {
        targets,
        width: textCanvas.width,
        height: textCanvas.height
    };
}


/* =========================================================
   TEXT ROCKET
========================================================= */

function createTextRocket(
    text,
    colorPalette
) {
    if (rockets.length >= MAX_ROCKETS) {
        return false;
    }

    const targetX =
        width / 2;

    const targetY =
        height * 0.43;

    const x =
        width * random(
            0.25,
            0.75
        );

    const y =
        height + 20;

    const dx =
        targetX - x;

    const dy =
        targetY - y;

    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );

    const speed =
        10.5;

    /*
       IMPORTANT:
       This rocket is a normal rocket object,
       but has text data attached to it.
    */

    rockets.push({
        x,
        y,

        vx:
            dx / distance * speed,

        vy:
            dy / distance * speed,

        targetX,
        targetY,

        type: "TEXT",
        palette: colorPalette,

        text,
        textTrail: [],

        dead: false
    });

    return true;
}


/* =========================================================
   TEXT EXPLOSION
========================================================= */

function createTextExplosion(
    x,
    y,
    text
) {
    const data =
        createLetterTargets(text);

    const targets =
        data.targets;

    /*
       Keep the 4,000 limit absolute.
    */

    const available =
        MAX_TEXT_PARTICLES -
        textParticles.length;

    if (available <= 0) {
        return;
    }

    const maxTargets =
        Math.floor(
            available /
            PARTICLES_PER_TEXT_PIXEL
        );

    const usableTargets =
        targets.length >
        maxTargets
            ? targets.slice(
                0,
                maxTargets
            )
            : targets;

    const radius =
        TEXT_PARTICLE_CLUSTER_RADIUS;

    const patterns = [
        { x: 0, y: 0 },
        { x: -radius, y: radius * 0.42 },
        { x: radius, y: -radius * 0.42 }
    ];

    const palette =
        pick(palettes);

    /*
       The text starts as an explosion,
       then every particle is pulled
       into its exact letter position.
    */

    for (const target of usableTargets) {

        for (
            let n = 0;
            n < PARTICLES_PER_TEXT_PIXEL;
            n++
        ) {

            if (
                textParticles.length >=
                MAX_TEXT_PARTICLES
            ) {
                break;
            }

            const pattern =
                patterns[
                    n % patterns.length
                ];

            const targetX =
                x +
                target.x +
                pattern.x +
                random(-0.10, 0.10);

            const targetY =
                y +
                target.y +
                pattern.y +
                random(-0.10, 0.10);

            const angle =
                random(
                    0,
                    Math.PI * 2
                );

            const burstSpeed =
                random(
                    5.0,
                    10.5
                );

            textParticles.push({
                x,
                y,

                vx:
                    Math.cos(angle) *
                    burstSpeed,

                vy:
                    Math.sin(angle) *
                    burstSpeed,

                targetX,
                targetY,

                color:
                    pick(palette),

                life: 0,

                age: 0,

                phase:
                    random(
                        0,
                        Math.PI * 2
                    ),

                hold: false,

                size:
                    random(
                        0.55,
                        1.15
                    )
            });
        }
    }

    /*
       Extra loose sparks make the text firework
       still feel like an explosion instead of
       instantly becoming text.
    */

    const looseSparkCount =
        Math.min(
            140,
            MAX_TEXT_PARTICLES -
            textParticles.length
        );

    for (
        let i = 0;
        i < looseSparkCount;
        i++
    ) {

        const angle =
            random(
                0,
                Math.PI * 2
            );

        const speed =
            random(
                3.0,
                9.0
            );

        textParticles.push({
            x,
            y,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            targetX:
                x +
                random(
                    -data.width * 0.42,
                    data.width * 0.42
                ),

            targetY:
                y +
                random(
                    -data.height * 0.42,
                    data.height * 0.42
                ),

            color:
                pick(palette),

            life: 0,

            age: 0,

            phase:
                random(
                    0,
                    Math.PI * 2
                ),

            hold: false,

            loose: true,

            size:
                random(
                    0.5,
                    1.0
                )
        });
    }

    playTextFireworkSound();
}


/* =========================================================
   TEXT PARTICLE UPDATE
========================================================= */

function updateTextParticles() {

    for (
        let i = textParticles.length - 1;
        i >= 0;
        i--
    ) {

        const p =
            textParticles[i];

        p.age++;

        if (p.loose) {

            p.x += p.vx;
            p.y += p.vy;

            p.vx *= 0.975;
            p.vy *= 0.975;

            p.vy += 0.018;

            if (p.age > 90) {
                textParticles.splice(i, 1);
            }

            continue;
        }

        /*
           Explosion phase.
        */

        if (p.age < 13) {

            p.x += p.vx;
            p.y += p.vy;

            p.vx *= 0.84;
            p.vy *= 0.84;

            continue;
        }

        /*
           Strong target attraction.
        */

        const dx =
            p.targetX - p.x;

        const dy =
            p.targetY - p.y;

        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );

        if (distance > 0.55) {

            let attraction =
                0.018;

            if (distance < 8) {
                attraction = 0.055;
            }

            if (distance < 3.5) {
                attraction = 0.15;
            }

            if (distance < 1.5) {
                attraction = 0.24;
            }

            p.vx +=
                dx * attraction;

            p.vy +=
                dy * attraction;

            p.vx *= 0.70;
            p.vy *= 0.70;

            p.x += p.vx;
            p.y += p.vy;

        } else {

            /*
               Readability hold.
               Very tiny movement only.
            */

            p.x =
                p.targetX +
                Math.sin(
                    p.age * 0.07 +
                    p.phase
                ) *
                TEXT_HOLD_JITTER;

            p.y =
                p.targetY +
                Math.cos(
                    p.age * 0.065 +
                    p.phase
                ) *
                TEXT_HOLD_JITTER;

            p.vx = 0;
            p.vy = 0;
        }

        /*
           Text stays on screen for a long time.
        */

        if (p.age > 330) {
            textParticles.splice(i, 1);
        }
    }
}

function drawTextParticles() {

    ctx.save();

    for (const p of textParticles) {

        let alpha = 1;

        if (p.age > 280) {

            alpha =
                clamp(
                    1 -
                    (p.age - 280) / 50,
                    0,
                    1
                );
        }

        if (!p.loose) {

            alpha *=
                0.82 +
                Math.sin(
                    p.age * 0.12 +
                    p.phase
                ) *
                0.18;
        }

        ctx.globalAlpha =
            clamp(alpha, 0, 1);

        ctx.fillStyle =
            p.color;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.restore();
}


/* =========================================================
   TEXT ROCKET UPDATE
========================================================= */

function updateTextRockets() {

    for (
        let i = rockets.length - 1;
        i >= 0;
        i--
    ) {

        const rocket =
            rockets[i];

        if (
            rocket.type !== "TEXT"
        ) {
            continue;
        }

        rocket.textTrail.push({
            x: rocket.x,
            y: rocket.y
        });

        if (
            rocket.textTrail.length >
            12
        ) {
            rocket.textTrail.shift();
        }

        rocket.x += rocket.vx;
        rocket.y += rocket.vy;

        const dx =
            rocket.targetX -
            rocket.x;

        const dy =
            rocket.targetY -
            rocket.y;

        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );

        if (distance < 18) {

            createTextExplosion(
                rocket.x,
                rocket.y,
                rocket.text
            );

            rocket.dead = true;

            rockets.splice(i, 1);
        }
    }
}

function drawTextRockets() {

    ctx.save();

    for (const rocket of rockets) {

        if (
            rocket.type !== "TEXT"
        ) {
            continue;
        }

        if (
            rocket.textTrail.length >
            1
        ) {

            ctx.beginPath();

            ctx.moveTo(
                rocket.textTrail[0].x,
                rocket.textTrail[0].y
            );

            for (
                let i = 1;
                i < rocket.textTrail.length;
                i++
            ) {

                ctx.lineTo(
                    rocket.textTrail[i].x,
                    rocket.textTrail[i].y
                );
            }

            ctx.strokeStyle =
                "rgba(255,255,255,0.38)";

            ctx.lineWidth = 1;

            ctx.stroke();
        }

        ctx.beginPath();

        ctx.arc(
            rocket.x,
            rocket.y,
            1.8,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#ffffff";

        ctx.fill();
    }

    ctx.restore();
}


/* =========================================================
   BACKGROUND
========================================================= */

function drawBackground() {

    ctx.fillStyle =
        "rgba(0,0,0,0.20)";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );
}


/* =========================================================
   MAIN SHOW
========================================================= */

const SHOW_DURATION =
    5 * 60 * 1000;

const FIREWORK_BUFFER =
    400;

const MIN_LAUNCH_INTERVAL =
    550;

const MAX_LAUNCH_INTERVAL =
    800;

let showRunning = false;
let showStartTime = 0;
let nextLaunchTime = 0;
let showItemIndex = 0;


/* =========================================================
   NORMAL SHOW SCHEDULER
========================================================= */

function scheduleMainShow(
    elapsed
) {
    if (
        elapsed >=
        SHOW_DURATION
    ) {
        return;
    }

    if (
        elapsed + FIREWORK_BUFFER >=
        nextLaunchTime
    ) {

        const type =
            showItems[
                showItemIndex %
                showItems.length
            ];

        showItemIndex++;

        const palette =
            pick(palettes);

        const targetX =
            random(
                width * 0.12,
                width * 0.88
            );

        const targetY =
            random(
                height * 0.18,
                height * 0.55
            );

        createRocket(
            targetX,
            targetY,
            type,
            palette
        );

        /*
           Keep launches continuous.
        */

        const interval =
            random(
                MIN_LAUNCH_INTERVAL,
                MAX_LAUNCH_INTERVAL
            );

        nextLaunchTime =
            elapsed + interval;

        /*
           Occasional simultaneous launch.
        */

        if (
            Math.random() < 0.34
        ) {

            const secondType =
                showItems[
                    showItemIndex %
                    showItems.length
                ];

            showItemIndex++;

            createRocket(
                random(
                    width * 0.12,
                    width * 0.88
                ),
                random(
                    height * 0.18,
                    height * 0.55
                ),
                secondType,
                pick(palettes)
            );
        }

        /*
           Occasional third firework.
        */

        if (
            Math.random() < 0.11
        ) {

            const thirdType =
                showItems[
                    showItemIndex %
                    showItems.length
                ];

            showItemIndex++;

            createRocket(
                random(
                    width * 0.12,
                    width * 0.88
                ),
                random(
                    height * 0.18,
                    height * 0.55
                ),
                thirdType,
                pick(palettes)
            );
        }
    }
}


/* =========================================================
   FINALE
========================================================= */

/*
   These are intentionally independent from
   the normal scheduler.

   That means the text fireworks CANNOT be
   accidentally skipped because of the normal
   rocket count/scheduler.
*/

const finaleEvents = [];

let finaleStarted = false;

function resetFinale() {

    finaleEvents.length = 0;

    finaleStarted = false;

    finaleEvents.push({
        time: 0,
        text: "HAPPY",
        fired: false
    });

    finaleEvents.push({
        time: 5000,
        text: "BIRTHDAY",
        fired: false
    });

    finaleEvents.push({
        time: 9700,
        text: null,
        name: true,
        fired: false
    });

    finaleEvents.push({
        time: 13500,
        text: null,
        name: true,
        fired: false
    });
}


function updateFinale(
    elapsed
) {

    const finaleStart =
        SHOW_DURATION;

    /*
       Finale begins after the 5-minute show.
    */

    if (
        elapsed <
        finaleStart
    ) {
        return;
    }

    const finaleElapsed =
        elapsed -
        finaleStart;

    for (
        const event of finaleEvents
    ) {

        if (
            event.fired
        ) {
            continue;
        }

        if (
            finaleElapsed >=
            event.time
        ) {

            event.fired = true;

            let text =
                event.text;

            if (event.name) {
                text =
                    sanitizeName(
                        nameInput.value
                    );
            }

            if (!text) {
                continue;
            }

            /*
               IMPORTANT:
               The text rocket is launched directly.
            */

            createTextRocket(
                text,
                pick(palettes)
            );
        }
    }
}


/* =========================================================
   SHOW LOOP
========================================================= */

let animationFrame = null;

function animationLoop(now) {

    if (!showRunning) {
        return;
    }

    const elapsed =
        now -
        showStartTime;

    drawBackground();

    /*
       Normal fireworks.
    */

    if (
        elapsed <
        SHOW_DURATION
    ) {

        scheduleMainShow(
            elapsed
        );
    }

    /*
       Finale.
    */

    updateFinale(
        elapsed
    );

    /*
       Update everything.
    */

    updateRockets();
    updateTextRockets();

    updateParticles();
    updateTextParticles();

    /*
       Draw everything.
    */

    drawParticles();
    drawRockets();

    drawTextParticles();
    drawTextRockets();

    animationFrame =
        requestAnimationFrame(
            animationLoop
        );
}


/* =========================================================
   NAME
========================================================= */

function sanitizeName(value) {

    let clean =
        String(value || "")
            .toUpperCase()
            .replace(/[^A-Z ]/g, "")
            .replace(/\s+/g, " ")
            .trim();

    if (!clean) {
        clean = "NAME";
    }

    if (clean.length > 20) {
        clean =
            clean.slice(0, 20)
                .trim();
    }

    return clean;
}


/* =========================================================
   START
========================================================= */

const startScreen =
    document.getElementById(
        "startScreen"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const nameInput =
    document.getElementById(
        "nameInput"
    );

const showInfo =
    document.getElementById(
        "showInfo"
    );


function startShow() {

    initAudio();

    if (
        audioContext &&
        audioContext.state ===
        "suspended"
    ) {
        audioContext.resume();
    }

    /*
       Clean old state.
    */

    particles.length = 0;
    rockets.length = 0;
    textParticles.length = 0;

    showItemIndex = 0;

    resetFinale();

    finaleStarted = false;

    showRunning = true;

    showStartTime =
        performance.now();

    nextLaunchTime = 0;

    startScreen.style.display =
        "none";

    showInfo.style.opacity =
        "1";

    if (animationFrame) {
        cancelAnimationFrame(
            animationFrame
        );
    }

    animationFrame =
        requestAnimationFrame(
            animationLoop
        );
}


startButton.addEventListener(
    "click",
    startShow
);

nameInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {
            startShow();
        }
    }
);


/* =========================================================
   PREVENT PAGE GESTURES / ZOOM
========================================================= */

document.addEventListener(
    "touchmove",
    event => {
        event.preventDefault();
    },
    {
        passive: false
    }
);

document.addEventListener(
    "gesturestart",
    event => {
        event.preventDefault();
    },
    {
        passive: false
    }
);

document.addEventListener(
    "dblclick",
    event => {
        event.preventDefault();
    },
    {
        passive: false
    }
);


/* =========================================================
   INITIAL FRAME
========================================================= */

ctx.fillStyle = "#000";
ctx.fillRect(
    0,
    0,
    width,
    height
);

</script>
