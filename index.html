"use strict";


/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

let width = 0;
let height = 0;
let dpr = 1;

function resize() {

    dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    width =
        window.innerWidth;

    height =
        window.innerHeight;

    canvas.width =
        Math.floor(
            width * dpr
        );

    canvas.height =
        Math.floor(
            height * dpr
        );

    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

window.addEventListener(
    "resize",
    resize
);

resize();


/* =========================================================
   AUDIO
   EXPLOSIONS ONLY
   NO ROCKET WHISTLE
========================================================= */

let audioContext = null;
let masterGain = null;
let compressor = null;
let noiseBuffer = null;

function initAudio() {

    if (audioContext) {

        if (
            audioContext.state ===
            "suspended"
        ) {
            audioContext.resume();
        }

        return;
    }

    const AudioCtx =
        window.AudioContext ||
        window.webkitAudioContext;

    if (!AudioCtx) {
        return;
    }

    audioContext =
        new AudioCtx();

    compressor =
        audioContext.createDynamicsCompressor();

    compressor.threshold.value = -24;
    compressor.knee.value = 20;
    compressor.ratio.value = 8;
    compressor.attack.value = 0.003;
    compressor.release.value = 0.18;

    masterGain =
        audioContext.createGain();

    masterGain.gain.value = 0.72;

    compressor.connect(
        masterGain
    );

    masterGain.connect(
        audioContext.destination
    );

    createNoiseBuffer();

    if (
        audioContext.state ===
        "suspended"
    ) {
        audioContext.resume();
    }
}

function createNoiseBuffer() {

    if (!audioContext) {
        return;
    }

    const length =
        Math.floor(
            audioContext.sampleRate * 2
        );

    noiseBuffer =
        audioContext.createBuffer(
            1,
            length,
            audioContext.sampleRate
        );

    const data =
        noiseBuffer.getChannelData(0);

    for (
        let i = 0;
        i < length;
        i++
    ) {

        data[i] =
            Math.random() * 2 - 1;
    }
}

function getAudioTime() {

    return audioContext
        ? audioContext.currentTime
        : 0;
}

function createTone(
    frequency,
    duration,
    volume,
    type = "sine",
    startTime = null,
    endFrequency = null
) {

    if (!audioContext) {
        return;
    }

    const now =
        startTime === null
            ? getAudioTime()
            : startTime;

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type =
        type;

    oscillator.frequency.setValueAtTime(
        frequency,
        now
    );

    if (
        endFrequency !== null
    ) {

        oscillator.frequency.exponentialRampToValueAtTime(
            Math.max(
                20,
                endFrequency
            ),
            now + duration
        );
    }

    gain.gain.setValueAtTime(
        0.0001,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        Math.max(
            0.0001,
            volume
        ),
        now +
        Math.min(
            0.008,
            duration * 0.15
        )
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + duration
    );

    oscillator.connect(
        gain
    );

    gain.connect(
        compressor
    );

    oscillator.start(now);

    oscillator.stop(
        now +
        duration +
        0.03
    );
}

function createNoiseBurst(
    duration,
    volume,
    filterFrequency,
    startTime = null
) {

    if (
        !audioContext ||
        !noiseBuffer
    ) {
        return;
    }

    const now =
        startTime === null
            ? getAudioTime()
            : startTime;

    const source =
        audioContext.createBufferSource();

    source.buffer =
        noiseBuffer;

    const filter =
        audioContext.createBiquadFilter();

    filter.type =
        "lowpass";

    filter.frequency.value =
        filterFrequency;

    filter.Q.value =
        0.7;

    const gain =
        audioContext.createGain();

    gain.gain.setValueAtTime(
        0.0001,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        Math.max(
            0.0001,
            volume
        ),
        now + 0.004
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + duration
    );

    source.connect(
        filter
    );

    filter.connect(
        gain
    );

    gain.connect(
        compressor
    );

    source.start(now);

    source.stop(
        now +
        duration +
        0.02
    );
}

function playBoom(
    strength = 1
) {

    if (!audioContext) {
        return;
    }

    const now =
        getAudioTime();

    createTone(
        55,
        0.45,
        0.34 * strength,
        "sine",
        now,
        28
    );

    createTone(
        85,
        0.28,
        0.20 * strength,
        "triangle",
        now,
        38
    );

    createNoiseBurst(
        0.30,
        0.22 * strength,
        900,
        now
    );
}

function playSnap(
    strength = 1
) {

    if (!audioContext) {
        return;
    }

    const now =
        getAudioTime();

    createNoiseBurst(
        0.055,
        0.13 * strength,
        6500,
        now
    );

    createTone(
        1150,
        0.055,
        0.07 * strength,
        "square",
        now,
        480
    );
}

function playCrackleSounds(
    amount = 1,
    strength = 1
) {

    if (!audioContext) {
        return;
    }

    const now =
        getAudioTime();

    const count =
        Math.floor(
            3 + amount * 5
        );

    for (
        let i = 0;
        i < count;
        i++
    ) {

        const delay =
            Math.random() * 0.34;

        createNoiseBurst(
            0.018 +
            Math.random() * 0.035,
            0.025 * strength,
            3500 +
            Math.random() * 4000,
            now + delay
        );
    }
}

function playStandardFireworkSound(
    type
) {

    if (!audioContext) {
        return;
    }

    if (
        type === "crackle" ||
        type === "willow"
    ) {

        playBoom(0.85);

        playCrackleSounds(
            1.4,
            1
        );

        return;
    }

    if (
        type === "doubleRing" ||
        type === "ring"
    ) {

        playBoom(0.95);

        playSnap(0.8);

        return;
    }

    if (
        type === "fan"
    ) {

        playBoom(0.75);

        playSnap(0.6);

        return;
    }

    playBoom(0.82);

    playSnap(0.45);
}

function playTextFireworkSound() {

    if (!audioContext) {
        return;
    }

    const now =
        getAudioTime();

    /*
       Explosion only.
       No whistle.
       No launch tone.
    */

    createNoiseBurst(
        0.12,
        0.22,
        5200,
        now
    );

    createTone(
        62,
        0.55,
        0.38,
        "sine",
        now,
        25
    );

    createTone(
        92,
        0.34,
        0.23,
        "triangle",
        now,
        35
    );

    createNoiseBurst(
        0.28,
        0.20,
        1100,
        now
    );

    playCrackleSounds(
        1.8,
        1.15
    );
}


/* =========================================================
   UTILITIES
========================================================= */

function random(
    min,
    max
) {

    return Math.random() *
        (max - min) +
        min;
}

function randomInt(
    min,
    max
) {

    return Math.floor(
        random(
            min,
            max + 1
        )
    );
}

function pick(
    array
) {

    return array[
        Math.floor(
            Math.random() *
            array.length
        )
    ];
}

function clamp(
    value,
    min,
    max
) {

    return Math.max(
        min,
        Math.min(
            max,
            value
        )
    );
}

/* =========================================================
   NORMAL PARTICLE SYSTEM
========================================================= */

const particles = [];

const MAX_PARTICLES =
    3400;

const GRAVITY =
    0.035;

function addParticle(
    x,
    y,
    vx,
    vy,
    color,
    life = 80,
    size = 1.2,
    alpha = 1
) {

    if (
        particles.length >=
        MAX_PARTICLES
    ) {
        return;
    }

    particles.push({

        x,
        y,

        vx,
        vy,

        color,

        life,

        maxLife:
            life,

        size,

        alpha,

        friction:
            random(
                0.982,
                0.994
            ),

        gravity:
            GRAVITY *
            random(
                0.65,
                1.15
            ),

        twinkle:
            Math.random() <
            0.32
    });
}


/* =========================================================
   NORMAL ROCKET SYSTEM
========================================================= */

const rockets = [];

const MAX_ROCKETS =
    28;

function createRocket(
    targetX,
    targetY,
    type,
    palette
) {

    if (
        rockets.length >=
        MAX_ROCKETS
    ) {
        return;
    }

    const x =
        random(
            width * 0.10,
            width * 0.90
        );

    const y =
        height + 15;

    const dx =
        targetX - x;

    const dy =
        targetY - y;

    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );

    const speed =
        random(
            8.5,
            11.5
        );

    rockets.push({

        x,
        y,

        vx:
            dx /
            distance *
            speed,

        vy:
            dy /
            distance *
            speed,

        targetX,
        targetY,

        type,
        palette,

        trail: [],

        dead: false
    });
}


/* =========================================================
   NORMAL EXPLOSIONS
========================================================= */

function createExplosion(
    x,
    y,
    type,
    palette
) {

    const baseCount =
        randomInt(
            105,
            175
        );

    playStandardFireworkSound(
        type
    );


    if (
        type === "sphere"
    ) {

        for (
            let i = 0;
            i < baseCount;
            i++
        ) {

            const angle =
                random(
                    0,
                    Math.PI * 2
                );

            const speed =
                random(
                    2.2,
                    7.3
                );

            addParticle(
                x,
                y,
                Math.cos(angle) *
                    speed,
                Math.sin(angle) *
                    speed,
                pick(palette),
                randomInt(
                    55,
                    100
                ),
                random(
                    0.8,
                    1.7
                )
            );
        }

        return;
    }


    if (
        type === "ring"
    ) {

        const count =
            155;

        for (
            let i = 0;
            i < count;
            i++
        ) {

            const angle =
                i /
                count *
                Math.PI *
                2;

            const speed =
                random(
                    4.6,
                    6.4
                );

            addParticle(
                x,
                y,
                Math.cos(angle) *
                    speed,
                Math.sin(angle) *
                    speed,
                pick(palette),
                randomInt(
                    65,
                    105
                ),
                random(
                    0.8,
                    1.6
                )
            );
        }

        return;
    }


    if (
        type === "doubleRing"
    ) {

        const count =
            180;

        for (
            let i = 0;
            i < count;
            i++
        ) {

            const angle =
                i /
                count *
                Math.PI *
                2;

            const ring =
                i % 2;

            const speed =
                ring === 0
                    ? random(
                        3.2,
                        4.5
                    )
                    : random(
                        5.5,
                        7.0
                    );

            addParticle(
                x,
                y,
                Math.cos(angle) *
                    speed,
                Math.sin(angle) *
                    speed,
                pick(palette),
                randomInt(
                    65,
                    105
                ),
                random(
                    0.75,
                    1.55
                )
            );
        }

        return;
    }


    if (
        type === "willow"
    ) {

        for (
            let i = 0;
            i < 145;
            i++
        ) {

            const angle =
                random(
                    0,
                    Math.PI * 2

            const speed =

    }


    if (
        type === "fan"
    ) {

        const directions = [
            -1.25,
            -0.62,
            0,
            0.62,
            1.25
        ];

        for (
            const direction
            of directions
        ) {

            for (
                let i = 0;
                i < 32;
                i++
            ) {

                const angle =
                    direction +
                    random(
                        -0.09,
                        0.09
                    );

                const speed =
                    random(
                        3.0,
                        7.0
                    );

                addParticle(
                    x,
                    y,
                    Math.cos(angle) *
                        speed,
                    Math.sin(angle) *
                        speed,
                    pick(palette),
                    randomInt(
                        55,
                        95
                    ),
                    random(
                        0.8,
                        1.55
                    )
                );
            }
        }

        return;
    }


    if (
        type === "heart"
    ) {

        const count =
            160;

        for (
            let i = 0;
            i < count;
            i++
        ) {

            const t =
                i /
                count *
                Math.PI *
                2;

            const hx =
                16 *
                Math.pow(
                    Math.sin(t),
                    3
                );

            const hy =
                -(
                    13 *
                    Math.cos(t) -
                    5 *
                    Math.cos(
                        2 * t
                    ) -
                    2 *
                    Math.cos(
                        3 * t
                    ) -
                    Math.cos(
                        4 * t
                    )
                );

            const scale =
                random(
                    0.22,
                    0.38
                );

            addParticle(
                x,
                y,
                hx * scale,
                hy * scale,
                pick(palette),
                randomInt(
                    65,
                    105
                ),
                random(
                    0.8,
                    1.6
                )
            );
        }

        return;
    }


    if (
        type === "spiral"
    ) {

        const count =
            180;

        for (
            let i = 0;
            i < count;
            i++
        ) {

            const t =
                i /
                count *
                Math.PI *
                8;

            const speed =
                1.2 +
                i /
                count *
                5.5;

            addParticle(
                x,
                y,
                Math.cos(t) *
                    speed,
                Math.sin(t) *
                    speed,
                pick(palette),
                randomInt(
                    60,
                    105
                ),
                random(
                    0.8,
                    1.6
                )
            );
        }

        return;
    }


    if (
        type === "rainbow"
    ) {

        const rainbow = [

            "#ff3b30",
            "#ff9500",
            "#ffcc00",
            "#34c759",
            "#00c7be",
            "#007aff",
            "#af52de"
        ];

        const count =
            180;

        for (
            let i = 0;
            i < count;
            i++
        ) {

            const angle =
                i /
                count *
                Math.PI *
                2;

            const speed =
                random(
                    3.0,
                    7.0
                );

            addParticle(
                x,
                y,
                Math.cos(angle) *
                    speed,
                Math.sin(angle) *
                    speed,
                rainbow[
                    i %
                    rainbow.length
                ],
                randomInt(
                    60,
                    100
                ),
                random(
                    0.8,
                    1.6
                )
            );
        }

        return;
    }


    if (
        type === "golden"
    ) {

        for (
            let i = 0;
            i < 180;
            i++
        ) {

            const angle =
                random(
                    0,
                    Math.PI * 2
                );

            const speed =
                random(
                    2.0,
                    6.8
                );

            addParticle(
                x,
                y,
                Math.cos(angle) *
                    speed,
                Math.sin(angle) *
                    speed,
                pick([
                    "#fffbe6",
                    "#fff0a8",
                    "#ffd75a",
                    "#ffb300"
                ]),
                randomInt(
                    80,
                    130
                ),
                random(
                    0.8,
                    1.65
                )
            );
        }

        return;
    }


    for (
        let i = 0;
        i < baseCount;
        i++
    ) {

        const angle =
            random(
                0,
                Math.PI * 2
            );

        const speed =
            random(
                2.5,
                7
            );

        addParticle(
            x,
            y,
            Math.cos(angle) *
                speed,
            Math.sin(angle) *
                speed,
            pick(palette),
            randomInt(
                60,
                100
            ),
            random(
                0.8,
                1.6
            )
        );
    }
}


/* =========================================================
   NORMAL ROCKET UPDATE
   IMPORTANT:
   TEXT ROCKETS ARE NOT TOUCHED HERE
========================================================= */

function updateRockets() {

    for (
        let i =
            rockets.length - 1;
        i >= 0;
        i--
    ) {

        const rocket =
            rockets[i];

        /*
           This prevents the old bug where
           a TEXT rocket was treated as a
           normal firework.
        */

        if (
            rocket.type === "TEXT"
        ) {
            continue;
        }

        rocket.trail.push({

            x:
                rocket.x,

            y:
                rocket.y
        });

        if (
            rocket.trail.length >
            10
        ) {

            rocket.trail.shift();
        }

        rocket.x +=
            rocket.vx;

        rocket.y +=
            rocket.vy;

        const dx =
            rocket.targetX -
            rocket.x;

        const dy =
            rocket.targetY -
            rocket.y;

        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );

        if (
            distance < 16
        ) {

            createExplosion(
                rocket.x,
                rocket.y,
                rocket.type,
                rocket.palette
            );

            rockets.splice(
                i,
                1
            );
        }
    }
}

function drawRockets() {

    ctx.save();

    for (
        const rocket
        of rockets
    ) {

        if (
            rocket.type === "TEXT"
        ) {
            continue;
        }

        if (
            rocket.trail.length > 1
        ) {

            ctx.beginPath();

            ctx.moveTo(
                rocket.trail[0].x,
                rocket.trail[0].y
            );

            for (
                let i = 1;
                i < rocket.trail.length;
                i++
            ) {

                ctx.lineTo(
                    rocket.trail[i].x,
                    rocket.trail[i].y
                );
            }

            ctx.strokeStyle =
                "rgba(255,255,255,0.35)";

            ctx.lineWidth =
                1;

            ctx.stroke();
        }

        ctx.beginPath();

        ctx.arc(
            rocket.x,
            rocket.y,
            1.7,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#ffffff";

        ctx.fill();
    }

    ctx.restore();
}


/* =========================================================
   NORMAL PARTICLE UPDATE
========================================================= */

function updateParticles() {

    for (
        let i =
            particles.length - 1;
        i >= 0;
        i--
    ) {

        const p =
            particles[i];

        p.x +=
            p.vx;

        p.y +=
            p.vy;

        p.vx *=
            p.friction;

        p.vy *=
            p.friction;

        p.vy +=
            p.gravity;

        p.life--;

        if (
            p.life <= 0
        ) {

            particles.splice(
                i,
                1
            );
        }
    }
}

function drawParticles() {

    ctx.save();

    for (
        const p of particles
    ) {

        const lifeRatio =
            p.life /
            p.maxLife;

        let alpha =
            lifeRatio *
            p.alpha;

        if (
            p.twinkle
        ) {

            alpha *=
                0.65 +
                Math.random() *
                0.35;
        }

        ctx.globalAlpha =
            clamp(
                alpha,
                0,
                1
            );

        ctx.fillStyle =
            p.color;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.restore();
}


/* =========================================================
   TEXT FIREWORK SYSTEM
========================================================= */

/*
   One particle per sampled text pixel.

   4,000 is still the absolute ceiling.
*/

const PARTICLES_PER_TEXT_PIXEL =
    1;

const MAX_TEXT_PARTICLES =
    4000;

/*
   A smaller sample step gives more detail.
   2 means every second raster pixel.
*/

const TEXT_SAMPLE_STEP =
    2;

const TEXT_HOLD_JITTER =
    0.18;

const textParticles = [];

const textRockets = [];

const MAX_TEXT_ROCKETS =
    4;


/* =========================================================
   TEXT RASTER CANVAS
========================================================= */

const textCanvas =
    document.createElement(
        "canvas"
    );

const textCtx =
    textCanvas.getContext(
        "2d"
    );


/* =========================================================
   CREATE TEXT TARGETS
========================================================= */

function createLetterTargets(
    text
) {

    const fontSize =
        clamp(
            Math.floor(
                Math.min(
                    width * 0.20,
                    height * 0.25
                )
            ),
            70,
            210
        );

    const padding =
        40;

    textCtx.font =
        `900 ${fontSize}px Arial Black, Arial, sans-serif`;

    const measurement =
        textCtx.measureText(
            text
        );

    const textWidth =
        Math.ceil(
            measurement.width
        );

    const textHeight =
        Math.ceil(
            fontSize * 1.15
        );

    textCanvas.width =
        textWidth +
        padding * 2;

    textCanvas.height =
        textHeight +
        padding * 2;

    textCtx.clearRect(
        0,
        0,
        textCanvas.width,
        textCanvas.height
    );

    textCtx.font =
        `900 ${fontSize}px Arial Black, Arial, sans-serif`;

    textCtx.textAlign =
        "center";

    textCtx.textBaseline =
        "middle";

    textCtx.lineJoin =
        "round";

    textCtx.lineWidth =
        3;

    textCtx.strokeStyle =
        "white";

    textCtx.fillStyle =
        "white";

    const centerX =
        textCanvas.width /
        2;

    const centerY =
        textCanvas.height /
        2;

    textCtx.strokeText(
        text,
        centerX,
        centerY
    );

    textCtx.fillText(
        text,
        centerX,
        centerY
    );

    const image =
        textCtx.getImageData(
            0,
            0,
            textCanvas.width,
            textCanvas.height
        );

    const targets = [];

    for (
        let y = 0;
        y < textCanvas.height;
        y += TEXT_SAMPLE_STEP
    ) {

        for (
            let x = 0;
            x < textCanvas.width;
            x += TEXT_SAMPLE_STEP
        ) {

            const index =
                (
                    y *
                    textCanvas.width +
                    x
                ) * 4;

            const alpha =
                image.data[
                    index + 3
                ];

            if (
                alpha > 100
            ) {

                targets.push({

                    x:
                        x -
                        textCanvas.width /
                        2,

                    y:
                        y -
                        textCanvas.height /
                        2
                });
            }
        }
    }

    /*
       If a very large name ever creates
       more than 4,000 targets, sample them
       evenly instead of cutting off one side.
    */

    if (
        targets.length >
        MAX_TEXT_PARTICLES
    ) {

        const reduced = [];

        const stride =
            targets.length /
            MAX_TEXT_PARTICLES;

        for (
            let i = 0;
            i < MAX_TEXT_PARTICLES;
            i++
        ) {

            reduced.push(
                targets[
                    Math.floor(
                        i * stride
                    )
                ]
            );
        }

        return {
            targets: reduced,
            width:
                textCanvas.width,
            height:
                textCanvas.height
        };
    }

    return {

        targets,

        width:
            textCanvas.width,

        height:
            textCanvas.height
    };
}


/* =========================================================
   CREATE TEXT ROCKET
   SEPARATE FROM NORMAL ROCKETS
========================================================= */

function createTextRocket(
    text,
    colorPalette
) {

    /*
       Text rockets have their own limit,
       so normal fireworks can never prevent
       the finale from launching.
    */

    if (
        textRockets.length >=
        MAX_TEXT_ROCKETS
    ) {

        return false;
    }

    const targetX =
        width / 2;

    const targetY =
        height * 0.43;

    const x =
        width *
        random(
            0.25,
            0.75
        );

    const y =
        height + 20;

    const dx =
        targetX - x;

    const dy =
        targetY - y;

    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );

    const speed =
        10.5;

    textRockets.push({

        x,
        y,

        vx:
            dx /
            distance *
            speed,

        vy:
            dy /
            distance *
            speed,

        targetX,
        targetY,

        text,

        palette:
            colorPalette,

        trail: []
    });

    return true;
}


/* =========================================================
   TEXT EXPLOSION
========================================================= */

function createTextExplosion(
    x,
    y,
    text
) {

    const data =
        createLetterTargets(
            text
        );

    const targets =
        data.targets;

    if (
        !targets.length
    ) {
        return;
    }

    /*
       1 particle per sampled pixel.
       This is intentionally much lighter
       than the previous 3-particle version.
    */

    const available =
        MAX_TEXT_PARTICLES -
        textParticles.length;

    if (
        available <= 0
    ) {
        return;
    }

    const usableCount =
        Math.min(
            targets.length,
            available
        );

    const palette =
        pick(palettes);

    for (
        let i = 0;
        i < usableCount;
        i++
    ) {

        const target =
            targets[i];

        const targetX =
            x +
            target.x;

        const targetY =
            y +
            target.y;

        const angle =
            random(
                0,
                Math.PI * 2
            );

        const burstSpeed =
            random(
                5.0,
                9.0
            );

        textParticles.push({

            x,
            y,

            vx:
                Math.cos(angle) *
                burstSpeed,

            vy:
                Math.sin(angle) *
                burstSpeed,

            targetX,
            targetY,

            color:
                pick(palette),

            age: 0,

            phase:
                random(
                    0,
                    Math.PI * 2
                ),

            size:
                random(
                    0.65,
                    1.15
                )
        });
    }

    /*
       Explosion sound only.
    */

    playTextFireworkSound();
}


/* =========================================================
   TEXT PARTICLE UPDATE
========================================================= */

function updateTextParticles() {

    for (
        let i =
            textParticles.length - 1;
        i >= 0;
        i--
    ) {

        const p =
            textParticles[i];

        p.age++;


        /*
           Initial explosion.
        */

        if (
            p.age < 13
        ) {

            p.x +=
                p.vx;

            p.y +=
                p.vy;

            p.vx *=
                0.84;

            p.vy *=
                0.84;

            continue;
        }


        /*
           Pull the particle toward
           its exact letter location.
        */

        const dx =
            p.targetX -
            p.x;

        const dy =
            p.targetY -
            p.y;

        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        if (
            distance > 0.55
        ) {

            let attraction =
                0.018;

            if (
                distance < 8
            ) {

                attraction =
                    0.055;
            }

            if (
                distance < 3.5
            ) {

                attraction =
                    0.15;
            }

            if (
                distance < 1.5
            ) {

                attraction =
                    0.24;
            }

            p.vx +=
                dx *
                attraction;

            p.vy +=
                dy *
                attraction;

            p.vx *=
                0.70;

            p.vy *=
                0.70;

            p.x +=
                p.vx;

            p.y +=
                p.vy;
        }

        else {

            /*
               Very small movement while
               the text is being held.
            */

            p.x =
                p.targetX +
                Math.sin(
                    p.age * 0.07 +
                    p.phase
                ) *
                TEXT_HOLD_JITTER;

            p.y =
                p.targetY +
                Math.cos(
                    p.age * 0.065 +
                    p.phase
                ) *
                TEXT_HOLD_JITTER;

            p.vx = 0;
            p.vy = 0;
        }


        /*
           Hold the text for about 5.5 seconds.
        */

        if (
            p.age > 330
        ) {

            textParticles.splice(
                i,
                1
            );
        }
    }
}


/* =========================================================
   DRAW TEXT PARTICLES
========================================================= */

function drawTextParticles() {

    ctx.save();

    for (
        const p
        of textParticles
    ) {

        let alpha =
            1;

        if (
            p.age > 280
        ) {

            alpha =
                clamp(
                    1 -
                    (
                        p.age -
                        280
                    ) /
                    50,
                    0,
                    1
                );
        }

        alpha *=
            0.86 +
            Math.sin(
                p.age * 0.12 +
                p.phase
            ) *
            0.14;

        ctx.globalAlpha =
            clamp(
                alpha,
                0,
                1
            );

        ctx.fillStyle =
            p.color;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.restore();
}


/* =========================================================
   TEXT ROCKET UPDATE
========================================================= */

function updateTextRockets() {

    for (
        let i =
            textRockets.length - 1;
        i >= 0;
        i--
    ) {

        const rocket =
            textRockets[i];

        rocket.trail.push({

            x:
                rocket.x,

            y:
                rocket.y
        });

        if (
            rocket.trail.length >
            12
        ) {

            rocket.trail.shift();
        }

        rocket.x +=
            rocket.vx;

        rocket.y +=
            rocket.vy;

        const dx =
            rocket.targetX -
            rocket.x;

        const dy =
            rocket.targetY -
            rocket.y;

        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );

        if (
            distance < 18
        ) {

            createTextExplosion(
                rocket.x,
                rocket.y,
                rocket.text
            );

            textRockets.splice(
                i,
                1
            );
        }
    }
}


/* =========================================================
   DRAW TEXT ROCKETS
========================================================= */

function drawTextRockets() {

    ctx.save();

    for (
        const rocket
        of textRockets
    ) {

        if (
            rocket.trail.length >
            1
        ) {

            ctx.beginPath();

            ctx.moveTo(
                rocket.trail[0].x,
                rocket.trail[0].y
            );

            for (
                let i = 1;
                i < rocket.trail.length;
                i++
            ) {

                ctx.lineTo(
                    rocket.trail[i].x,
                    rocket.trail[i].y
                );
            }

            ctx.strokeStyle =
                "rgba(255,255,255,0.38)";

            ctx.lineWidth =
                1;

            ctx.stroke();
        }

        ctx.beginPath();

        ctx.arc(
            rocket.x,
            rocket.y,
            1.8,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#ffffff";

        ctx.fill();
    }

    ctx.restore();
}


/* =========================================================
   BACKGROUND
========================================================= */

function drawBackground() {

    ctx.fillStyle =
        "rgba(0,0,0,0.20)";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );
}


/* =========================================================
   MAIN SHOW
========================================================= */

const SHOW_DURATION =
    5 * 60 * 1000;

const FIREWORK_BUFFER =
    400;

const MIN_LAUNCH_INTERVAL =
    550;

const MAX_LAUNCH_INTERVAL =
    800;

let showRunning =
    false;

let showStartTime =
    0;

let nextLaunchTime =
    0;

let showItemIndex =
    0;


/* =========================================================
   NORMAL SHOW SCHEDULER
========================================================= */

function scheduleMainShow(
    elapsed
) {

    if (
        elapsed >=
        SHOW_DURATION
    ) {
        return;
    }

    if (
        elapsed +
        FIREWORK_BUFFER >=
        nextLaunchTime
    ) {

        const type =
            showItems[
                showItemIndex %
                showItems.length
            ];

        showItemIndex++;

        const palette =
            pick(palettes);

        const targetX =
            random(
                width * 0.12,
                width * 0.88
            );

        const targetY =
            random(
                height * 0.18,
                height * 0.55
            );

        createRocket(
            targetX,
            targetY,
            type,
            palette
        );

        const interval =
            random(
                MIN_LAUNCH_INTERVAL,
                MAX_LAUNCH_INTERVAL
            );

        nextLaunchTime =
            elapsed +
            interval;


        /*
           Occasional second firework.
        */

        if (
            Math.random() <
            0.34
        ) {

            const secondType =
                showItems[
                    showItemIndex %
                    showItems.length
                ];

            showItemIndex++;

            createRocket(
                random(
                    width * 0.12,
                    width * 0.88
                ),
                random(
                    height * 0.18,
                    height * 0.55
                ),
                secondType,
                pick(palettes)
            );
        }


        /*
           Occasional third firework.
        */

        if (
            Math.random() <
            0.11
        ) {

            const thirdType =
                showItems[
                    showItemIndex %
                    showItems.length
                ];

            showItemIndex++;

            createRocket(
                random(
                    width * 0.12,
                    width * 0.88
                ),
                random(
                    height * 0.18,
                    height * 0.55
                ),
                thirdType,
                pick(palettes)
            );
        }
    }
}


/* =========================================================
   FINALE
========================================================= */

const finaleEvents =
    [];

function resetFinale() {

    finaleEvents.length =
        0;

    finaleEvents.push({

        time: 0,

        text: "HAPPY",

        fired: false
    });

    finaleEvents.push({

        time: 5000,

        text: "BIRTHDAY",

        fired: false
    });

    finaleEvents.push({

        time: 9700,

        text: null,

        name: true,

        fired: false
    });

    finaleEvents.push({

        time: 13500,

        text: null,

        name: true,

        fired: false
    });
}


function updateFinale(
    elapsed
) {

    if (
        elapsed <
        SHOW_DURATION
    ) {
        return;
    }

    const finaleElapsed =
        elapsed -
        SHOW_DURATION;

    for (
        const event
        of finaleEvents
    ) {

        if (
            event.fired
        ) {
            continue;
        }

        if (
            finaleElapsed >=
            event.time
        ) {

            event.fired =
                true;

            let text =
                event.text;

            if (
                event.name
            ) {

                text =
                    sanitizeName(
                        nameInput.value
                    );
            }

            if (!text) {
                continue;
            }

            /*
               Text rocket uses its own
               rocket system.
            */

            createTextRocket(
                text,
                pick(palettes)
            );
        }
    }
}


/* =========================================================
   SHOW LOOP
========================================================= */

let animationFrame =
    null;

function animationLoop(
    now
) {

    if (
        !showRunning
    ) {
        return;
    }

    const elapsed =
        now -
        showStartTime;

    drawBackground();


    /*
       Main show.
    */

    if (
        elapsed <
        SHOW_DURATION
    ) {

        scheduleMainShow(
            elapsed
        );
    }


    /*
       Finale.
    */

    updateFinale(
        elapsed
    );


    /*
       Update systems separately.
    */

    updateRockets();

    updateTextRockets();

    updateParticles();

    updateTextParticles();


    /*
       Draw systems separately.
    */

    drawParticles();

    drawRockets();

    drawTextParticles();

    drawTextRockets();


    animationFrame =
        requestAnimationFrame(
            animationLoop
        );
}


/* =========================================================
   NAME
========================================================= */

function sanitizeName(
    value
) {

    let clean =
        String(
            value || ""
        )
        .toUpperCase()
        .replace(
            /[^A-Z ]/g,
            ""
        )
        .replace(
            /\s+/g,
            " "
        )
        .trim();

    if (
        !clean
    ) {

        clean =
            "NAME";
    }

    if (
        clean.length >
        20
    ) {

        clean =
            clean
            .slice(
                0,
                20
            )
            .trim();
    }

    return clean;
}


/* =========================================================
   START ELEMENTS
========================================================= */

const startScreen =
    document.getElementById(
        "startScreen"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const nameInput =
    document.getElementById(
        "nameInput"
    );

const showInfo =
    document.getElementById(
        "showInfo"
    );


/* =========================================================
   START SHOW
========================================================= */

function startShow() {

    initAudio();

    if (
        audioContext &&
        audioContext.state ===
        "suspended"
    ) {

        audioContext.resume();
    }


    /*
       Completely clear previous show.
    */

    particles.length =
        0;

    rockets.length =
        0;

    textParticles.length =
        0;

    textRockets.length =
        0;


    showItemIndex =
        0;

    resetFinale();


    showRunning =
        true;

    showStartTime =
        performance.now();

    nextLaunchTime =
        0;


    startScreen.style.display =
        "none";

    showInfo.style.opacity =
        "1";


    if (
        animationFrame
    ) {

        cancelAnimationFrame(
            animationFrame
        );
    }


    animationFrame =
        requestAnimationFrame(
            animationLoop
        );
}


/* =========================================================
   EVENTS
========================================================= */

startButton.addEventListener(
    "click",
    startShow
);

nameInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Enter"
        ) {

            startShow();
        }
    }
);


/* =========================================================
   PREVENT PAGE GESTURES / ZOOM
========================================================= */

document.addEventListener(
    "touchmove",
    event => {

        event.preventDefault();

    },
    {
        passive: false
    }
);

document.addEventListener(
    "gesturestart",
    event => {

        event.preventDefault();

    },
    {
        passive: false
    }
);

document.addEventListener(
    "dblclick",
    event => {

        event.preventDefault();

    },
    {
        passive: false
    }
);


/* =========================================================
   INITIAL FRAME
========================================================= */

ctx.fillStyle =
    "#000";

ctx.fillRect(
    0,
    0,
    width,
    height
);

</script>
