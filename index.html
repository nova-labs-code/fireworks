<canvas id="canvas"></canvas>

<div id="ui">
    <div id="startScreen">
        <h1>Birthday Fireworks</h1>

        <p>
            A continuous 5-minute fireworks show followed by a special
            particle-built birthday finale.
        </p>

        <input
            id="nameInput"
            type="text"
            maxlength="20"
            autocomplete="off"
            autocapitalize="characters"
            placeholder="Enter a name"
        >

        <button id="startButton">
            Start Show
        </button>
    </div>
</div>

<script>
"use strict";

/* =========================================================
   CANVAS
========================================================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let width = 0;
let height = 0;
let dpr = 1;

function resize() {

    dpr = Math.min(window.devicePixelRatio || 1, 2);

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);

    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

window.addEventListener("resize", resize);
resize();


/* =========================================================
   AUDIO
   Explosion sounds only.
   NO rocket whistle / NO launch sound.
========================================================= */

let audioContext = null;
let masterGain = null;
let compressor = null;
let noiseBuffer = null;
let audioReady = false;

function initAudio() {

    if (audioReady) {

        if (
            audioContext &&
            audioContext.state === "suspended"
        ) {
            audioContext.resume();
        }

        return;
    }

    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

    if (!AudioContext) {
        return;
    }

    audioContext = new AudioContext();

    compressor =
        audioContext.createDynamicsCompressor();

    compressor.threshold.value = -18;
    compressor.knee.value = 18;
    compressor.ratio.value = 7;
    compressor.attack.value = 0.003;
    compressor.release.value = 0.18;

    masterGain =
        audioContext.createGain();

    masterGain.gain.value = 0.30;

    masterGain.connect(compressor);
    compressor.connect(audioContext.destination);

    createNoiseBuffer();

    audioReady = true;

    if (audioContext.state === "suspended") {
        audioContext.resume();
    }
}


function createNoiseBuffer() {

    const sampleRate = audioContext.sampleRate;
    const length = Math.floor(sampleRate * 2);

    noiseBuffer =
        audioContext.createBuffer(
            1,
            length,
            sampleRate
        );

    const data =
        noiseBuffer.getChannelData(0);

    for (let i = 0; i < length; i++) {
        data[i] =
            (Math.random() * 2 - 1) * 0.85;
    }
}


function getAudioTime() {

    if (!audioContext) {
        return 0;
    }

    return audioContext.currentTime + 0.015;
}


function createTone(
    startFrequency,
    endFrequency,
    duration,
    volume,
    waveform = "sine",
    delay = 0
) {

    if (!audioReady) {
        return;
    }

    const now =
        getAudioTime() + delay;

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type = waveform;

    oscillator.frequency.setValueAtTime(
        Math.max(20, startFrequency),
        now
    );

    oscillator.frequency.exponentialRampToValueAtTime(
        Math.max(20, endFrequency),
        now + duration
    );

    gain.gain.setValueAtTime(
        0.0001,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        Math.max(0.0002, volume),
        now + 0.006
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + duration
    );

    oscillator.connect(gain);
    gain.connect(masterGain);

    oscillator.start(now);
    oscillator.stop(now + duration + 0.03);
}


function createNoiseBurst(
    duration,
    volume,
    filterType,
    frequency,
    delay = 0,
    resonance = 0.7
) {

    if (!audioReady || !noiseBuffer) {
        return;
    }

    const now =
        getAudioTime() + delay;

    const source =
        audioContext.createBufferSource();

    const filter =
        audioContext.createBiquadFilter();

    const gain =
        audioContext.createGain();

    source.buffer = noiseBuffer;

    filter.type = filterType;
    filter.frequency.value = frequency;
    filter.Q.value = resonance;

    gain.gain.setValueAtTime(
        0.0001,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        Math.max(0.0002, volume),
        now + 0.004
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + duration
    );

    source.connect(filter);
    filter.connect(gain);
    gain.connect(masterGain);

    source.start(now);
    source.stop(now + duration + 0.03);
}


function playBoom(
    intensity = 1,
    size = "normal",
    delay = 0
) {

    if (!audioReady) {
        return;
    }

    let duration = 0.32;
    let volume = 0.24;

    if (size === "large") {
        duration = 0.48;
        volume = 0.30;
    }

    if (size === "soft") {
        duration = 0.52;
        volume = 0.16;
    }

    createTone(
        random(70, 95),
        random(27, 40),
        duration,
        volume * intensity,
        "sine",
        delay
    );

    createTone(
        random(115, 155),
        random(45, 65),
        duration * 0.72,
        volume * 0.55 * intensity,
        "sine",
        delay
    );

    createNoiseBurst(
        duration * 0.95,
        0.17 * intensity,
        "lowpass",
        random(700, 1100),
        delay,
        0.5
    );

    createNoiseBurst(
        0.075,
        0.10 * intensity,
        "highpass",
        random(2800, 4600),
        delay
    );
}


function playSnap(
    intensity = 1,
    delay = 0
) {

    if (!audioReady) {
        return;
    }

    createNoiseBurst(
        0.055,
        0.10 * intensity,
        "highpass",
        random(3500, 6500),
        delay
    );
}


function playCrackleSounds(
    amount = 12,
    intensity = 1,
    spread = 0.65
) {

    if (!audioReady) {
        return;
    }

    amount = Math.min(amount, 18);

    for (let i = 0; i < amount; i++) {

        const delay =
            random(0.025, spread);

        createNoiseBurst(
            random(0.018, 0.045),
            random(0.018, 0.045) * intensity,
            "highpass",
            random(2500, 7000),
            delay
        );
    }
}


function playStandardFireworkSound(
    type,
    intensity = 1
) {

    if (!audioReady) {
        return;
    }

    if (type === "doubleRing") {

        playBoom(intensity, "normal");

        playSnap(
            intensity * 0.7,
            0.035
        );

        playBoom(
            intensity * 0.88,
            "normal",
            0.13
        );

        playSnap(
            intensity * 0.7,
            0.16
        );

        return;
    }

    if (type === "willow") {

        playBoom(
            intensity * 0.82,
            "soft"
        );

        playCrackleSounds(
            7,
            intensity * 0.7,
            0.95
        );

        return;
    }

    if (type === "crackle") {

        playBoom(intensity);

        playSnap(
            intensity,
            0.035
        );

        playCrackleSounds(
            17,
            intensity,
            0.72
        );

        return;
    }

    if (type === "chrysanthemum") {

        playBoom(
            intensity * 1.05,
            "large"
        );

        playSnap(
            intensity,
            0.035
        );

        playCrackleSounds(
            8,
            intensity * 0.7,
            0.60
        );

        return;
    }

    if (type === "golden") {

        playBoom(
            intensity,
            "large"
        );

        playCrackleSounds(
            10,
            intensity * 0.72,
            0.90
        );

        return;
    }

    if (type === "fan") {

        playBoom(
            intensity * 0.75,
            "normal"
        );

        playSnap(
            intensity * 0.75,
            0.05
        );

        playSnap(
            intensity * 0.68,
            0.17
        );

        playSnap(
            intensity * 0.60,
            0.29
        );

        return;
    }

    if (type === "heart") {

        playBoom(
            intensity * 0.82,
            "soft"
        );

        return;
    }

    if (type === "rainbow") {

        playBoom(
            intensity,
            "large"
        );

        return;
    }

    playBoom(
        intensity,
        "normal"
    );

    playSnap(
        intensity * 0.82,
        0.035
    );
}


function playTextFireworkSound(
    intensity = 1.25
) {

    if (!audioReady) {
        return;
    }

    playBoom(
        intensity,
        "large"
    );

    playSnap(
        intensity,
        0.035
    );

    for (let i = 0; i < 10; i++) {

        createNoiseBurst(
            0.035,
            0.015 * intensity,
            "highpass",
            random(3500, 7000),
            0.08 + i * 0.055
        );
    }
}


/* =========================================================
   UTILITIES
========================================================= */

function random(min, max) {
    return Math.random() * (max - min) + min;
}


function randomInt(min, max) {
    return Math.floor(
        random(min, max + 1)
    );
}


function pick(array) {
    return array[
        Math.floor(
            Math.random() * array.length
        )
    ];
}


function clamp(value, min, max) {
    return Math.max(
        min,
        Math.min(max, value)
    );
}

/* =========================================================
   NORMAL FIREWORKS
========================================================= */

function createRocket(
    x,
    targetY,
    type,
    paletteIndex
) {

    const startX =
        x !== undefined
            ? x
            : random(width * 0.08, width * 0.92);

    const startY =
        height + random(10, 45);

    const distance =
        startY - targetY;

    const speed =
        random(8.5, 12.5);

    rockets.push({

        x: startX,
        y: startY,

        vx: random(-0.18, 0.18),
        vy: -speed,

        targetY,

        type,

        palette:
            palettes[paletteIndex % palettes.length],

        age: 0,

        trail: [],

        exploded: false,

        gravity: 0.035,

        targetSpeed: speed,

        delay: 0
    });
}


function addParticle(
    x,
    y,
    vx,
    vy,
    color,
    life,
    size = 1,
    gravity = 0.035,
    friction = 0.985,
    twinkle = true
) {

    if (particles.length >= MAX_PARTICLES) {
        return;
    }

    particles.push({

        x,
        y,

        vx,
        vy,

        color,

        life,
        maxLife: life,

        size,

        gravity,
        friction,

        twinkle,

        alpha: 1,

        phase:
            random(0, Math.PI * 2),

        trail: []
    });
}


function createExplosion(
    x,
    y,
    type,
    palette
) {

    const count =
        type === "willow"
            ? randomInt(180, 260)
            : type === "crackle"
                ? randomInt(220, 300)
                : type === "chrysanthemum"
                    ? randomInt(240, 330)
                    : type === "golden"
                        ? randomInt(220, 300)
                        : randomInt(170, 250);

    playStandardFireworkSound(
        type,
        random(0.78, 1.08)
    );

    if (type === "sphere") {

        for (let i = 0; i < count; i++) {

            const angle =
                random(0, Math.PI * 2);

            const speed =
                random(2.2, 7.5);

            addParticle(
                x,
                y,
                Math.cos(angle) * speed,
                Math.sin(angle) * speed,
                pick(palette),
                randomInt(55, 105),
                random(0.8, 1.8)
            );
        }

        return;
    }


    if (type === "ring") {

        for (let i = 0; i < count; i++) {

            const angle =
                (i / count) * Math.PI * 2;

            const speed =
                random(5.2, 7.0);

            addParticle(
                x,
                y,
                Math.cos(angle) * speed,
                Math.sin(angle) * speed,
                pick(palette),
                randomInt(60, 105),
                random(0.8, 1.6)
            );
        }

        return;
    }


    if (type === "doubleRing") {

        const half =
            Math.floor(count / 2);

        for (let i = 0; i < count; i++) {

            const ring =
                i < half ? 0 : 1;

            const index =
                ring === 0
                    ? i
                    : i - half;

            const ringCount =
                ring === 0
                    ? half
                    : count - half;

            const angle =
                (index / ringCount) *
                Math.PI * 2;

            const speed =
                ring === 0
                    ? random(3.7, 5.1)
                    : random(6.0, 7.6);

            addParticle(
                x,
                y,
                Math.cos(angle) * speed,
                Math.sin(angle) * speed,
                pick(palette),
                randomInt(60, 110),
                random(0.8, 1.6)
            );
        }

        return;
    }


    if (type === "willow") {

        for (let i = 0; i < count; i++) {

            const angle =
                random(0, Math.PI * 2);

            const speed =
                random(2.0, 5.5);

            addParticle(
                x,
                y,
                Math.cos(angle) * speed,
                Math.sin(angle) * speed,
                pick(palette),
                randomInt(95, 160),
                random(1.0, 2.0),
                0.065,
                0.993
            );
        }

        return;
    }


    if (type === "crackle") {

        for (let i = 0; i < count; i++) {

            const angle =
                random(0, Math.PI * 2);

            const speed =
                random(2.5, 7.8);

            addParticle(
                x,
                y,
                Math.cos(angle) * speed,
                Math.sin(angle) * speed,
                pick(palette),
                randomInt(35, 85),
                random(0.8, 1.9)
            );
        }

        return;
    }


    if (type === "chrysanthemum") {

        for (let i = 0; i < count; i++) {

            const angle =
                (i / count) *
                Math.PI * 2 +
                random(-0.025, 0.025);

            const speed =
                random(4.2, 8.0);

            addParticle(
                x,
                y,
                Math.cos(angle) * speed,
                Math.sin(angle) * speed,
                pick(palette),
                randomInt(65, 115),
                random(0.8, 1.7)
            );
        }

        return;
    }


    if (type === "peony") {

        for (let i = 0; i < count; i++) {

            const angle =
                random(0, Math.PI * 2);

            const speed =
                random(3.0, 7.4);

            addParticle(
                x,
                y,
                Math.cos(angle) * speed,
                Math.sin(angle) * speed,
                pick(palette),
                randomInt(55, 100),
                random(0.8, 1.7)
            );
        }

        return;
    }


    if (type === "fan") {

        const arms = 5;

        for (let arm = 0; arm < arms; arm++) {

            const baseAngle =
                -Math.PI * 0.88 +
                (arm / (arms - 1)) *
                Math.PI * 0.76;

            const armCount =
                Math.floor(count / arms);

            for (let i = 0; i < armCount; i++) {

                const angle =
                    baseAngle +
                    random(-0.035, 0.035);

                const speed =
                    random(3.5, 7.4);

                addParticle(
                    x,
                    y,
                    Math.cos(angle) * speed,
                    Math.sin(angle) * speed,
                    pick(palette),
                    randomInt(55, 100),
                    random(0.8, 1.7)
                );
            }
        }

        return;
    }


    if (type === "heart") {

        for (let i = 0; i < count; i++) {

            const t =
                (i / count) *
                Math.PI * 2;

            const hx =
                16 *
                Math.pow(Math.sin(t), 3);

            const hy =
                -(
                    13 * Math.cos(t) -
                    5 * Math.cos(2 * t) -
                    2 * Math.cos(3 * t) -
                    Math.cos(4 * t)
                );

            const length =
                Math.sqrt(hx * hx + hy * hy) || 1;

            const speed =
                random(0.34, 0.52);

            addParticle(
                x,
                y,
                hx / length * speed,
                hy / length * speed,
                pick(palette),
                randomInt(65, 105),
                random(0.9, 1.7)
            );
        }

        return;
    }


    if (type === "spiral") {

        for (let i = 0; i < count; i++) {

            const t =
                i / count;

            const angle =
                t * Math.PI * 8;

            const speed =
                1.7 + t * 6;

            addParticle(
                x,
                y,
                Math.cos(angle) * speed,
                Math.sin(angle) * speed,
                pick(palette),
                randomInt(55, 105),
                random(0.8, 1.6)
            );
        }

        return;
    }

    if (type === "rainbow") {

        const rainbow = [
            "#ff4d4d",
            "#ff922b",
            "#ffd43b",
            "#51cf66",
            "#22b8cf",
            "#4dabf7",
            "#845ef7",
            "#f06595"
        ];

        for (let i = 0; i < count; i++) {

            const angle =
                random(0, Math.PI * 2);

            const speed =
                random(2.8, 7.4);

            addParticle(
                x,
                y,
                Math.cos(angle) * speed,
                Math.sin(angle) * speed,
                rainbow[
                    i % rainbow.length
                ],
                randomInt(60, 105),
                random(0.8, 1.7)
            );
        }

        return;
    }


    if (type === "golden") {

        for (let i = 0; i < count; i++) {

            const angle =
                random(0, Math.PI * 2);

            const speed =
                random(2.5, 7.5);

            addParticle(
                x,
                y,
                Math.cos(angle) * speed,
                Math.sin(angle) * speed,
                pick(palette),
                randomInt(75, 135),
                random(0.9, 1.9),
                0.055,
                0.992
            );
        }

        return;
    }
}


/* =========================================================
   TEXT FIREWORK
========================================================= */

/*
   3 particles per sampled pixel.

   The important part is that the 3 particles are NOT
   randomly scattered over a large area.

   They form a tiny controlled cluster around each target.
   This keeps the actual letter shape readable.
*/

const textRasterCanvas =
    document.createElement("canvas");

const textRasterCtx =
    textRasterCanvas.getContext("2d");


const PARTICLES_PER_TEXT_PIXEL = 3;
const MAX_TEXT_PARTICLES = 4000;


/*
   A sample every 2 raster pixels gives us a detailed
   target map without creating an excessive number of
   targets on phones.
*/
const TEXT_SAMPLE_STEP = 2;


/*
   Maximum distance from a text target for the three
   particles.

   Keeping this below the raster sample spacing is what
   prevents the extra particles from making the letters
   look fuzzy.
*/
const TEXT_PARTICLE_CLUSTER_RADIUS = 0.85;


/*
   Tiny movement while holding the letter.
*/
const TEXT_HOLD_JITTER = 0.28;


/*
   Creates a high-resolution bitmap of the text.
*/
function createLetterTargets(text) {

    text =
        text
            .toUpperCase()
            .replace(/[^A-Z ]/g, "");

    if (!text) {
        text = "ZAYDEN";
    }


    /*
       Large offscreen raster.

       This gives us considerably more detail than a
       5x7 bitmap font.
    */

    const rasterWidth =
        Math.max(
            1000,
            Math.floor(width * 2)
        );

    const rasterHeight =
        Math.max(
            300,
            Math.floor(height * 0.58)
        );


    textRasterCanvas.width =
        rasterWidth;

    textRasterCanvas.height =
        rasterHeight;


    textRasterCtx.clearRect(
        0,
        0,
        rasterWidth,
        rasterHeight
    );


    /*
       Calculate a large font that fits.
    */

    let fontSize =
        Math.min(
            rasterHeight * 0.56,
            rasterWidth /
                Math.max(
                    text.length * 0.68,
                    1
                )
        );

    fontSize =
        Math.max(
            40,
            fontSize
        );


    textRasterCtx.font =
        `900 ${fontSize}px Arial Black, Arial, Helvetica, sans-serif`;

    textRasterCtx.textAlign =
        "center";

    textRasterCtx.textBaseline =
        "middle";

    textRasterCtx.fillStyle =
        "#ffffff";


    /*
       Slight stroke makes thin letter edges survive
       the particle sampling better.
    */

    textRasterCtx.lineWidth =
        Math.max(
            1.5,
            fontSize * 0.012
        );

    textRasterCtx.strokeStyle =
        "#ffffff";


    textRasterCtx.strokeText(
        text,
        rasterWidth / 2,
        rasterHeight / 2
    );

    textRasterCtx.fillText(
        text,
        rasterWidth / 2,
        rasterHeight / 2
    );


    const imageData =
        textRasterCtx.getImageData(
            0,
            0,
            rasterWidth,
            rasterHeight
        );

    const data =
        imageData.data;


    /*
       Find the actual visible bounds.
    */

    let minX = rasterWidth;
    let maxX = 0;
    let minY = rasterHeight;
    let maxY = 0;


    for (
        let y = 0;
        y < rasterHeight;
        y += TEXT_SAMPLE_STEP
    ) {

        for (
            let x = 0;
            x < rasterWidth;
            x += TEXT_SAMPLE_STEP
        ) {

            const index =
                (y * rasterWidth + x) * 4;

            const alpha =
                data[index + 3];


            if (alpha > 100) {

                if (x < minX) {
                    minX = x;
                }

                if (x > maxX) {
                    maxX = x;
                }

                if (y < minY) {
                    minY = y;
                }

                if (y > maxY) {
                    maxY = y;
                }
            }
        }
    }


    if (minX >= rasterWidth) {
        return [];
    }


    const actualWidth =
        maxX - minX;

    const actualHeight =
        maxY - minY;


    /*
       Keep the complete word comfortably inside the screen.
    */

    const desiredWidth =
        Math.min(
            width * 0.90,
            width - 30
        );

    const desiredHeight =
        Math.min(
            height * 0.48,
            height - 40
        );


    const scale =
        Math.min(
            desiredWidth /
                Math.max(actualWidth, 1),

            desiredHeight /
                Math.max(actualHeight, 1)
        );


    const finalWidth =
        actualWidth * scale;

    const finalHeight =
        actualHeight * scale;


    const startX =
        (width - finalWidth) / 2;


    const startY =
        height * 0.38 -
        finalHeight / 2;


    const targets = [];


    /*
       Convert raster pixels into screen-space targets.
    */

    for (
        let y = minY;
        y <= maxY;
        y += TEXT_SAMPLE_STEP
    ) {

        for (
            let x = minX;
            x <= maxX;
            x += TEXT_SAMPLE_STEP
        ) {

            const index =
                (y * rasterWidth + x) * 4;

            const alpha =
                data[index + 3];


            if (alpha > 100) {

                targets.push({

                    x:
                        startX +
                        (x - minX) *
                        scale,

                    y:
                        startY +
                        (y - minY) *
                        scale
                });
            }
        }
    }


    return targets;
}


/*
   Create the rocket that will eventually become a word.
*/

function createTextRocket(
    targetX,
    targetY,
    palette,
    textTargets,
    delay = 0
) {

    const startX =
        random(
            width * 0.15,
            width * 0.85
        );

    const startY =
        height + 50;


    const dx =
        targetX - startX;

    const dy =
        targetY - startY;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    const speed = 9.5;


    rockets.push({

        x: startX,
        y: startY,

        vx:
            dx /
            distance *
            speed,

        vy:
            dy /
            distance *
            speed,

        targetX,
        targetY,

        palette,

        type: "text",

        age: -delay,

        trail: [],

        textTargets,

        exploded: false
    });
}


/*
   Create the actual tiny particle-built letters.
*/
function createTextExplosion(rocket) {

    textParticles.length = 0;


    const targets =
        rocket.textTargets || [];


    if (!targets.length) {
        return;
    }


    const centerX =
        rocket.x;

    const centerY =
        rocket.y;

    const palette =
        rocket.palette;


    /*
       Deterministic 3-particle pattern.

       Every raster target receives:
          particle 1 = exact center
          particle 2 = tiny offset
          particle 3 = opposite tiny offset

       This is much more readable than three completely
       random particles.
    */

    const clusterPatterns = [

        {
            x: 0,
            y: 0
        },

        {
            x: -TEXT_PARTICLE_CLUSTER_RADIUS,
            y: TEXT_PARTICLE_CLUSTER_RADIUS * 0.42
        },

        {
            x: TEXT_PARTICLE_CLUSTER_RADIUS,
            y: -TEXT_PARTICLE_CLUSTER_RADIUS * 0.42
        }
    ];


    for (
        let i = 0;
        i < targets.length;
        i++
    ) {

        const target =
            targets[i];


        for (
            let j = 0;
            j < PARTICLES_PER_TEXT_PIXEL;
            j++
        ) {

            if (
                textParticles.length >=
                MAX_TEXT_PARTICLES
            ) {
                break;
            }


            const angle =
                random(
                    0,
                    Math.PI * 2
                );


            const burstDistance =
                random(
                    35,
                    155
                );


            const burstX =
                centerX +
                Math.cos(angle) *
                burstDistance;


            const burstY =
                centerY +
                Math.sin(angle) *
                burstDistance;


            const burstSpeed =
                random(
                    2.8,
                    7.2
                );


            /*
               Use the controlled pattern.

               A tiny additional variation is allowed,
               but never enough to destroy the letter.
            */

            const pattern =
                clusterPatterns[
                    j % clusterPatterns.length
                ];


            const tinyVariation =
                j === 0
                    ? random(-0.08, 0.08)
                    : random(-0.10, 0.10);


            const particleTargetX =
                target.x +
                pattern.x +
                tinyVariation;


            const particleTargetY =
                target.y +
                pattern.y +
                tinyVariation;


            textParticles.push({

                x: centerX,
                y: centerY,

                vx:
                    Math.cos(angle) *
                    burstSpeed,

                vy:
                    Math.sin(angle) *
                    burstSpeed,

                burstX,
                burstY,

                targetX:
                    particleTargetX,

                targetY:
                    particleTargetY,

                life: 0,

                /*
                   Staggering the assembly slightly makes
                   the word appear to form naturally instead
                   of instantly popping into existence.
                */

                assembleDelay:
                    random(18, 58) +
                    (i / Math.max(targets.length, 1)) *
                    random(0, 28),

                size:
                    j === 0
                        ? random(0.55, 1.05)
                        : random(0.48, 0.95),

                color:
                    pick(palette),

                phase:
                    random(
                        0,
                        Math.PI * 2
                    ),

                trail: [],

                assembled: false,

                bright:
                    Math.random() < 0.18
            });
        }


        if (
            textParticles.length >=
            MAX_TEXT_PARTICLES
        ) {
            break;
        }
    }


    /*
       Extra loose sparks around the explosion.

       These do NOT participate in the letters.
    */

    const looseCount =
        Math.min(
            140,
            MAX_TEXT_PARTICLES -
                textParticles.length
        );


    for (
        let i = 0;
        i < looseCount;
        i++
    ) {

        const angle =
            random(
                0,
                Math.PI * 2
            );

        const speed =
            random(
                2.5,
                8
            );


        textParticles.push({

            x: centerX,
            y: centerY,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            targetX: centerX,
            targetY: centerY,

            life: 0,

            assembleDelay: 999999,

            size:
                random(
                    0.55,
                    1.5
                ),

            color:
                pick(palette),

            phase:
                random(
                    0,
                    Math.PI * 2
                ),

            trail: [],

            assembled: false,

            loose: true,

            bright:
                Math.random() < 0.16
        });
    }


    /*
       Explosion sound only.
    */

    playTextFireworkSound(1.25);
}


/*
   Text particle physics.
*/
function updateTextParticles() {

    for (
        let i = textParticles.length - 1;
        i >= 0;
        i--
    ) {

        const p =
            textParticles[i];


        p.life++;


        p.trail.push({
            x: p.x,
            y: p.y
        });


        if (p.trail.length > 4) {
            p.trail.shift();
        }


        /*
           Loose explosion sparks.
        */

        if (p.loose) {

            p.x += p.vx;
            p.y += p.vy;

            p.vx *= 0.975;
            p.vy *= 0.975;

            p.vy += 0.018;


            if (p.life > 78) {
                textParticles.splice(i, 1);
            }

            continue;
        }


        /*
           Explosion phase before assembly.
        */

        if (
            p.life <
            p.assembleDelay
        ) {

            p.x += p.vx;
            p.y += p.vy;

            p.vx *= 0.965;
            p.vy *= 0.965;

            p.vy += 0.010;

            continue;
        }


        /*
           Target attraction.

           As particles get closer to their exact target,
           attraction becomes stronger. This makes the
           letter edges snap into focus.
        */

        const dx =
            p.targetX - p.x;

        const dy =
            p.targetY - p.y;


        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        if (distance > 3.5) {

            /*
               Normal attraction.
            */

            p.vx += dx * 0.020;
            p.vy += dy * 0.020;

            p.vx *= 0.91;
            p.vy *= 0.91;

            p.x += p.vx;
            p.y += p.vy;

        } else if (distance > 0.55) {

            /*
               Strong final snap.

               This prevents individual particles from
               stopping short and making fuzzy letter edges.
            */

            p.vx += dx * 0.075;
            p.vy += dy * 0.075;

            p.vx *= 0.78;
            p.vy *= 0.78;

            p.x += p.vx;
            p.y += p.vy;

        } else {

            /*
               HOLD PHASE

               Particles stay essentially locked to their
               target. Only a tiny shimmer remains.
            */

            p.assembled = true;

            p.x =
                p.targetX +
                Math.sin(
                    p.life * 0.11 +
                    p.phase
                ) *
                TEXT_HOLD_JITTER;

            p.y =
                p.targetY +
                Math.cos(
                    p.life * 0.09 +
                    p.phase
                ) *
                TEXT_HOLD_JITTER;
        }


        /*
           Long enough to clearly read the word.
        */

        if (p.life > 520) {
            textParticles.splice(i, 1);
        }
    }
}


/* =========================================================
   NORMAL PARTICLE UPDATE
========================================================= */

function updateParticles() {

    for (
        let i = particles.length - 1;
        i >= 0;
        i--
    ) {

        const p =
            particles[i];


        p.life--;


        p.trail.push({
            x: p.x,
            y: p.y
        });


        if (p.trail.length > 5) {
            p.trail.shift();
        }


        p.vx *= p.friction;
        p.vy *= p.friction;

        p.vy += p.gravity;

        p.x += p.vx;
        p.y += p.vy;


        const lifeRatio =
            p.life /
            p.maxLife;


        p.alpha =
            clamp(
                lifeRatio,
                0,
                1
            );


        if (p.life <= 0) {
            particles.splice(i, 1);
        }
    }
}


/* =========================================================
   ROCKET UPDATE
========================================================= */

function updateRockets() {

    for (
        let i = rockets.length - 1;
        i >= 0;
        i--
    ) {

        const r =
            rockets[i];


        if (r.age < 0) {
            r.age++;
            continue;
        }


        r.trail.push({
            x: r.x,
            y: r.y
        });


        if (r.trail.length > 8) {
            r.trail.shift();
        }


        r.x += r.vx;
        r.y += r.vy;

        r.vy += r.gravity;


        /*
           Normal firework reaches its target height.
        */

        if (
            !r.exploded &&
            r.y <= r.targetY
        ) {

            r.exploded = true;


            if (r.type === "text") {

                createTextExplosion(r);

            } else {

                createExplosion(
                    r.x,
                    r.y,
                    r.type,
                    r.palette
                );
            }


            rockets.splice(i, 1);
        }
    }
}


/* =========================================================
   DRAW ROCKETS
========================================================= */

function drawRockets() {

    ctx.save();

    for (const r of rockets) {

        if (r.age < 0) {
            continue;
        }


        /*
           Rocket itself is silent, but remains visible.
        */

        if (r.trail.length > 1) {

            ctx.beginPath();

            for (
                let i = 0;
                i < r.trail.length;
                i++
            ) {

                const point =
                    r.trail[i];

                if (i === 0) {
                    ctx.moveTo(
                        point.x,
                        point.y
                    );
                } else {
                    ctx.lineTo(
                        point.x,
                        point.y
                    );
                }
            }


            ctx.strokeStyle =
                "rgba(255,255,255,.35)";

            ctx.lineWidth = 1.2;

            ctx.stroke();
        }


        ctx.beginPath();

        ctx.arc(
            r.x,
            r.y,
            1.5,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#ffffff";

        ctx.fill();
    }

    ctx.restore();
}


/* =========================================================
   DRAW NORMAL PARTICLES
========================================================= */

function drawParticles() {

    ctx.save();

    ctx.globalCompositeOperation =
        "lighter";


    for (const p of particles) {

        if (p.trail.length > 1) {

            ctx.beginPath();

            for (
                let i = 0;
                i < p.trail.length;
                i++
            ) {

                const point =
                    p.trail[i];

                if (i === 0) {

                    ctx.moveTo(
                        point.x,
                        point.y
                    );

                } else {

                    ctx.lineTo(
                        point.x,
                        point.y
                    );
                }
            }


            ctx.strokeStyle =
                p.color;

            ctx.globalAlpha =
                p.alpha * 0.28;

            ctx.lineWidth =
                Math.max(
                    0.45,
                    p.size * 0.55
                );

            ctx.stroke();
        }


        let alpha =
            p.alpha;


        if (p.twinkle) {

            alpha *=
                0.72 +
                Math.sin(
                    performance.now() * 0.012 +
                    p.phase
                ) * 0.28;
        }


        ctx.globalAlpha =
            clamp(
                alpha,
                0,
                1
            );


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            p.color;

        ctx.fill();
    }


    ctx.restore();

    ctx.globalAlpha = 1;
}


/* =========================================================
   DRAW TEXT PARTICLES
========================================================= */

function drawTextParticles() {

    ctx.save();

    ctx.globalCompositeOperation =
        "lighter";


    for (const p of textParticles) {

        /*
           Very subtle trails during assembly.
        */

        if (
            p.trail.length > 1 &&
            !p.assembled
        ) {

            ctx.beginPath();

            for (
                let i = 0;
                i < p.trail.length;
                i++
            ) {

                const point =
                    p.trail[i];

                if (i === 0) {

                    ctx.moveTo(
                        point.x,
                        point.y
                    );

                } else {

                    ctx.lineTo(
                        point.x,
                        point.y
                    );
                }
            }


            ctx.strokeStyle =
                p.color;

            ctx.globalAlpha =
                p.assembled
                    ? 0.08
                    : 0.22;

            ctx.lineWidth =
                Math.max(
                    0.35,
                    p.size * 0.45
                );

            ctx.stroke();
        }


        let alpha = 1;


        if (p.life < p.assembleDelay) {

            alpha =
                clamp(
                    p.life / 12,
                    0,
                    1
                );

        } else {

            alpha =
                0.86 +
                Math.sin(
                    p.life * 0.14 +
                    p.phase
                ) *
                0.14;
        }


        /*
           Bright particles are still tiny.
           This gives the letters a crisp sparkle rather
           than making them look like large glowing dots.
        */

        const size =
            p.bright
                ? p.size * 1.25
                : p.size;


        ctx.globalAlpha =
            clamp(
                alpha,
                0,
                1
            );


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            p.color;

        ctx.fill();
    }


    ctx.restore();

    ctx.globalAlpha = 1;
}


/* =========================================================
   BACKGROUND
========================================================= */

function drawBackground() {

    /*
       Almost-black background with an extremely subtle
       vertical atmosphere.
    */

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            height
        );

    gradient.addColorStop(
        0,
        "#000008"
    );

    gradient.addColorStop(
        0.55,
        "#01010c"
    );

    gradient.addColorStop(
        1,
        "#03000b"
    );


    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        width,
        height
    );
}


/* =========================================================
   SHOW TIMING
========================================================= */

const SHOW_DURATION =
    5 * 60 * 1000;


/*
   0.4 second scheduler buffer.
*/
const FIREWORK_BUFFER = 400;


/*
   No large gaps between launches.
*/
const MIN_LAUNCH_INTERVAL = 550;
const MAX_LAUNCH_INTERVAL = 800;


const MAX_ROCKETS = 28;
const MAX_PARTICLES = 3400;


let showRunning = false;
let finaleRunning = false;
let showFinished = false;

let showStartTime = 0;

let nextLaunchTime = 0;
let nextSpecialTime = 0;

let showItemIndex = 0;

let birthdayName = "ZAYDEN";


/* =========================================================
   LAUNCH SHOW ITEM
========================================================= */

function launchShowItem(item) {

    if (rockets.length >= MAX_ROCKETS) {
        return;
    }


    const palette =
        palettes[
            item.palette %
            palettes.length
        ];


    for (
        let i = 0;
        i < item.count;
        i++
    ) {

        if (
            rockets.length >=
            MAX_ROCKETS
        ) {
            break;
        }


        let x;


        /*
           Spread simultaneous fireworks horizontally.
        */

        if (item.count === 1) {

            x =
                random(
                    width * 0.15,
                    width * 0.85
                );

        } else {

            const spacing =
                width /
                (item.count + 1);

            x =
                spacing *
                (i + 1) +
                random(
                    -width * 0.055,
                    width * 0.055
                );
        }


        const targetY =
            random(
                height * 0.17,
                height * 0.55
            );


        createRocket(
            x,
            targetY,
            item.type,
            item.palette
        );
    }
}


/* =========================================================
   SPECIAL SEQUENCES
========================================================= */

function specialSequence() {

    /*
       Occasional multi-firework moments during the
       five-minute show.
    */

    if (rockets.length >= MAX_ROCKETS - 4) {
        return;
    }


    const specialTypes = [
        "doubleRing",
        "chrysanthemum",
        "golden",
        "rainbow",
        "fan",
        "willow"
    ];


    const type =
        pick(specialTypes);


    const palette =
        randomInt(
            0,
            palettes.length - 1
        );


    const amount =
        randomInt(2, 4);


    for (let i = 0; i < amount; i++) {

        if (
            rockets.length >=
            MAX_ROCKETS
        ) {
            break;
        }


        createRocket(
            random(
                width * 0.12,
                width * 0.88
            ),
            random(
                height * 0.16,
                height * 0.46
            ),
            type,
            palette
        );
    }
}


/* =========================================================
   MAIN SHOW SCHEDULER
========================================================= */

function scheduleMainShow(now) {

    /*
       Use a small buffer so scheduling doesn't accidentally
       leave visible gaps because of frame timing.
    */

    if (
        now + FIREWORK_BUFFER >=
        nextLaunchTime
    ) {

        if (
            rockets.length <
            MAX_ROCKETS
        ) {

            const item =
                showItems[
                    showItemIndex %
                    showItems.length
                ];


            showItemIndex++;


            launchShowItem(item);
        }


        nextLaunchTime =
            now +
            random(
                MIN_LAUNCH_INTERVAL,
                MAX_LAUNCH_INTERVAL
            );
    }


    if (
        now + FIREWORK_BUFFER >=
        nextSpecialTime
    ) {

        specialSequence();


        nextSpecialTime =
            now +
            random(
                3200,
                6500
            );
    }
}


/* =========================================================
   TEXT FINALE
========================================================= */

function launchFinaleText(text) {

    const targets =
        createLetterTargets(text);


    if (!targets.length) {
        return;
    }


    /*
       One central text firework.

       It explodes first, then the tiny particles
       assemble into the word.
    */

    const centerX =
        width / 2;

    const centerY =
        height * 0.34;


    createTextRocket(
        centerX,
        centerY,
        palettes[
            randomInt(
                0,
                palettes.length - 1
            )
        ],
        targets
    );
}


function beginFinale() {

    finaleRunning = true;

    rockets.length = 0;
    particles.length = 0;
    textParticles.length = 0;


    const finaleStart =
        performance.now();


    /*
       HAPPY
    */

    setTimeout(() => {

        launchFinaleText(
            "HAPPY"
        );

    }, 0);


    /*
       BIRTHDAY
    */

    setTimeout(() => {

        textParticles.length = 0;

        launchFinaleText(
            "BIRTHDAY"
        );

    }, 5000);


    /*
       Name
    */

    setTimeout(() => {

        textParticles.length = 0;

        launchFinaleText(
            birthdayName
        );

    }, 9700);


    /*
       Name again for an extra readable hold.
    */

    setTimeout(() => {

        textParticles.length = 0;

        launchFinaleText(
            birthdayName
        );

    }, 13500);


    /*
       End.
    */

    setTimeout(() => {

        finaleRunning = false;
        showFinished = true;

        textParticles.length = 0;

    }, 18100);
}


/* =========================================================
   MAIN ANIMATION
========================================================= */

let lastFrameTime =
    performance.now();


function animate(now) {

    requestAnimationFrame(animate);


    /*
       Prevent huge simulation jumps if the browser
       temporarily pauses the tab.
    */

    const frameDelta =
        Math.min(
            now - lastFrameTime,
            50
        );

    lastFrameTime = now;


    drawBackground();


    if (
        showRunning &&
        !finaleRunning &&
        !showFinished
    ) {

        const elapsed =
            now -
            showStartTime;


        if (
            elapsed >=
            SHOW_DURATION
        ) {

            showRunning = false;

            beginFinale();

        } else {

            scheduleMainShow(now);
        }
    }


    updateRockets();
    updateParticles();
    updateTextParticles();


    drawRockets();
    drawParticles();
    drawTextParticles();
}


requestAnimationFrame(animate);


/* =========================================================
   UI
========================================================= */

const startScreen =
    document.getElementById(
        "startScreen"
    );

const nameInput =
    document.getElementById(
        "nameInput"
    );

const startButton =
    document.getElementById(
        "startButton"
    );


function sanitizeName(value) {

    return value
        .toUpperCase()
        .replace(/[^A-Z ]/g, "")
        .replace(/\s+/g, " ")
        .trim()
        .slice(0, 20);
}


function startShow() {

    initAudio();


    const enteredName =
        sanitizeName(
            nameInput.value
        );


    birthdayName =
        enteredName ||
        "ZAYDEN";


    startScreen.classList.add(
        "hidden"
    );


    rockets.length = 0;
    particles.length = 0;
    textParticles.length = 0;


    showRunning = true;
    finaleRunning = false;
    showFinished = false;


    showItemIndex = 0;


    showStartTime =
        performance.now();


    const now =
        showStartTime;


    nextLaunchTime =
        now + 250;


    nextSpecialTime =
        now +
        random(
            1800,
            3000
        );
}


startButton.addEventListener(
    "click",
    startShow
);


nameInput.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {
            startShow();
        }
    }
);


/* =========================================================
   NO TOUCH / ZOOM / GESTURE INTERACTION
========================================================= */

document.addEventListener(
    "touchmove",
    event => {
        event.preventDefault();
    },
    {
        passive: false
    }
);


document.addEventListener(
    "gesturestart",
    event => {
        event.preventDefault();
    },
    {
        passive: false
    }
);


document.addEventListener(
    "dblclick",
    event => {
        event.preventDefault();
    },
    {
        passive: false
    }
);

</script>

</body>
</html>
