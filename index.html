            border-radius: 14px;

            color: #000;

            font-size: 18px;
            font-weight: 700;

        }

            transform: scale(0.98);
        }

            position: fixed;
            z-index: 5;

            top: 18px;
            left: 50%;

            transform: translateX(-50%);

            pointer-events: none;

            color: rgba(255, 255, 255, 0.75);

            text-align: center;

            transition:

            z-index: 4;

            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            pointer-events: none;

            color: #fff;

                    14px
                );

                0 0 50px #fff;

                scale(0.65);

            transition:
                opacity 0.5s ease,
                transform 0.8s cubic-bezier(
                    0.16,
                    1,
                    0.3,
                    1
                );
        }

        #finaleText.visible {
            opacity: 1;
            transform: scale(1);
        }
    </style>
</head>

/* ================================
   RGB CACHE
================================ */

const rgb = {};

for (
    const color of colors
) {

    const hex =
        color.substring(1);

    rgb[color] = {
        r: parseInt(
            hex.substring(0, 2),
            16
        ),

        g: parseInt(
            hex.substring(2, 4),
            16
        ),

        b: parseInt(
            hex.substring(4, 6),
            16
        )
    };
}

function rgba(
    color,
    alpha
) {

    const c = rgb[color];

    if (!c) {

        return `rgba(
            255,
            255,
            255,
            ${alpha}
        )`;
    }

    return `rgba(
        ${c.r},
        ${c.g},
        ${c.b},
        ${alpha}
    )`;
}

/* ================================

function resize() {

    dpr =
        Math.min(
            window.devicePixelRatio || 1,
            1.5
        );

    width =
        window.innerWidth;

    height =
        window.innerHeight;

    canvas.width =
        Math.floor(
            width * dpr
        );

    canvas.height =
        Math.floor(
            height * dpr
        );

    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

window.addEventListener(
    "resize",
    resize
);

resize();

/* ================================
   RANDOM
================================ */

function random(
    min,
    max
) {

    return Math.random() *
        (max - min) +
        min;
}

function choose(
    array
) {

    return array[
        Math.floor(
            Math.random() *
            array.length
        )
    ];
}

function differentColor(
    color
) {

    let result;

    do {

        result =
            choose(colors);

    } while (
        result === color
    );

    return result;
}

/* ================================
   ROCKET
================================ */

class Rocket {

    constructor(
        targetX,
        targetY,
        showColors = null
    ) {

        this.x =
            random(
                width * 0.08,
                width * 0.92
            );

        this.y =
            height + 15;

        this.targetX =
            targetX;

        this.targetY =
            Math.max(
                70,
                targetY
            );

        this.vx =
            (
                targetX -
                this.x
            ) * 0.005;

        this.vy =
            random(
                -10.2,
                -8.6
            );

        this.color =
            showColors
                ? choose(showColors)
                : choose(colors);

        this.trail = [];

        this.alive = true;
    }

    update() {

        this.trail.push({
            x: this.x,
            y: this.y
        });

        if (
            this.trail.length > 9
        ) {

            this.trail.shift();
        }

        this.vy += 0.035;

        this.x += this.vx;
        this.y += this.vy;

        if (
            this.y <=
                this.targetY ||
            this.vy >= -0.7
        ) {

            this.explode();

            this.alive = false;
        }
    }

    draw() {

        if (
            this.trail.length > 1
        ) {

            ctx.beginPath();

            ctx.moveTo(
                this.trail[0].x,
                this.trail[0].y
            );

            for (
                let i = 1;
                i < this.trail.length;
                i++
            ) {

                ctx.lineTo(
                    this.trail[i].x,
                    this.trail[i].y
                );
            }

            ctx.strokeStyle =
                rgba(
                    this.color,
                    0.5
                );

            ctx.lineWidth = 1.4;

            ctx.stroke();
        }

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            2,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#ffffff";

        ctx.fill();
    }

    explode() {

        const x = this.x;
        const y = this.y;

        const mainColor =
            this.color;

        const secondColor =
            differentColor(
                mainColor
            );

        flashes.push({
            x: x,
            y: y,
            radius: 4,
            maxRadius: random(
                80,
                120
            ),
            life: 1
        });

        rings.push({
            x: x,
            y: y,
            radius: 2,
            life: 1,
            color: mainColor
        });

        const mainCount = 72;

        for (
            let i = 0;
            i < mainCount;
            i++
        ) {

            const angle =
                Math.random() *
                Math.PI * 2;

            const speed =
                random(
                    2.4,
                    5.8
                );

            particles.push(
                new Particle(
                    x,
                    y,
                    Math.cos(angle) *
                        speed,
                    Math.sin(angle) *
                        speed,
                    mainColor,
                    "star"
                )
            );
        }

        const secondaryCount = 24;

        for (
            let i = 0;
            i < secondaryCount;
            i++
        ) {

            const angle =
                Math.random() *
                Math.PI * 2;

            const speed =
                random(
                    1.7,
                    4.3
                );

            particles.push(
                new Particle(
                    x,
                    y,
                    Math.cos(angle) *
                        speed,
                    Math.sin(angle) *
                        speed,
                    secondColor,
                    "star"
                )
            );
        }

        for (
            let i = 0;
            i < 10;
            i++
        ) {

            particles.push(
                new Particle(
                    x,
                    y,
                    random(-2, 2),
                    random(-2, 2),
                    "#ffffff",
                    "core"
                )
            );
        }

        for (
            let i = 0;
            i < 15;
            i++
        ) {

            const angle =
                Math.random() *
                Math.PI * 2;

            const speed =
                random(
                    1.5,
                    4.7
                );

            particles.push(
                new Particle(
                    x,
                    y,
                    Math.cos(angle) *
                        speed,
                    Math.sin(angle) *
                        speed,
                    "#ffffff",
                    "crackle"
                )
            );
        }

        for (
            let i = 0;
            i < 5;
            i++
        ) {

            const angle =
                Math.random() *
                Math.PI * 2;

            const speed =
                random(4, 6);

            particles.push(
                new Particle(
                    x,
                    y,
                    Math.cos(angle) *
                        speed,
                    Math.sin(angle) *
                        speed,
                    mainColor,
                    "comet"
                )
            );
        }
    }
}

/* ================================
   PARTICLE
================================ */

class Particle {

    constructor(
        x,
        y,
        vx,
        vy,
        color,
        type
    ) {

        this.x = x;
        this.y = y;

        this.vx = vx;
        this.vy = vy;

        this.color = color;
        this.type = type;

        if (
            type === "core"
        ) {

            this.life =
                random(
                    0.18,
                    0.32
                );

        } else if (
            type === "crackle"
        ) {

            this.life =
                random(
                    0.45,
                    0.75
                );

        } else if (
            type === "comet"
        ) {

            this.life =
                random(
                    0.75,
                    1.05
                );

        } else {

            this.life =
                random(
                    0.8,
                    1.25
                );
        }

        this.maxLife =
            this.life;

        this.size =
            type === "core"
                ? random(1.8, 2.8)
                : type === "comet"
                    ? random(1.2, 2)
                    : random(0.8, 1.5);

        this.trail = [];

        this.drag =
            type === "comet"
                ? 0.989
                : 0.985;

        this.gravity =
            type === "comet"
                ? 0.06
                : 0.045;

        this.phase =
            Math.random() *
            Math.PI * 2;

        this.twinkle =
            Math.random() <
            0.25;
    }

    update() {

        if (
            this.type === "star" ||
            this.type === "comet"
        ) {

            this.trail.push({
                x: this.x,
                y: this.y
            });

            const maxTrail =
                this.type === "comet"
                    ? 7
                    : 4;

            if (
                this.trail.length >
                maxTrail
            ) {

                this.trail.shift();
            }
        }

        this.vx *= this.drag;
        this.vy *= this.drag;

        this.vy += this.gravity;

        this.x += this.vx;
        this.y += this.vy;

        if (
            this.type === "crackle" &&
            Math.random() < 0.05
        ) {

            this.vx +=
                random(
                    -0.45,
                    0.45
                );

            this.vy +=
                random(
                    -0.45,
                    0.45
                );
        }

        this.life -=
            this.type === "core"
                ? 0.06
                : 0.009;
    }

    draw() {

        if (
            this.life <= 0
        ) {
            return;
        }

        let alpha =
            this.life /
            this.maxLife;

        alpha =
            Math.max(
                0,
                Math.min(
                    1,
                    alpha
                )
            );

        alpha *=
            Math.min(
                1,
                this.life * 2.5
            );

        if (
            this.twinkle
        ) {

            const pulse =
                Math.sin(
                    performance.now() *
                        0.018 +
                    this.phase
                );

            if (
                pulse < -0.35
            ) {

                alpha *= 0.35;
            }
        }

        if (
            this.trail.length > 1 &&
            (
                this.type === "star" ||
                this.type === "comet"
            )
        ) {

            ctx.beginPath();

            ctx.moveTo(
                this.trail[0].x,
                this.trail[0].y
            );

            for (
                let i = 1;
                i < this.trail.length;
                i++
            ) {

                ctx.lineTo(
                    this.trail[i].x,
                    this.trail[i].y
                );
            }

            ctx.strokeStyle =
                rgba(
                    this.color,
                    alpha * 0.42
                );

            ctx.lineWidth =
                this.type === "comet"
                    ? 1.3
                    : 0.8;

            ctx.stroke();
        }

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            rgba(
                this.color,
                alpha
            );

        ctx.fill();
    }
}

/* ================================
   FLASHES
================================ */

function updateFlashes() {

    for (
        let i =
            flashes.length - 1;
        i >= 0;
        i--
    ) {

        const flash =
            flashes[i];

        flash.radius +=
            (
                flash.maxRadius -
                flash.radius
            ) * 0.42;

        flash.life -= 0.17;

        if (
            flash.life <= 0
        ) {

            flashes.splice(
                i,
                1
            );
        }
    }
}

function drawFlashes() {

    for (
        const flash of flashes
    ) {

        const gradient =
            ctx.createRadialGradient(
                flash.x,
                flash.y,
                0,
                flash.x,
                flash.y,
                flash.radius
            );

        gradient.addColorStop(
            0,
            `rgba(
                255,
                255,
                255,
                ${flash.life}
            )`
        );

        gradient.addColorStop(
            0.07,
            `rgba(
                255,
                255,
                255,
                ${flash.life * 0.95}
            )`
        );

        gradient.addColorStop(
            0.2,
            `rgba(
                255,
                255,
                255,
                ${flash.life * 0.5}
            )`
        );

        gradient.addColorStop(
            0.5,
            `rgba(
                255,
                255,
                255,
                ${flash.life * 0.12}
            )`
        );

        gradient.addColorStop(
            1,
            "rgba(255,255,255,0)"
        );

        ctx.fillStyle =
            gradient;

        ctx.beginPath();

        ctx.arc(
            flash.x,
            flash.y,
            flash.radius,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }
}

/* ================================
   RINGS
================================ */

function updateRings() {

    for (
        let i =
            rings.length - 1;
        i >= 0;
        i--
    ) {

        const ring =
            rings[i];

        ring.radius += 5;

        ring.life -= 0.035;

        if (
            ring.life <= 0
        ) {

            rings.splice(
                i,
                1
            );
        }
    }
}

function drawRings() {

    for (
        const ring of rings
    ) {

        ctx.beginPath();

        ctx.arc(
            ring.x,
            ring.y,
            ring.radius,
            0,
            Math.PI * 2
        );

        ctx.strokeStyle =
            rgba(
                ring.color,
                ring.life * 0.2
            );

        ctx.lineWidth = 1;

        ctx.stroke();
    }
}

/* ================================
   ROCKET LAUNCHING
================================ */

function launchShowRocket(
    event
) {

    if (
        rockets.length >=
        MAX_ROCKETS
    ) {
        return;
    }

    const targetX =
        random(
            width * 0.08,
            width * 0.92
        );

    const targetY =
        random(
            height * 0.12,
            height * 0.48
        );

    rockets.push(
        new Rocket(
            targetX,
            targetY,
            event.colors
        )
    );
}

function triggerShowEvent(
    event
) {

    const count =
        Math.min(
            event.rockets,
            MAX_ROCKETS
        );

    for (
        let i = 0;
        i < count;
        i++
    ) {

        setTimeout(
            () => {

                if (
                    !showActive ||
                    showFinished
                ) {
                    return;
                }

                launchShowRocket(
                    event
                );

            },
            i * 85
        );
    }
}

/* ================================
   SHOW EVENT PROCESSING
================================ */

function processShowEvents() {

    if (
        !showActive
    ) {
        return;
    }

    const elapsedSeconds =
        showElapsed / 1000;

    while (
        nextShowEvent <
            showEvents.length &&
        showEvents[
            nextShowEvent
        ].time <=
            elapsedSeconds
    ) {

        triggerShowEvent(
            showEvents[
                nextShowEvent
            ]
        );

        nextShowEvent++;
    }
}

function createLetterTargets(
    text
) {

    text =
        text
            .toUpperCase()
            .replace(
                /[^A-Z ]/g,
                ""
            );

    const letters =
        [];

    for (
        const character of text
    ) {

        if (
            character === " "
        ) {

            letters.push(null);

            continue;
        }

        if (
            letterFont[
                character
            ]
        ) {

            letters.push(
                letterFont[
                    character
                ]
            );
        }
    }

    if (
        letters.length === 0
    ) {
        return [];
    }

    const gap = 1;

    let totalColumns = 0;

    for (
        const letter of letters
    ) {

        if (
            letter === null
        ) {

            totalColumns += 3;

        } else {

            totalColumns +=
                letter[0].length +
                gap;
        }
    }

    /*
        Keep the text comfortably
        inside the screen.
    */
    const maxWidth =
        width * 0.86;

    let cell =
        Math.min(
            18,
            maxWidth /
                totalColumns
        );

    cell =
        Math.max(
            5,
            cell
        );

    const totalWidth =
        totalColumns * cell;

    const startX =
        (
            width -
            totalWidth
        ) / 2;

    const startY =
        height * 0.34;

    const targets = [];

    let column = 0;

    for (
        const letter of letters
    ) {

        if (
            letter === null
        ) {

            column += 3;

            continue;
        }

        for (
            let row = 0;
            row < letter.length;
            row++
        ) {

            for (
                let col = 0;
                col <
                    letter[row].length;
                col++
            ) {

                if (
                    letter[row][col] ===
                    "1"
                ) {

                    targets.push({
                        x:
                            startX +
                            (
                                column +
                                col
                            ) * cell +
                            cell / 2,

                        y:
                            startY +
                            row * cell +
                            cell / 2
                    });
                }
            }
        }

        column +=
            letter[0].length +
            gap;
    }

    return targets;
}

function launchLetterFireworks(
    text
) {

    const targets =
        createLetterTargets(
            text
        );

    /*
        One rocket per visible
        letter pixel, limited for
        performance.
    */
    const maxLetterRockets =
        Math.min(
            targets.length,
            150
        );

    for (
        let i = 0;
        i < maxLetterRockets;
        i++
    ) {

        const target =
            targets[i];

        const color =
            choose(colors);

        const rocket =
            new Rocket(
                target.x,
                target.y,
                [color]
            );

        rockets.push(
            rocket
        );
    }
}

/* ================================
   FINALE
================================ */

const finaleMessages = [
    "HAPPY",
    "BIRTHDAY"
];

let finaleIndex = 0;
let finaleRunning = false;

function showFinaleMessage(
    text
) {

    finaleText.textContent =
        text;

    finaleText.classList.remove(
        "visible"
    );

    /*
        Allow the browser to process
        the hidden state before
        animating it in.
    */
    requestAnimationFrame(
        () => {

            requestAnimationFrame(
                () => {

                    finaleText.classList.add(
                        "visible"
                    );
                }
            );
        }
    );

    launchLetterFireworks(
        text
    );

    /*
        Add extra fireworks around
        the letter formation.
    */
    for (
        let i = 0;
        i < 10;
        i++
    ) {

        const event = {
            colors: [
                choose(colors)
            ],
            rockets: 1
        };

        setTimeout(
            () => {

                if (
                    finaleRunning
                ) {

                    launchShowRocket(
                        event
                    );
                }

            },
            i * 180
        );
    }
}

function hideFinaleMessage() {

    finaleText.classList.remove(
        "visible"
    );
}

function runBirthdayFinale() {

    if (
        finaleRunning
    ) {
        return;
    }

    finaleRunning = true;

    showInfo.classList.remove(
        "visible"
    );

    /*
        HAPPY
    */
    showFinaleMessage(
        "HAPPY"
    );

    setTimeout(
        () => {

            hideFinaleMessage();

            setTimeout(
                () => {

                    /*
                        BIRTHDAY
                    */
                    showFinaleMessage(
                        "BIRTHDAY"
                    );

                },
                600
            );

        },
        4000
    );

    setTimeout(
        () => {

            hideFinaleMessage();

            setTimeout(
                () => {

                    /*
                        ENTERED NAME
                    */
                    showFinaleMessage(
                        birthdayName
                    );

                },
                600
            );

        },
        8500
    );

    /*
        Grand ending.
    */
    setTimeout(
        () => {

            for (
                let i = 0;
                i < 14;
                i++
            ) {

                setTimeout(
                    () => {

                        launchLetterFireworks(
                            birthdayName
                        );

                    },
                    i * 150
                );
            }

        },
        12000
    );

    /*
        End the finale after
        the final name display.
    */
    setTimeout(
        () => {

            hideFinaleMessage();

            setTimeout(
                () => {

                    finaleRunning =
                        false;

                    showFinished =
                        true;

                    showActive =
                        false;

                    userFireworksEnabled =
                        true;

                    showInfo.textContent =
                        "Show finished";

                    showInfo.classList.add(
                        "visible"
                    );

                },
                700
            );

        },
        17000
    );
}

/* ================================
   START SHOW
================================ */

function startFireworkShow() {

    showActive = true;

    showFinished = false;

    userFireworksEnabled =
        false;

    showStartTime =
        performance.now();

    showElapsed = 0;

    nextShowEvent = 0;

    pointerDown = false;

    showInfo.textContent =
        "Birthday Firework Show";

    showInfo.classList.add(
        "visible"
    );

    processShowEvents();
}

/* ================================
   SHOW UPDATE
================================ */

function updateShow(
    time
) {

    if (
        !showActive
    ) {
        return;
    }

    showElapsed =
        time -
        showStartTime;

    /*
        The regular show is exactly
        8 minutes.

        The visual name finale begins
        at the end of those 8 minutes.
    */
    if (
        showElapsed >=
        SHOW_DURATION
    ) {

        showActive = false;

        pointerDown = false;

        /*
            Keep manual fireworks
            disabled during the finale.
        */
        userFireworksEnabled =
            false;

        runBirthdayFinale();

        return;
    }

    processShowEvents();
}

/* ================================
   POINTER
================================ */

function updatePointer(
    event
) {

    const rect =
        canvas.getBoundingClientRect();

    pointerX =
        event.clientX -
        rect.left;

    pointerY =
        event.clientY -
        rect.top;
}

/* ================================
   USER FIREWORKS
================================ */

canvas.addEventListener(
    "pointerdown",
    event => {

        /*
            This is the important
            show lock.

            During the birthday show
            and finale, users cannot
            create their own fireworks.
        */
        if (
            !userFireworksEnabled ||
            showActive ||
            finaleRunning
        ) {

            event.preventDefault();

            return;
        }

        pointerDown = true;

        updatePointer(event);

        canvas.setPointerCapture(
            event.pointerId
        );

        launch();

        launchTimer =
            LAUNCH_INTERVAL;
    }
);

canvas.addEventListener(
    "pointermove",
    event => {

        updatePointer(event);
    }
);

canvas.addEventListener(
    "pointerup",
    () => {

        pointerDown = false;
    }
);

canvas.addEventListener(
    "pointercancel",
    () => {

        pointerDown = false;
    }
);

function launch() {

    if (
        !userFireworksEnabled ||
        showActive ||
        finaleRunning
    ) {
        return;
    }

    if (
        rockets.length >=
        MAX_ROCKETS
    ) {
        return;
    }

    rockets.push(
        new Rocket(
            pointerX,
            pointerY
        )
    );
}

function updateLaunching() {

    if (
        !pointerDown ||
        !userFireworksEnabled ||
        showActive ||
        finaleRunning
    ) {

        return;
    }

    launchTimer--;

    if (
        launchTimer <= 0
    ) {

        launch();

        launchTimer =
            LAUNCH_INTERVAL;
    }
}

/* ================================
   UPDATE
================================ */

function update(
    time
) {

    updateShow(time);

    updateLaunching();

    /*
        Rockets.
    */
    for (
        let i =
            rockets.length - 1;
        i >= 0;
        i--
    ) {

        const rocket =
            rockets[i];

        rocket.update();

        if (
            !rocket.alive
        ) {

            rockets.splice(
                i,
                1
            );
        }
    }

    /*
        Particles.
    */
    for (
        let i =
            particles.length - 1;
        i >= 0;
        i--
    ) {

        const particle =
            particles[i];

        particle.update();

        if (
            particle.life <= 0 ||
            particle.y >
                height + 100
        ) {

            particles.splice(
                i,
                1
            );
        }
    }

    updateFlashes();
    updateRings();

    /*
        Safety limit.
    */
    if (
        particles.length >
        MAX_PARTICLES
    ) {

        particles.splice(
            0,
            particles.length -
            MAX_PARTICLES
        );
    }
}

/* ================================
   DRAW
================================ */

function draw() {

    ctx.fillStyle =
        "#000";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );

    ctx.globalCompositeOperation =
        "lighter";

    drawFlashes();

    for (
        const rocket of rockets
    ) {

        rocket.draw();
    }

    for (
        const particle of particles
    ) {

        particle.draw();
    }

    drawRings();

    ctx.globalCompositeOperation =
        "source-over";
}

/* ================================
   MAIN LOOP
================================ */

let lastTime =
    performance.now();

function loop(
    time
) {

    const delta =
        Math.min(
            2,
            (
                time -
                lastTime
            ) / 16.67
        );

    lastTime =
        time;

    const steps =
        Math.max(
            1,
            Math.ceil(delta)
        );

    for (
        let i = 0;
        i < steps;
        i++
    ) {

        update(time);
    }

    draw();

    requestAnimationFrame(
        loop
    );
}

requestAnimationFrame(
    loop
);

/* ================================
   START BUTTON
================================ */

startButton.addEventListener(
    "click",
    () => {

        const enteredName =
            nameInput.value
                .trim();

        if (
            !enteredName
        ) {

            nameInput.focus();

            return;
        }

        /*
            Limit the name to letters
            and spaces so it can safely
            become a fireworks word.
        */
        birthdayName =
            enteredName
                .toUpperCase()
                .replace(
                    /[^A-Z ]/g,
                    ""
                )
                .trim();

        if (
            !birthdayName
        ) {

            nameInput.focus();

            return;
        }

        nameScreen.style.display =
            "none";

        startFireworkShow();
    }
);

/*
    Enter key also starts the show.
*/
nameInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            startButton.click();
        }
    }
);
