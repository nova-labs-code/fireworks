<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no,
        viewport-fit=cover"
    >

    <title>Birthday Fireworks</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            touch-action: none;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            position: relative;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #000;
        }

        #nameScreen {
            position: fixed;
            inset: 0;
            z-index: 20;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;

            background:
                radial-gradient(
                    circle at 50% 45%,
                    #191919 0%,
                    #090909 42%,
                    #000 100%
                );
        }

        #nameBox {
            width: min(460px, 100%);
            text-align: center;
        }

        #nameBox h1 {
            margin: 0 0 10px;

            color: #fff;

            font-size:
                clamp(
                    36px,
                    10vw,
                    64px
                );

            line-height: 1;
            font-weight: 900;

            letter-spacing: -2px;
        }

        #nameBox p {
            margin: 0 0 26px;

            color: #a9a9a9;

            font-size: 17px;
            line-height: 1.5;
        }

        #nameInput {
            display: block;

            width: 100%;
            height: 58px;

            border: 1px solid #333;
            border-radius: 15px;

            outline: none;

            background: #101010;
            color: #fff;

            padding: 0 18px;

            font-size: 18px;
            text-align: center;

            appearance: none;
        }

        #nameInput::placeholder {
            color: #666;
        }

        #nameInput:focus {
            border-color: #777;
        }

        #startButton {
            display: block;

            width: 100%;
            height: 58px;

            margin-top: 12px;

            border: 0;
            border-radius: 15px;

            background: #fff;
            color: #000;

            font-size: 18px;
            font-weight: 800;

            cursor: pointer;

            appearance: none;

            transition:
                transform 0.12s ease,
                opacity 0.12s ease;
        }

        #startButton:active {
            transform: scale(0.97);
        }

        #showInfo {
            position: fixed;
            z-index: 10;

            top: max(16px, env(safe-area-inset-top));
            left: 50%;

            transform: translateX(-50%);

            pointer-events: none;

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.72
                );

            font-size: 13px;
            font-weight: 600;

            letter-spacing: 0.4px;

            white-space: nowrap;

            opacity: 0;

            transition:
                opacity 0.4s ease;
        }

        #showInfo.visible {
            opacity: 1;
        }

        #finaleText {
            position: fixed;
            z-index: 8;

            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 18px;

            pointer-events: none;

            color: #fff;

            font-size:
                clamp(
                    38px,
                    12vw,
                    150px
                );

            line-height: 1;

            font-weight: 1000;

            letter-spacing:
                clamp(
                    2px,
                    1vw,
                    14px
                );

            text-align: center;

            white-space: nowrap;

            overflow: hidden;

            text-shadow:
                0 0 8px #fff,
                0 0 20px #fff,
                0 0 45px #fff,
                0 0 80px #fff;

            opacity: 0;

            transform:
                scale(0.65);

            transition:
                opacity 0.45s ease,
                transform 0.7s
                cubic-bezier(
                    0.16,
                    1,
                    0.3,
                    1
                );
        }

        #finaleText.visible {
            opacity: 1;

            transform:
                scale(1);
        }
    </style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="nameScreen">

    <div id="nameBox">

        <h1>Birthday Fireworks</h1>

        <p>
            Enter the birthday person's name
            and enjoy the show.
        </p>

        <input
            id="nameInput"
            type="text"
            maxlength="20"
            autocomplete="off"
            autocapitalize="words"
            spellcheck="false"
            placeholder="Enter a name"
        >

        <button id="startButton">
            Start Show
        </button>

    </div>

</div>

<div id="showInfo">
    Birthday Firework Show
</div>

<div id="finaleText"></div>

<script>
/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext(
        "2d",
        {
            alpha: false
        }
    );

let width = 0;
let height = 0;
let dpr = 1;


/* =========================================================
   UI
========================================================= */

const nameScreen =
    document.getElementById(
        "nameScreen"
    );

const nameInput =
    document.getElementById(
        "nameInput"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const showInfo =
    document.getElementById(
        "showInfo"
    );

const finaleText =
    document.getElementById(
        "finaleText"
    );


/* =========================================================
   SETTINGS
========================================================= */

/*
    5-minute main show.

    The finale begins immediately after
    the 5-minute show reaches its end.
*/
const SHOW_DURATION =
    5 * 60 * 1000;

/*
    Hard limits to keep performance
    reasonable on phones/tablets.
*/
const MAX_ROCKETS = 22;
const MAX_PARTICLES = 2600;


/* =========================================================
   STATE
========================================================= */

let showActive = false;
let showFinished = false;

let showStartTime = 0;
let showElapsed = 0;

let nextShowEvent = 0;

let birthdayName = "";

let finaleRunning = false;


/*
    This stays FALSE for the entire
    birthday show and finale.

    The audience cannot manually
    launch fireworks while the show
    is running.
*/
let userFireworksEnabled = false;


/* =========================================================
   POINTER
========================================================= */

let pointerDown = false;
let pointerX = 0;
let pointerY = 0;


/* =========================================================
   ARRAYS
========================================================= */

const rockets = [];
const particles = [];
const flashes = [];
const rings = [];


/* =========================================================
   COLORS
========================================================= */

const colors = [
    "#ff1744",
    "#ff3d71",
    "#ff4081",
    "#ff00aa",
    "#d500f9",
    "#9c27b0",
    "#7c4dff",
    "#536dfe",
    "#2979ff",
    "#00b0ff",
    "#00e5ff",
    "#00e676",
    "#76ff03",
    "#c6ff00",
    "#fff176",
    "#ffc107",
    "#ff9800",
    "#ff7043",
    "#ff3d00",
    "#ffffff"
];


/* =========================================================
   RGB CACHE
========================================================= */

const rgb = {};

for (const color of colors) {

    const hex =
        color.substring(1);

    rgb[color] = {

        r: parseInt(
            hex.substring(0, 2),
            16
        ),

        g: parseInt(
            hex.substring(2, 4),
            16
        ),

        b: parseInt(
            hex.substring(4, 6),
            16
        )
    };
}


function rgba(
    color,
    alpha
) {

    const c =
        rgb[color];

    if (!c) {
        return (
            "rgba(255,255,255," +
            alpha +
            ")"
        );
    }

    return (
        "rgba(" +
        c.r +
        "," +
        c.g +
        "," +
        c.b +
        "," +
        alpha +
        ")"
    );
}


/* =========================================================
   RESIZE
========================================================= */

function resize() {

    dpr =
        Math.min(
            window.devicePixelRatio || 1,
            1.5
        );

    width =
        window.innerWidth;

    height =
        window.innerHeight;

    canvas.width =
        Math.floor(
            width * dpr
        );

    canvas.height =
        Math.floor(
            height * dpr
        );

    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

window.addEventListener(
    "resize",
    resize
);

resize();


/* =========================================================
   HELPERS
========================================================= */

function random(
    min,
    max
) {

    return (
        Math.random() *
        (max - min) +
        min
    );
}


function choose(
    array
) {

    return array[
        Math.floor(
            Math.random() *
            array.length
        )
    ];
}


function differentColor(
    color
) {

    let result;

    do {
        result =
            choose(colors);
    }
    while (
        result === color
    );

    return result;
}


/* =========================================================
   TARGETS
========================================================= */

function randomTarget() {

    return {

        x:
            random(
                width * 0.06,
                width * 0.94
            ),

        y:
            random(
                height * 0.10,
                height * 0.60
            )
    };
}


/* =========================================================
   ROCKET
========================================================= */

class Rocket {

    constructor(
        targetX,
        targetY,
        showColors = null,
        options = {}
    ) {

        this.x =
            random(
                width * 0.05,
                width * 0.95
            );

        this.y =
            height + 20;

        this.targetX =
            targetX;

        this.targetY =
            Math.max(
                55,
                targetY
            );

        this.vx =
            (
                targetX -
                this.x
            ) *
            (
                options.speedFactor ||
                0.0052
            );

        this.vy =
            options.initialVelocity ||
            random(
                -11.2,
                -8.8
            );

        this.showColors =
            showColors;

        this.color =
            showColors
                ? choose(showColors)
                : choose(colors);

        this.type =
            options.type ||
            "normal";

        this.targetExact =
            options.targetExact ||
            false;

        this.trail = [];

        this.alive = true;
    }


    update() {

        this.trail.push({
            x: this.x,
            y: this.y
        });

        if (
            this.trail.length > 10
        ) {

            this.trail.shift();
        }

        this.vy +=
            0.034;

        this.x +=
            this.vx;

        this.y +=
            this.vy;

        const reached =
            this.targetExact
                ? Math.hypot(
                    this.x -
                        this.targetX,
                    this.y -
                        this.targetY
                ) < 8
                : (
                    this.y <=
                        this.targetY ||
                    this.vy >=
                        -0.65
                );

        if (reached) {

            this.explode();

            this.alive =
                false;
        }
    }


    draw() {

        if (
            this.trail.length > 1
        ) {

            ctx.beginPath();

            ctx.moveTo(
                this.trail[0].x,
                this.trail[0].y
            );

            for (
                let i = 1;
                i < this.trail.length;
                i++
            ) {

                ctx.lineTo(
                    this.trail[i].x,
                    this.trail[i].y
                );
            }

            ctx.strokeStyle =
                rgba(
                    this.color,
                    0.55
                );

            ctx.lineWidth =
                1.4;

            ctx.stroke();
        }

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            2.1,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#ffffff";

        ctx.fill();
    }


    explode() {

        const x =
            this.x;

        const y =
            this.y;

        const mainColor =
            this.color;

        let secondColor;

        if (
            this.showColors &&
            this.showColors.length > 1
        ) {

            const available =
                this.showColors.filter(
                    c =>
                        c !==
                        mainColor
                );

            secondColor =
                choose(
                    available.length
                        ? available
                        : this.showColors
                );

        } else {

            secondColor =
                differentColor(
                    mainColor
                );
        }


        /* FLASH */

        flashes.push({

            x: x,
            y: y,

            radius: 4,

            maxRadius:
                random(
                    85,
                    145
                ),

            life: 1
        });


        /* RING */

        rings.push({

            x: x,
            y: y,

            radius: 3,

            life: 1,

            color:
                mainColor
        });


        /* MAIN BURST */

        const mainCount =
            this.type === "grand"
                ? 105
                : this.type === "large"
                    ? 88
                    : 70;

        for (
            let i = 0;
            i < mainCount;
            i++
        ) {

            const angle =
                (
                    Math.PI * 2
                ) *
                (
                    i /
                    mainCount
                ) +
                random(
                    -0.035,
                    0.035
                );

            const speed =
                random(
                    2.5,
                    this.type === "grand"
                        ? 6.5
                        : 5.7
                );

            particles.push(
                new Particle(
                    x,
                    y,

                    Math.cos(angle) *
                        speed,

                    Math.sin(angle) *
                        speed,

                    mainColor,

                    "star"
                )
            );
        }


        /* SECONDARY BURST */

        const secondaryCount =
            this.type === "grand"
                ? 35
                : 24;

        for (
            let i = 0;
            i < secondaryCount;
            i++
        ) {

            const angle =
                Math.random() *
                Math.PI * 2;

            const speed =
                random(
                    1.5,
                    4.5
                );

            particles.push(
                new Particle(
                    x,
                    y,

                    Math.cos(angle) *
                        speed,

                    Math.sin(angle) *
                        speed,

                    secondColor,

                    "star"
                )
            );
        }


        /* WHITE CORE */

        for (
            let i = 0;
            i < 12;
            i++
        ) {

            particles.push(
                new Particle(
                    x,
                    y,

                    random(
                        -2.3,
                        2.3
                    ),

                    random(
                        -2.3,
                        2.3
                    ),

                    "#ffffff",

                    "core"
                )
            );
        }


        /* CRACKLE */

        const crackleCount =
            this.type === "grand"
                ? 24
                : 16;

        for (
            let i = 0;
            i < crackleCount;
            i++
        ) {

            const angle =
                Math.random() *
                Math.PI * 2;

            const speed =
                random(
                    1.6,
                    5
                );

            particles.push(
                new Particle(
                    x,
                    y,

                    Math.cos(angle) *
                        speed,

                    Math.sin(angle) *
                        speed,

                    "#ffffff",

                    "crackle"
                )
            );
        }


        /* COMETS */

        const cometCount =
            this.type === "grand"
                ? 9
                : 5;

        for (
            let i = 0;
            i < cometCount;
            i++
        ) {

            const angle =
                Math.random() *
                Math.PI * 2;

            const speed =
                random(
                    4,
                    6.5
                );

            particles.push(
                new Particle(
                    x,
                    y,

                    Math.cos(angle) *
                        speed,

                    Math.sin(angle) *
                        speed,

                    mainColor,

                    "comet"
                )
            );
        }
    }
}


/* =========================================================
   PARTICLE
========================================================= */

class Particle {

    constructor(
        x,
        y,
        vx,
        vy,
        color,
        type
    ) {

        this.x = x;
        this.y = y;

        this.vx = vx;
        this.vy = vy;

        this.color = color;
        this.type = type;

        if (
            type === "core"
        ) {

            this.life =
                random(
                    0.20,
                    0.34
                );

        } else if (
            type === "crackle"
        ) {

            this.life =
                random(
                    0.48,
                    0.80
                );

        } else if (
            type === "comet"
        ) {

            this.life =
                random(
                    0.85,
                    1.15
                );

        } else {

            this.life =
                random(
                    0.90,
                    1.35
                );
        }

        this.maxLife =
            this.life;

        this.size =
            type === "core"
                ? random(
                    1.8,
                    3
                )
                : type === "comet"
                    ? random(
                        1.3,
                        2.2
                    )
                    : random(
                        0.85,
                        1.65
                    );

        this.trail = [];

        this.drag =
            type === "comet"
                ? 0.989
                : 0.985;

        this.gravity =
            type === "comet"
                ? 0.06
                : 0.045;

        this.phase =
            Math.random() *
            Math.PI *
            2;

        this.twinkle =
            Math.random() <
            0.28;
    }


    update() {

        if (
            this.type === "star" ||
            this.type === "comet"
        ) {

            this.trail.push({
                x: this.x,
                y: this.y
            });

            const maxTrail =
                this.type === "comet"
                    ? 8
                    : 5;

            if (
                this.trail.length >
                maxTrail
            ) {

                this.trail.shift();
            }
        }

        this.vx *=
            this.drag;

        this.vy *=
            this.drag;

        this.vy +=
            this.gravity;

        this.x +=
            this.vx;

        this.y +=
            this.vy;

        if (
            this.type ===
                "crackle" &&
            Math.random() <
                0.055
        ) {

            this.vx +=
                random(
                    -0.5,
                    0.5
                );

            this.vy +=
                random(
                    -0.5,
                    0.5
                );
        }

        this.life -=
            this.type === "core"
                ? 0.065
                : 0.0085;
    }


    draw() {

        if (
            this.life <= 0
        ) {

            return;
        }

        let alpha =
            this.life /
            this.maxLife;

        alpha =
            Math.max(
                0,
                Math.min(
                    1,
                    alpha
                )
            );

        alpha *=
            Math.min(
                1,
                this.life *
                2.4
            );

        if (
            this.twinkle
        ) {

            const pulse =
                Math.sin(
                    performance.now() *
                        0.02 +
                    this.phase
                );

            if (
                pulse < -0.35
            ) {

                alpha *=
                    0.3;
            }
        }


        if (
            this.trail.length > 1 &&
            (
                this.type === "star" ||
                this.type === "comet"
            )
        ) {

            ctx.beginPath();

            ctx.moveTo(
                this.trail[0].x,
                this.trail[0].y
            );

            for (
                let i = 1;
                i < this.trail.length;
                i++
            ) {

                ctx.lineTo(
                    this.trail[i].x,
                    this.trail[i].y
                );
            }

            ctx.strokeStyle =
                rgba(
                    this.color,
                    alpha *
                    0.42
                );

            ctx.lineWidth =
                this.type === "comet"
                    ? 1.4
                    : 0.85;

            ctx.stroke();
        }


        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            rgba(
                this.color,
                alpha
            );

        ctx.fill();
    }
}


/* =========================================================
   FLASHES
========================================================= */

function updateFlashes() {

    for (
        let i =
            flashes.length - 1;
        i >= 0;
        i--
    ) {

        const flash =
            flashes[i];

        flash.radius +=
            (
                flash.maxRadius -
                flash.radius
            ) *
            0.38;

        flash.life -=
            0.15;

        if (
            flash.life <= 0
        ) {

            flashes.splice(
                i,
                1
            );
        }
    }
}


function drawFlashes() {

    for (
        const flash of flashes
    ) {

        const gradient =
            ctx.createRadialGradient(
                flash.x,
                flash.y,
                0,
                flash.x,
                flash.y,
                flash.radius
            );

        gradient.addColorStop(
            0,
            `rgba(
                255,
                255,
                255,
                ${flash.life}
            )`
        );

        gradient.addColorStop(
            0.08,
            `rgba(
                255,
                255,
                255,
                ${flash.life * 0.85}
            )`
        );

        gradient.addColorStop(
            0.25,
            `rgba(
                255,
                255,
                255,
                ${flash.life * 0.4}
            )`
        );

        gradient.addColorStop(
            0.55,
            `rgba(
                255,
                255,
                255,
                ${flash.life * 0.08}
            )`
        );

        gradient.addColorStop(
            1,
            "rgba(255,255,255,0)"
        );

        ctx.fillStyle =
            gradient;

        ctx.beginPath();

        ctx.arc(
            flash.x,
            flash.y,
            flash.radius,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }
}


/* =========================================================
   RINGS
========================================================= */

function updateRings() {

    for (
        let i =
            rings.length - 1;
        i >= 0;
        i--
    ) {

        const ring =
            rings[i];

        ring.radius +=
            5.5;

        ring.life -=
            0.032;

        if (
            ring.life <= 0
        ) {

            rings.splice(
                i,
                1
            );
        }
    }
}


function drawRings() {

    for (
        const ring of rings
    ) {

        ctx.beginPath();

        ctx.arc(
            ring.x,
            ring.y,
            ring.radius,
            0,
            Math.PI * 2
        );

        ctx.strokeStyle =
            rgba(
                ring.color,
                ring.life *
                0.22
            );

        ctx.lineWidth =
            1.1;

        ctx.stroke();
    }
}


/* =========================================================
   SPECIAL SHOW PATTERNS
========================================================= */

function launchPattern(
    event
) {

    const count =
        Math.min(
            event.rockets,
            MAX_ROCKETS
        );

    for (
        let i = 0;
        i < count;
        i++
    ) {

        setTimeout(
            () => {

                if (
                    !showActive
                ) {

                    return;
                }

                let target =
                    randomTarget();

                let options = {};

                if (
                    event.pattern ===
                    "fan"
                ) {

                    const center =
                        width / 2;

                    const spread =
                        width * 0.42;

                    const position =
                        count <= 1
                            ? 0
                            : (
                                i /
                                (
                                    count -
                                    1
                                )
                            ) * 2 - 1;

                    target.x =
                        center +
                        position *
                        spread;

                    target.y =
                        random(
                            height *
                                0.20,
                            height *
                                0.48
                        );
                }

                if (
                    event.pattern ===
                    "ring"
                ) {

                    const center =
                        width / 2;

                    const radius =
                        width * 0.32;

                    const angle =
                        (
                            i /
                            count
                        ) *
                        Math.PI *
                        2;

                    target.x =
                        center +
                        Math.cos(angle) *
                        radius;

                    target.y =
                        height *
                            0.34 +
                        Math.sin(angle) *
                        radius *
                        0.45;
                }

                if (
                    event.pattern ===
                    "double"
                ) {

                    target.y =
                        i % 2 === 0
                            ? height *
                                0.27
                            : height *
                                0.46;
                }

                if (
                    event.pattern ===
                    "grand"
                ) {

                    options.type =
                        "grand";
                }

                if (
                    event.pattern ===
                    "large"
                ) {

                    options.type =
                        "large";
                }

                rockets.push(
                    new Rocket(
                        target.x,
                        target.y,
                        event.colors,
                        options
                    )
                );

            },
            i * (
                event.launchSpacing ||
                75
            )
        );
    }
}

========================================================= */

function processShowEvents() {

    if (
        !showActive

        return;

    const seconds =
        showElapsed / 1000;

    while (
        nextShowEvent <
            showEvents.length &&
        showEvents[
            nextShowEvent
        ].time <=
            seconds
    ) {

        launchPattern(
            showEvents[
                nextShowEvent
            ]
        );

        nextShowEvent++;
    }
}

/* =========================================================
   CREATE LETTER TARGETS
========================================================= */

function createLetterTargets(
    text
) {

    text =
        text
            .toUpperCase()
            .replace(
                /[^A-Z ]/g,
                ""
            )
            .trim();

    if (
        !text
    ) {

        return [];
    }

    const letters = [];

    for (
        const character of text
    ) {

        if (
            character === " "
        ) {

            letters.push(null);

        } else if (
            letterFont[
                character
            ]
        ) {

            letters.push(
                letterFont[
                    character
                ]
            );
        }
    }

    if (
        !letters.length
    ) {

        return [];
    }


    const gap =
        1;

    let totalColumns =
        0;

    for (
        const letter of letters
    ) {

        if (
            letter === null
        ) {

            totalColumns +=
                3;

        } else {

            totalColumns +=
                letter[0].length +
                gap;
        }
    }


    /*
        Scale the fireworks text
        to the available screen width.
    */

    const maxWidth =
        width *
        0.88;

    const maxCell =
        18;

    let cell =
        Math.min(
            maxCell,
            maxWidth /
                totalColumns
        );

    cell =
        Math.max(
            4,
            cell
        );


    const totalWidth =
        totalColumns *
        cell;

    const startX =
        (
            width -
            totalWidth
        ) / 2;

    const startY =
        height *
        0.32;


    const targets = [];

    let column = 0;


    for (
        const letter of letters
    ) {

        if (
            letter === null
        ) {

            column +=
                3;

            continue;
        }


        for (
            let row = 0;
            row < letter.length;
            row++
        ) {

            for (
                let col = 0;
                col <
                    letter[row].length;
                col++
            ) {

                if (
                    letter[row][col] ===
                    "1"
                ) {

                    targets.push({

                        x:
                            startX +
                            (
                                column +
                                col
                            ) *
                            cell +
                            cell / 2,

                        y:
                            startY +
                            row *
                            cell +
                            cell / 2
                    });
                }
            }
        }


        column +=
            letter[0].length +
            gap;
    }

    return targets;
}


/* =========================================================
   LETTER FIREWORK
========================================================= */

function launchLetterRocket(
    target,
    color,
    delay
) {

    setTimeout(
        () => {

            if (
                !finaleRunning
            ) {

                return;
            }

            rockets.push(
                new Rocket(
                    target.x,
                    target.y,
                    [color],
                    {
                        targetExact:
                            true,
                        speedFactor:
                            0.006
                    }
                )
            );

        },
        delay
    );
}


/* =========================================================
   LETTER SHOW
========================================================= */

function launchLetterFireworks(
    text
) {

    const targets =
        createLetterTargets(
            text
        );

    if (
        !targets.length
    ) {

        return;
    }


    /*
        Every visible pixel gets a rocket.

        The rockets are staggered so the
        letters visibly build themselves.
    */

    const maxTargets =
        Math.min(
            targets.length,
            145
        );


    for (
        let i = 0;
        i < maxTargets;
        i++
    ) {

        const target =
            targets[i];

        const color =
            choose([
                "#ff1744",
                "#ff4081",
                "#ff00aa",
                "#d500f9",
                "#7c4dff",
                "#2979ff",
                "#00e5ff",
                "#00e676",
                "#76ff03",
                "#ffc107",
                "#fff176",
                "#ffffff"
            ]);

        launchLetterRocket(
            target,
            color,
            i * 22
        );
    }
}


/* =========================================================
   FINALE EXTRA BURSTS
========================================================= */

function finaleBurst(
    count
) {

    for (
        let i = 0;
        i < count;
        i++
    ) {

        setTimeout(
            () => {

                if (
                    !finaleRunning
                ) {

                    return;
                }

                const target =
                    randomTarget();

                rockets.push(
                    new Rocket(
                        target.x,
                        target.y,
                        [
                            choose(colors)
                        ],
                        {
                            type:
                                "large"
                        }
                    )
                );

            },
            i * 125
        );
    }
}


/* =========================================================
   FINALE TEXT
========================================================= */

function setFinaleMessage(
    text
) {

    finaleText.classList.remove(
        "visible"
    );

    setTimeout(
        () => {

            finaleText.textContent =
                text;

            requestAnimationFrame(
                () => {

                    finaleText.classList.add(
                        "visible"
                    );
                }
            );

            launchLetterFireworks(
                text
            );

        },
        80
    );
}


function hideFinaleMessage() {

    finaleText.classList.remove(
        "visible"
    );
}

function runBirthdayFinale() {

    if (

    ) {

    finaleRunning =

    userFireworksEnabled =

    showInfo.classList.remove(

function updateShow(
    time

    if (
        !showActive
    ) {

        return;
    }

    showElapsed =
        time -
        showStartTime;


    /*
        Keep the show active until
        the exact 5-minute mark.
    */

    if (
        showElapsed >=
        SHOW_DURATION
    ) {

        showActive =
            false;

        pointerDown =
            false;

        userFireworksEnabled =
            false;

        runBirthdayFinale();

        return;
    }


    processShowEvents();
}


/* =========================================================
   POINTER
========================================================= */

function updatePointer(
    event
) {

    const rect =
        canvas.getBoundingClientRect();

    pointerX =
        event.clientX -
        rect.left;

    pointerY =
        event.clientY -
        rect.top;
}


/* =========================================================
   MANUAL FIREWORK INPUT

   Deliberately blocked while the
   birthday show or finale is active.
========================================================= */

canvas.addEventListener(
    "pointerdown",
    event => {

        if (
            !userFireworksEnabled ||
            showActive ||
            finaleRunning
        ) {

            event.preventDefault();

            return;
        }

        updatePointer(
            event
        );
    }
);


canvas.addEventListener(
    "pointermove",
    updatePointer
);


canvas.addEventListener(
    "pointerup",
    () => {

        pointerDown =
            false;
    }
);


canvas.addEventListener(
    "pointercancel",
    () => {

        pointerDown =
            false;
    }
);


/* =========================================================
   UPDATE
========================================================= */

function update(
    time
) {

    updateShow(
        time
    );


    /* ROCKETS */

    for (
        let i =
            rockets.length - 1;
        i >= 0;
        i--
    ) {

        const rocket =
            rockets[i];

        rocket.update();

        if (
            !rocket.alive
        ) {

            rockets.splice(
                i,
                1
            );
        }
    }


    /* PARTICLES */

    for (
        let i =
            particles.length - 1;
        i >= 0;
        i--
    ) {

        const particle =
            particles[i];

        particle.update();

        if (
            particle.life <= 0 ||
            particle.y >
                height + 120 ||
            particle.x <
                -150 ||
            particle.x >
                width + 150
        ) {

            particles.splice(
                i,
                1
            );
        }
    }


    updateFlashes();
    updateRings();


    /*
        Performance safety.

        Remove oldest particles if
        the screen gets extremely busy.
    */

    if (
        particles.length >
        MAX_PARTICLES
    ) {

        particles.splice(
            0,
            particles.length -
                MAX_PARTICLES
        );
    }


    if (
        rockets.length >
        MAX_ROCKETS
    ) {

        rockets.splice(
            0,
            rockets.length -
                MAX_ROCKETS
        );
    }
}


/* =========================================================
   DRAW
========================================================= */

function draw() {

    ctx.fillStyle =
        "#000";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /*
        Additive blending makes the
        fireworks glow naturally.
    */

    ctx.globalCompositeOperation =
        "lighter";


    drawFlashes();


    for (
        const rocket of rockets
    ) {

        rocket.draw();
    }


    for (
        const particle of particles
    ) {

        particle.draw();
    }


    drawRings();


    ctx.globalCompositeOperation =
        "source-over";
}


/* =========================================================
   MAIN LOOP
========================================================= */

let lastTime =
    performance.now();


function loop(
    time
) {

    lastTime =
        time;

    update(
        time
    );

    draw();

    requestAnimationFrame(
        loop
    );
}


requestAnimationFrame(
    loop
);


/* =========================================================
   START BUTTON
========================================================= */

startButton.addEventListener(
    "click",
    () => {

        let enteredName =
            nameInput.value
                .trim()
                .toUpperCase()
                .replace(
                    /[^A-Z ]/g,
                    ""
                )
                .trim();


        if (
            !enteredName
        ) {

            nameInput.focus();

            return;
        }


        birthdayName =
            enteredName;


        nameScreen.style.display =
            "none";


        startFireworkShow();
    }
);


/* =========================================================
   ENTER TO START
========================================================= */

nameInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Enter"
        ) {

            startButton.click();
        }
    }
);
</script>
