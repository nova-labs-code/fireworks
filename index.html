        -webkit-tap-highlight-color: transparent;
    }

    html,

        height: 100%;
        overflow: hidden;
        background: #000008;
        font-family: Arial, Helvetica, sans-serif;
        touch-action: none;
    }

    body {
        position: fixed;
        inset: 0;
    }

    canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
    }

    #ui {
        position: absolute;
        inset: 0;
        z-index: 5;
        pointer-events: none;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    #startScreen {
        pointer-events: auto;
        width: min(92vw, 520px);
        padding: 30px;
        border-radius: 24px;
        background: rgba(8, 8, 20, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow:
            0 20px 70px rgba(0, 0, 0, 0.55),

        text-align: center;
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
    }

        font-size: clamp(30px, 8vw, 48px);
        letter-spacing: 2px;
    }

    #startScreen p {

        color: rgba(255, 255, 255, 0.72);
        line-height: 1.5;
        font-size: 15px;
    }

    #nameInput {
        width: 100%;
        height: 52px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 14px;
        outline: none;
        background: rgba(255, 255, 255, 0.07);
        color: white;
        text-align: center;
        font-size: 18px;
        padding: 0 16px;
        margin-bottom: 14px;
    }

    #nameInput::placeholder {
        color: rgba(255, 255, 255, 0.38);
    }

    #startButton {
        width: 100%;
        height: 54px;
        border: 0;
        border-radius: 14px;
        background: white;
        color: #080812;
        font-weight: 800;
        font-size: 17px;
        cursor: pointer;
    }

    #startButton:active {
        transform: scale(0.98);
    }

    #finaleText {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: clamp(38px, 12vw, 100px);
        font-weight: 900;
        letter-spacing: 5px;
        text-align: center;
        text-shadow:
            0 0 10px white,
            0 0 25px white,
            0 0 50px white;
        opacity: 0;
        transition: opacity 0.25s ease;
        pointer-events: none;
    }

    #finaleText.visible {
        opacity: 1;
    }

    #hint {
        position: absolute;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        color: rgba(255,255,255,0.35);
        font-size: 11px;
        letter-spacing: 1px;
        pointer-events: none;
    }

    @media (prefers-reduced-motion: reduce) {
        #finaleText {
            transition: none;
        }
    }
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="ui">

    <div id="startScreen">
        <h1>Birthday Fireworks</h1>

        <p>
            A continuous 5-minute fireworks show followed by a special
            fireworks finale.
        </p>

        <input
            id="nameInput"
            type="text"
            maxlength="20"
            autocomplete="off"
            autocapitalize="characters"
            placeholder="Enter a name"
        >

        <button id="startButton">
            Start Show
        </button>
    </div>

    <div id="finaleText"></div>

</div>

========================================================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", {
    alpha: false
});

let width = 0;
let height = 0;
let dpr = 1;

function resizeCanvas() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);

    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();

/* =========================================================
   PARTICLES
========================================================= */

const rockets = [];
const particles = [];

function random(min, max) {
    return Math.random() * (max - min) + min;
}

function randomInt(min, max) {
    return Math.floor(random(min, max + 1));
}

function randomChoice(array) {
    return array[Math.floor(Math.random() * array.length)];
}

function hexToRgb(hex) {
    const value = hex.replace("#", "");

    return {
        r: parseInt(value.substring(0, 2), 16),
        g: parseInt(value.substring(2, 4), 16),
        b: parseInt(value.substring(4, 6), 16)
    };
}

function colorWithAlpha(color, alpha) {
    const rgb = hexToRgb(color);

    return `rgba(${rgb.r},${rgb.g},${rgb.b},${alpha})`;
}


/* =========================================================
   ROCKET
========================================================= */

function createRocket(
    targetX,
    targetY,
    palette,
    type = "sphere",
    power = 1
) {
    if (rockets.length >= MAX_ROCKETS) {
        return;
    }

    const startX = random(width * 0.08, width * 0.92);
    const startY = height + 12;

    const dx = targetX - startX;
    const dy = targetY - startY;

    const distance = Math.sqrt(dx * dx + dy * dy);

    const speed = random(7.5, 10.5) * power;

    rockets.push({
        x: startX,
        y: startY,
        vx: dx / distance * speed,
        vy: dy / distance * speed,
        targetY,
        palette,
        type,
        trail: [],
        age: 0,
        maxAge: random(55, 85)
    });
}


/* =========================================================
   EXPLOSIONS
========================================================= */

function createExplosion(
    x,
    y,
    palette,
    type,
    power = 1
) {
    if (particles.length >= MAX_PARTICLES) {
        return;
    }

    const baseCount = Math.floor(
        random(75, 125) * power
    );

    const colors = palette;

    if (type === "sphere" || type === "peony") {

        for (let i = 0; i < baseCount; i++) {

            const angle = Math.random() * Math.PI * 2;
            const speed = random(2.2, 6.5) * power;

            particles.push({
                x,
                y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                gravity: 0.035,
                friction: 0.985,
                life: random(55, 105),
                maxLife: 105,
                size: random(1.2, 2.7),
                color: randomChoice(colors),
                type: "normal"
            });
        }

    } else if (type === "ring") {

        const count = Math.floor(110 * power);

        for (let i = 0; i < count; i++) {

            const angle = (Math.PI * 2 * i) / count;
            const speed = random(4.0, 5.7) * power;

            particles.push({
                x,
                y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                gravity: 0.025,
                friction: 0.988,
                life: random(65, 95),
                maxLife: 95,
                size: random(1.3, 2.5),
                color: randomChoice(colors),
                type: "normal"
            });
        }

    } else if (type === "doubleRing") {

        const count = Math.floor(85 * power);

        for (let ring = 0; ring < 2; ring++) {

            const radiusSpeed =
                ring === 0
                    ? random(3.2, 4.0)
                    : random(5.0, 6.0);

            for (let i = 0; i < count; i++) {

                const angle = (Math.PI * 2 * i) / count;

                particles.push({
                    x,
                    y,
                    vx: Math.cos(angle) * radiusSpeed,
                    vy: Math.sin(angle) * radiusSpeed,
                    gravity: 0.028,
                    friction: 0.988,
                    life: random(65, 105),
                    maxLife: 105,
                    size: random(1.2, 2.5),
                    color: colors[ring % colors.length],
                    type: "normal"
                });
            }
        }

    } else if (type === "willow") {

        for (let i = 0; i < baseCount; i++) {

            const angle = random(0, Math.PI * 2);
            const speed = random(2.5, 5.8) * power;

            particles.push({
                x,
                y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed - 1,
                gravity: 0.075,
                friction: 0.994,
                life: random(90, 145),
                maxLife: 145,
                size: random(1.3, 2.8),
                color: randomChoice(colors),
                type: "normal"
            });
        }

    } else if (type === "crackle") {

        for (let i = 0; i < baseCount; i++) {

            const angle = Math.random() * Math.PI * 2;
            const speed = random(2, 7) * power;

            particles.push({
                x,
                y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                gravity: 0.04,
                friction: 0.982,
                life: random(40, 90),
                maxLife: 90,
                size: random(1.5, 3),
                color: randomChoice(colors),
                type: "crackle",
                crackleTimer: random(4, 15)
            });
        }

    } else if (type === "chrysanthemum") {

        for (let i = 0; i < baseCount * 1.15; i++) {

            const angle = Math.random() * Math.PI * 2;
            const speed = random(3, 7) * power;

            particles.push({
                x,
                y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                gravity: 0.032,
                friction: 0.986,
                life: random(75, 115),
                maxLife: 115,
                size: random(1.2, 2.5),
                color: colors[i % colors.length],
                type: "normal"
            });
        }

    } else if (type === "fan") {

        const direction = random(-0.35, 0.35);

        for (let i = 0; i < baseCount; i++) {

            const angle =
                -Math.PI / 2 +
                direction +
                random(-0.75, 0.75);

            const speed = random(3.5, 7) * power;

            particles.push({
                x,
                y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                gravity: 0.04,
                friction: 0.987,
                life: random(65, 105),
                maxLife: 105,
                size: random(1.2, 2.5),
                color: randomChoice(colors),
                type: "normal"
            });
        }

    } else if (type === "heart") {

        const count = Math.floor(125 * power);

        for (let i = 0; i < count; i++) {

            const t =
                (Math.PI * 2 * i) / count;

            const hx = 16 * Math.pow(Math.sin(t), 3);
            const hy =
                13 * Math.cos(t)
                - 5 * Math.cos(2 * t)
                - 2 * Math.cos(3 * t)
                - Math.cos(4 * t);

            const scale = random(0.25, 0.38) * power;

            particles.push({
                x,
                y,
                vx: hx * scale,
                vy: -hy * scale,
                gravity: 0.028,
                friction: 0.988,
                life: random(70, 110),
                maxLife: 110,
                size: random(1.4, 2.5),
                color: randomChoice(colors),
                type: "normal"
            });
        }

    } else if (type === "spiral") {

        const count = Math.floor(125 * power);

        for (let i = 0; i < count; i++) {

            const t =
                (i / count) * Math.PI * 10;

            const radius =
                (i / count) * random(2.5, 6);

            particles.push({
                x,
                y,
                vx: Math.cos(t) * radius,
                vy: Math.sin(t) * radius,
                gravity: 0.035,
                friction: 0.986,
                life: random(70, 110),
                maxLife: 110,
                size: random(1.2, 2.5),
                color: colors[i % colors.length],
                type: "normal"
            });
        }

    } else if (type === "cross") {

        const count = Math.floor(70 * power);

        for (let arm = 0; arm < 4; arm++) {

            const angle =
                arm * Math.PI / 2;

            for (let i = 0; i < count; i++) {

                const spread =
                    random(-0.045, 0.045);

                const speed =
                    random(2.5, 7) * power;

                particles.push({
                    x,
                    y,
                    vx:
                        Math.cos(angle + spread) *
                        speed,
                    vy:
                        Math.sin(angle + spread) *
                        speed,
                    gravity: 0.03,
                    friction: 0.987,
                    life: random(65, 105),
                    maxLife: 105,
                    size: random(1.2, 2.5),
                    color: randomChoice(colors),
                    type: "normal"
                });
            }
        }

    } else if (type === "saturn") {

        for (let i = 0; i < baseCount; i++) {

            const angle =
                Math.random() * Math.PI * 2;

            const speed =
                random(2.5, 6) * power;

            particles.push({
                x,
                y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                gravity: 0.03,
                friction: 0.987,
                life: random(65, 105),
                maxLife: 105,
                size: random(1.2, 2.4),
                color: randomChoice(colors),
                type: "normal"
            });
        }

        const ringCount = Math.floor(100 * power);

        for (let i = 0; i < ringCount; i++) {

            const angle =
                (Math.PI * 2 * i) / ringCount;

            const speed = 5.2 * power;

            particles.push({
                x,
                y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed * 0.32,
                gravity: 0.02,
                friction: 0.988,
                life: random(60, 95),
                maxLife: 95,
                size: random(1.2, 2.3),
                color: colors[1 % colors.length],
                type: "normal"
            });
        }

    } else if (type === "rainbow") {

        for (let i = 0; i < baseCount * 1.1; i++) {

            const angle =
                Math.random() * Math.PI * 2;

            const speed =
                random(2.5, 6.5) * power;

            particles.push({
                x,
                y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                gravity: 0.035,
                friction: 0.986,
                life: random(65, 105),
                maxLife: 105,
                size: random(1.2, 2.5),
                color:
                    palettes[
                        i % palettes.length
                    ][0],
                type: "normal"
            });
        }

    } else if (type === "golden") {

        for (let i = 0; i < baseCount * 1.2; i++) {

            const angle =
                Math.random() * Math.PI * 2;

            const speed =
                random(2.2, 6.3) * power;

            particles.push({
                x,
                y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                gravity: 0.055,
                friction: 0.992,
                life: random(90, 145),
                maxLife: 145,
                size: random(1.3, 2.8),
                color: randomChoice(colors),
                type: "normal"
            });
        }
    }
}


/* =========================================================
   SHOW ITEM LAUNCHER
========================================================= */

let showItemIndex = 0;

function launchShowItem(intensity = 1) {

    /*
        Keep the large preset variety, but prevent the launcher
        from adding excessive work when the particle system is full.
    */

    if (
        rockets.length >= MAX_ROCKETS ||
        particles.length >= MAX_PARTICLES * 0.88
    ) {
        return;
    }

    /*
        The preset list cycles through all 100+ varieties.
        Individual positions, colors, power and timing remain
        randomized.
    */
    const item =
        showItems[
            showItemIndex % showItems.length
        ];

    showItemIndex++;

    const palette =
        palettes[
            item.palette % palettes.length
        ];

    const power =
        random(0.88, 1.12) *
        intensity;

    for (
        let i = 0;
        i < item.count;
        i++
    ) {

        const targetX =
            random(
                width * 0.10,
                width * 0.90
            );

        const targetY =
            random(
                height * 0.13,
                height * 0.53
            );

        createRocket(
            targetX,
            targetY,
            palette,
            item.type,
            power
        );
    }
}


/* =========================================================
   SPECIAL RANDOM SEQUENCES
========================================================= */

function specialSequence() {

    if (!showActive || finaleRunning) {
        return;
    }

    const sequence =
        randomInt(0, 9);

    const centerX = width / 2;

    if (sequence === 0) {

        for (let i = 0; i < 3; i++) {

            createRocket(
                centerX + random(-220, 220),
                random(height * 0.18, height * 0.45),
                randomChoice(palettes),
                randomChoice([
                    "ring",
                    "sphere",
                    "peony"
                ]),
                1
            );
        }

    } else if (sequence === 1) {

        for (let i = 0; i < 4; i++) {

            createRocket(
                width * (0.18 + i * 0.21),
                random(height * 0.2, height * 0.48),
                randomChoice(palettes),
                "sphere",
                0.9
            );
        }

    } else if (sequence === 2) {

        createRocket(
            centerX,
            height * 0.25,
            randomChoice(palettes),
            "heart",
            1
        );

    } else if (sequence === 3) {

        for (let i = 0; i < 3; i++) {

            createRocket(
                random(width * 0.15, width * 0.85),
                random(height * 0.2, height * 0.45),
                randomChoice(palettes),
                "doubleRing",
                0.9
            );
        }

    } else if (sequence === 4) {

        for (let i = 0; i < 5; i++) {

            createRocket(
                width * random(0.12, 0.88),
                random(height * 0.2, height * 0.5),
                palettes[
                    i % palettes.length
                ],
                "fan",
                0.85
            );
        }

    } else if (sequence === 5) {

        createRocket(
            centerX,
            height * 0.25,
            palettes[4],
            "golden",
            1.15
        );

    } else if (sequence === 6) {

        for (let i = 0; i < 2; i++) {

            createRocket(
                random(width * 0.2, width * 0.8),
                random(height * 0.18, height * 0.4),
                randomChoice(palettes),

            );
        }

    } else if (sequence === 7) {

        createRocket(
            width * 0.25,

        );

        createRocket(
            width * 0.75,
            height * 0.3,

    } else if (sequence === 8) {

        createRocket(

    } else {

        for (let i = 0; i < 3; i++) {

                random(height * 0.18, height * 0.5),
                randomChoice(palettes),

}


/* =========================================================
   UPDATE ROCKETS
========================================================= */

function updateRockets() {

    for (let i = rockets.length - 1; i >= 0; i--) {

        const rocket = rockets[i];

        rocket.age++;

        rocket.trail.push({
            x: rocket.x,
            y: rocket.y
        });

        if (rocket.trail.length > 8) {
            rocket.trail.shift();
        }

        rocket.x += rocket.vx;
        rocket.y += rocket.vy;

        rocket.vy += 0.055;

        const reachedTarget =
            rocket.y <= rocket.targetY;

        const slowed =
            rocket.vy >= -0.4;

        const oldAge =
            rocket.age >= rocket.maxAge;

        if (
            reachedTarget ||
            slowed ||
            oldAge
        ) {

            createExplosion(
                rocket.x,
                rocket.y,
                rocket.palette,
                rocket.type,
                1
            );

            rockets.splice(i, 1);
        }
    }
}


/* =========================================================
   UPDATE PARTICLES
========================================================= */

function updateParticles() {

    for (
        let i = particles.length - 1;
        i >= 0;
        i--
    ) {

        const p = particles[i];

        p.x += p.vx;
        p.y += p.vy;

        p.vx *= p.friction;
        p.vy *= p.friction;

        p.vy += p.gravity;

        p.life--;

        if (
            p.type === "crackle" &&
            p.crackleTimer > 0
        ) {
            p.crackleTimer--;
        }

        if (p.life <= 0) {
            particles.splice(i, 1);
        }
    }
}


/* =========================================================
   DRAW
========================================================= */

function draw() {

    /*
        Slight persistence creates trails without retaining
        enough history to become expensive.
    */
    ctx.globalCompositeOperation = "source-over";

    ctx.fillStyle =
        "rgba(0, 0, 8, 0.22)";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );

    ctx.globalCompositeOperation = "lighter";


    /* ROCKET TRAILS */

    for (const rocket of rockets) {

        for (
            let i = 0;
            i < rocket.trail.length;
            i++
        ) {

            const point =
                rocket.trail[i];

            const alpha =
                i /
                rocket.trail.length *
                0.65;

            ctx.fillStyle =
                colorWithAlpha(
                    rocket.palette[0],
                    alpha
                );

            const size =
                1 +
                i /
                rocket.trail.length *
                1.5;

            ctx.fillRect(
                point.x - size / 2,
                point.y - size / 2,
                size,
                size
            );
        }

        ctx.fillStyle =
            rocket.palette[2];

        ctx.beginPath();

        ctx.arc(
            rocket.x,
            rocket.y,
            2.2,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }


    /* PARTICLES */

    for (const p of particles) {

        const alpha =
            Math.max(
                0,
                Math.min(
                    1,
                    p.life / p.maxLife
                )
            );

        ctx.fillStyle =
            colorWithAlpha(
                p.color,
                alpha
            );

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.globalCompositeOperation =
        "source-over";
}

/* =========================================================
   CREATE TEXT TARGETS
========================================================= */

function createLetterTargets(text) {

    text =
        text
            .toUpperCase()
            .replace(/[^A-Z ]/g, "");

    if (!text) {
        return [];
    }

    const patterns =
        text
            .split("")
            .map(char =>
                letterFont[char] ||
                letterFont[" "]
            );

    const letterWidth = 5;
    const letterGap = 1;

    const totalColumns =
        patterns.length * letterWidth +
        Math.max(0, patterns.length - 1) * letterGap;

    const maxWidth =
        Math.min(
            width * 0.88,
            1100
        );

    const cellSize =
        Math.min(
            22,
            maxWidth / totalColumns
        );

    const totalWidth =
        totalColumns * cellSize;

    const totalHeight =
        7 * cellSize;

    const startX =
        (width - totalWidth) / 2;

    const startY =
        (height - totalHeight) / 2;

    const targets = [];

    let cursorColumn = 0;

    for (const pattern of patterns) {

        for (
            let row = 0;
            row < pattern.length;
            row++
        ) {

            for (
                let col = 0;
                col < pattern[row].length;
                col++
            ) {

                if (pattern[row][col] === "1") {

                    targets.push({
                        x:
                            startX +
                            (cursorColumn + col) *
                            cellSize +
                            cellSize / 2,

                        y:
                            startY +
                            row *
                            cellSize +
                            cellSize / 2
                    });
                }
            }
        }

        cursorColumn +=
            letterWidth +
            letterGap;
    }

    return targets;
}


/* =========================================================
   FIREWORK TEXT
========================================================= */

function launchLetterFireworks(
    text,
    palette
) {

    const targets =
        createLetterTargets(text);

    if (!targets.length) {
        return;
    }

    /*
        Spread the rockets over time rather than launching
        every letter particle simultaneously.
    */
    targets.forEach((target, index) => {

        setTimeout(() => {

            if (!finaleRunning) {
                return;
            }

            if (
                rockets.length >=
                MAX_ROCKETS
            ) {
                return;
            }

            createRocket(
                target.x,
                target.y,
                palette,
                "sphere",
                0.78
            );

        }, index * 24);
    });
}


/* =========================================================
   FINALE BURST
========================================================= */

function finaleBurst(
    amount = 5
) {

    for (let i = 0; i < amount; i++) {

        setTimeout(() => {

            if (!finaleRunning) {
                return;
            }

            createRocket(
                random(
                    width * 0.08,
                    width * 0.92
                ),
                random(
                    height * 0.16,
                    height * 0.48
                ),
                randomChoice(palettes),
                randomChoice([
                    "sphere",
                    "ring",
                    "doubleRing",
                    "chrysanthemum",
                    "peony",
                    "golden",
                    "rainbow"
                ]),
                random(0.9, 1.25)
            );

        }, i * 260);
    }
}


/* =========================================================
   FINALE
========================================================= */

function runFinale() {

    if (finaleStarted) {
        return;
    }

    finaleStarted = true;
    finaleRunning = true;

    const finaleText =
        document.getElementById("finaleText");

    /*
        Clear old show effects gradually by stopping new
        main-show launches while allowing existing fireworks
        to finish.
    */

    setTimeout(() => {

        if (!finaleRunning) {
            return;
        }

        finaleText.textContent = "HAPPY";
        finaleText.classList.add("visible");

        launchLetterFireworks(
            "HAPPY",
            randomChoice(palettes)
        );

        finaleBurst(6);

    }, 500);


    setTimeout(() => {

        if (!finaleRunning) {
            return;
        }

        finaleText.textContent = "BIRTHDAY";

        launchLetterFireworks(
            "BIRTHDAY",
            randomChoice(palettes)
        );

        finaleBurst(8);

    }, 4700);


    setTimeout(() => {

        if (!finaleRunning) {
            return;
        }

        finaleText.textContent =
            birthdayName;

        launchLetterFireworks(
            birthdayName,
            randomChoice(palettes)
        );

        finaleBurst(10);

    }, 9000);


    setTimeout(() => {

        if (!finaleRunning) {
            return;
        }

        finaleText.textContent =
            birthdayName;

        launchLetterFireworks(
            birthdayName,
            randomChoice(palettes)
        );

        finaleBurst(14);

    }, 12400);


    setTimeout(() => {

        finaleRunning = false;

        finaleText.classList.remove("visible");

        /*
            Leave the final particles on screen for a moment,
            then finish cleanly.
        */

        setTimeout(() => {

            showFinished = true;

        }, 1800);

    }, 16500);
}


/* =========================================================
   SHOW SCHEDULER
========================================================= */

function updateShow(time) {

    if (!showActive || showFinished) {
        return;
    }

    showElapsed =
        time -
        showStartTime;


    /*
        Main show ends here.
        The finale then takes over.
    */
    if (
        showElapsed >= SHOW_DURATION
    ) {

        showActive = false;

        runFinale();

        return;
    }


    /*
        Increasing intensity over the course
        of the show.
    */
    const progress =
        showElapsed /
        SHOW_DURATION;

    let intensity = 1;

    if (progress > 0.55) {
        intensity += 0.18;
    }

    if (progress > 0.70) {
        intensity += 0.25;
    }

    if (progress > 0.80) {
        intensity += 0.65;
    }

    if (progress > 0.93) {
        intensity += 0.8;
    }


    /*
        CONTINUOUS FIREWORK SCHEDULER

        The important part:

        Instead of firing many fireworks during one frame,
        the scheduler uses a 400ms preparation buffer.

        This does NOT add a 400ms visible gap.
        Existing fireworks remain active while new ones
        are introduced.
    */

    if (
        time >= nextContinuousLaunch -
        FIREWORK_BUFFER
    ) {

        /*
            Only perform the expensive creation once
            the scheduler reaches the launch window.
        */
        if (
            time >= nextContinuousLaunch
        ) {

            launchShowItem(intensity);

            /*
                Random interval keeps the show natural.
            */
            const interval =
                random(
                    MIN_LAUNCH_INTERVAL,
                    MAX_LAUNCH_INTERVAL
                );

            /*
                Schedule the next launch relative to
                the previous launch rather than current
                frame time. This prevents drift.
            */
            nextContinuousLaunch +=
                interval;

            /*
                If the browser was temporarily busy,
                don't queue dozens of missed launches.
            */
            if (
                nextContinuousLaunch <
                time - FIREWORK_BUFFER
            ) {

                nextContinuousLaunch =
                    time +
                    random(
                        MIN_LAUNCH_INTERVAL,
                        MAX_LAUNCH_INTERVAL
                    );
            }
        }
    }


    /*
        SPECIAL RANDOM EVENTS
    */

    if (
        time >=
        nextSpecialLaunch -
        FIREWORK_BUFFER
    ) {

        if (
            time >=
            nextSpecialLaunch
        ) {

            specialSequence();

            nextSpecialLaunch =
                time +
                random(
                    2600,
                    5200
                );
        }
    }


    /*
        Extra activity during the final
        portion of the main show.
    */

    if (
        progress > 0.93 &&
        time >= nextContinuousLaunch
    ) {

        launchShowItem(
            intensity * 1.12
        );
    }
}


/* =========================================================
   MAIN UPDATE
========================================================= */

function update() {

    updateRockets();
    updateParticles();

    /*
        Hard protection against runaway particle counts.
    */
    if (
        particles.length >
        MAX_PARTICLES
    ) {

        particles.splice(
            0,
            particles.length -
            MAX_PARTICLES
        );
    }

    if (
        rockets.length >
        MAX_ROCKETS
    ) {

        rockets.splice(
            0,
            rockets.length -
            MAX_ROCKETS
        );
    }
}


/* =========================================================
   ANIMATION LOOP
========================================================= */

let lastFrameTime = 0;

function loop(time) {

    /*
        Ignore tiny duplicate timestamps and keep the
        animation loop lightweight.
    */
    if (
        time === lastFrameTime
    ) {
        requestAnimationFrame(loop);
        return;
    }

    lastFrameTime = time;

    updateShow(time);
    update();
    draw();

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);


/* =========================================================
   START SHOW
========================================================= */

const startScreen =
    document.getElementById("startScreen");

const nameInput =
    document.getElementById("nameInput");

const startButton =
    document.getElementById("startButton");


function cleanName(value) {

    return value
        .toUpperCase()
        .replace(/[^A-Z ]/g, "")
        .replace(/\s+/g, " ")
        .trim()
        .slice(0, 20);
}


startButton.addEventListener(
    "click",
    () => {

        birthdayName =
            cleanName(
                nameInput.value
            );

        if (!birthdayName) {
            birthdayName = "ZAYDEN";
        }

        startScreen.style.display =
            "none";

        showActive = true;
        showFinished = false;

        finaleRunning = false;
        finaleStarted = false;

        showElapsed = 0;

        showStartTime =
            performance.now();

        showItemIndex = 0;

        rockets.length = 0;
        particles.length = 0;

        const now =
            performance.now();

        /*
            First launch starts immediately.
            There is no initial 5-second dead period.
        */
        nextContinuousLaunch =
            now + 150;

        nextSpecialLaunch =
            now + 2800;
    }
);


/* =========================================================
   KEYBOARD SUPPORT
========================================================= */

nameInput.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {
            startButton.click();
        }
    }
);


/* =========================================================
   PREVENT ACCIDENTAL PAGE GESTURES
========================================================= */

document.addEventListener(
    "touchmove",
    event => {
        event.preventDefault();
    },
    {
        passive: false
    }
);

document.addEventListener(
    "gesturestart",
    event => {
        event.preventDefault();
    }
);

document.addEventListener(
    "dblclick",
    event => {
        event.preventDefault();
    }
);


/* =========================================================
   NO USER FIREWORK PLACEMENT
========================================================= */

/*
    The canvas intentionally has no click/touch firework
    launcher. The entire show is automated.
*/
