            A continuous 5-minute fireworks show followed by
            a special particle-built birthday finale.
        </p>

            id="nameInput"
            type="text"
            maxlength="20"
            autocomplete="off"
            autocapitalize="characters"

        <button id="startButton">

        </button>

<script>
"use strict";


/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

let width = 0;
let height = 0;
let dpr = 1;

function resize() {

    dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    width =
        window.innerWidth;

    height =
        window.innerHeight;

    canvas.width =
        Math.floor(width * dpr);

    canvas.height =
        Math.floor(height * dpr);

    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

window.addEventListener(
    "resize",
    resize
);

resize();


/* =========================================================
   AUDIO
========================================================= */

let audioContext = null;
let masterGain = null;
let compressor = null;
let noiseBuffer = null;
let audioReady = false;


function initAudio() {

    if (audioReady) {

        if (
            audioContext &&
            audioContext.state === "suspended"
        ) {

            audioContext.resume();
        }

        return;
    }


    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;


    if (!AudioContext) {
        return;
    }


    audioContext =
        new AudioContext();


    compressor =
        audioContext.createDynamicsCompressor();

    compressor.threshold.value =
        -18;

    compressor.knee.value =
        18;

    compressor.ratio.value =
        7;

    compressor.attack.value =
        0.003;

    compressor.release.value =
        0.18;


    masterGain =
        audioContext.createGain();

    masterGain.gain.value =
        0.30;


    masterGain.connect(
        compressor
    );

    compressor.connect(
        audioContext.destination
    );


    createNoiseBuffer();


    audioReady = true;


    if (
        audioContext.state === "suspended"
    ) {

        audioContext.resume();
    }
}


function createNoiseBuffer() {

    const sampleRate =
        audioContext.sampleRate;

    const length =
        Math.floor(
            sampleRate * 2
        );


    noiseBuffer =
        audioContext.createBuffer(
            1,
            length,
            sampleRate
        );


    const data =
        noiseBuffer.getChannelData(0);


    for (
        let i = 0;
        i < length;
        i++
    ) {

        data[i] =
            (
                Math.random() * 2 -
                1
            ) * 0.85;
    }
}


function getAudioTime() {

    if (!audioContext) {
        return 0;
    }

    return (
        audioContext.currentTime +
        0.015
    );
}


function createTone(
    startFrequency,
    endFrequency,
    duration,
    volume,
    waveform = "sine",
    delay = 0
) {

    if (!audioReady) {
        return;
    }


    const now =
        getAudioTime() +
        delay;


    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();


    oscillator.type =
        waveform;


    oscillator.frequency.setValueAtTime(
        Math.max(
            20,
            startFrequency
        ),
        now
    );


    oscillator.frequency.exponentialRampToValueAtTime(
        Math.max(
            20,
            endFrequency
        ),
        now + duration
    );


    gain.gain.setValueAtTime(
        0.0001,
        now
    );


    gain.gain.exponentialRampToValueAtTime(
        Math.max(
            0.0002,
            volume
        ),
        now + 0.006
    );


    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + duration
    );


    oscillator.connect(gain);
    gain.connect(masterGain);


    oscillator.start(now);

    oscillator.stop(
        now +
        duration +
        0.03
    );
}


function createNoiseBurst(
    duration,
    volume,
    filterType,
    frequency,
    delay = 0,
    resonance = 0.7
) {

    if (
        !audioReady ||
        !noiseBuffer
    ) {

        return;
    }


    const now =
        getAudioTime() +
        delay;


    const source =
        audioContext.createBufferSource();

    const filter =
        audioContext.createBiquadFilter();

    const gain =
        audioContext.createGain();


    source.buffer =
        noiseBuffer;


    filter.type =
        filterType;

    filter.frequency.value =
        frequency;

    filter.Q.value =
        resonance;


    gain.gain.setValueAtTime(
        0.0001,
        now
    );


    gain.gain.exponentialRampToValueAtTime(
        Math.max(
            0.0002,
            volume
        ),
        now + 0.004
    );


    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + duration
    );


    source.connect(filter);
    filter.connect(gain);
    gain.connect(masterGain);


    source.start(now);

    source.stop(
        now +
        duration +
        0.03
    );
}


/* =========================================================
   REAL FIREWORK ROCKET WHISTLE
========================================================= */

function playRocketSound(
    power = 1
) {

    if (!audioReady) {
        return;
    }


    const now =
        getAudioTime();


    /*
        Main rising rocket whistle.

        There is intentionally NO triangle
        "bounce" tone here.
    */

    const whistle =
        audioContext.createOscillator();

    const whistleGain =
        audioContext.createGain();


    whistle.type =
        "sine";


    const startFrequency =
        random(
            380,
            500
        );

    const endFrequency =
        random(
            1800,
            2400
        );


    whistle.frequency.setValueAtTime(
        startFrequency,
        now
    );


    whistle.frequency.exponentialRampToValueAtTime(
        endFrequency,
        now + 0.52
    );


    /*
        Tiny pitch wobble gives the whistle
        a more natural rocket character.
    */

    const wobble =
        audioContext.createOscillator();

    const wobbleGain =
        audioContext.createGain();


    wobble.type =
        "sine";

    wobble.frequency.value =
        random(
            5,
            8
        );

    wobbleGain.gain.value =
        random(
            12,
            24
        );


    wobble.connect(
        wobbleGain
    );

    wobbleGain.connect(
        whistle.frequency
    );


    whistleGain.gain.setValueAtTime(
        0.0001,
        now
    );


    whistleGain.gain.exponentialRampToValueAtTime(
        0.070 * power,
        now + 0.045
    );


    whistleGain.gain.setValueAtTime(
        0.070 * power,
        now + 0.34
    );


    whistleGain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + 0.58
    );


    whistle.connect(
        whistleGain
    );

    whistleGain.connect(
        masterGain
    );


    wobble.start(now);
    whistle.start(now);


    wobble.stop(
        now + 0.61
    );

    whistle.stop(
        now + 0.61
    );


    /*
        Very quiet air rushing underneath
        the whistle.
    */

    createNoiseBurst(
        0.48,
        0.009 * power,
        "bandpass",
        2500,
        0,
        0.8
    );
}


/* =========================================================
   EXPLOSION AUDIO
========================================================= */

function playBoom(
    intensity = 1,
    size = "normal",
    delay = 0
) {

    if (!audioReady) {
        return;
    }


    let duration =
        0.32;

    let volume =
        0.24;


    if (
        size === "large"
    ) {

        duration =
            0.48;

        volume =
            0.30;
    }


    if (
        size === "soft"
    ) {

        duration =
            0.52;

        volume =
            0.16;
    }


    createTone(
        random(70, 95),
        random(27, 40),
        duration,
        volume * intensity,
        "sine",
        delay
    );


    createTone(
        random(115, 155),
        random(45, 65),
        duration * 0.72,
        volume * 0.55 * intensity,
        "sine",
        delay
    );


    createNoiseBurst(
        duration * 0.95,
        0.17 * intensity,
        "lowpass",
        random(700, 1100),
        delay,
        0.5
    );


    createNoiseBurst(
        0.075,
        0.10 * intensity,
        "highpass",
        random(2800, 4600),
        delay
    );
}


function playSnap(
    intensity = 1,
    delay = 0
) {

    if (!audioReady) {
        return;
    }


    createNoiseBurst(
        0.055,
        0.10 * intensity,
        "highpass",
        random(3500, 6500),
        delay
    );
}


function playCrackleSounds(
    amount = 12,
    intensity = 1,
    spread = 0.65
) {

    if (!audioReady) {
        return;
    }


    amount =
        Math.min(
            amount,
            18
        );


    for (
        let i = 0;
        i < amount;
        i++
    ) {

        const delay =
            random(
                0.025,
                spread
            );


        createNoiseBurst(
            random(
                0.018,
                0.045
            ),
            random(
                0.018,
                0.045
            ) *
            intensity,
            "highpass",
            random(
                2500,
                7000
            ),
            delay
        );
    }
}


function playStandardFireworkSound(
    type,
    intensity = 1
) {

    if (!audioReady) {
        return;
    }


    if (
        type === "doubleRing"
    ) {

        playBoom(
            intensity,
            "normal"
        );

        playSnap(
            intensity * 0.7,
            0.035
        );

        playBoom(
            intensity * 0.88,
            "normal",
            0.13
        );

        playSnap(
            intensity * 0.7,
            0.16
        );

        return;
    }


    if (
        type === "willow"
    ) {

        playBoom(
            intensity * 0.82,
            "soft"
        );

        playCrackleSounds(
            7,
            intensity * 0.7,
            0.95
        );

        return;
    }


    if (
        type === "crackle"
    ) {

        playBoom(
            intensity,
            "normal"
        );

        playSnap(
            intensity,
            0.035
        );

        playCrackleSounds(
            17,
            intensity,
            0.72
        );

        return;
    }


    if (
        type === "chrysanthemum"
    ) {

        playBoom(
            intensity * 1.05,
            "large"
        );

        playSnap(
            intensity,
            0.035
        );

        playCrackleSounds(
            8,
            intensity * 0.7,
            0.60
        );

        return;
    }


    if (
        type === "golden"
    ) {

        playBoom(
            intensity,
            "large"
        );

        playCrackleSounds(
            10,
            intensity * 0.72,
            0.90
        );

        return;
    }


    if (
        type === "fan"
    ) {

        playBoom(
            intensity * 0.75,
            "normal"
        );

        playSnap(
            intensity * 0.75,
            0.05
        );

        playSnap(
            intensity * 0.68,
            0.17
        );

        playSnap(
            intensity * 0.60,
            0.29
        );

        return;
    }


    if (
        type === "heart"
    ) {

        playBoom(
            intensity * 0.82,
            "soft"
        );

        return;
    }


    if (
        type === "rainbow"
    ) {

        playBoom(
            intensity,
            "large"
        );

        return;
    }


    playBoom(
        intensity,
        "normal"
    );

    playSnap(
        intensity * 0.82,
        0.035
    );
}


function playTextFireworkSound(
    intensity = 1.25
) {

    if (!audioReady) {
        return;
    }


    createTone(
        180,
        1050,
        0.65,
        0.065 * intensity,
        "sine"
    );


    createNoiseBurst(
        0.50,
        0.025 * intensity,
        "bandpass",
        1900
    );


    playBoom(
        intensity,
        "large",
        0.58
    );


    playSnap(
        intensity,
        0.61
    );


    for (
        let i = 0;
        i < 10;
        i++
    ) {

        createNoiseBurst(
            0.035,
            0.015 * intensity,
            "highpass",
            random(
                3500,
                7000
            ),
            0.68 +
            i * 0.07
        );
    }
}

/* =========================================================
   HELPERS
========================================================= */

function random(
    min,
    max
) {

    return Math.random() *
        (max - min) +
        min;
}


function randomInt(
    min,
    max
) {

    return Math.floor(
        random(
            min,
            max + 1
        )
    );
}


function pick(
    array
) {

    return array[
        Math.floor(
            Math.random() *
            array.length
        )
    ];
}


function clamp(
    value,
    min,
    max
) {

    return Math.max(
        min,
        Math.min(
            max,
            value
        )
    );
}

/* =========================================================
   NORMAL ROCKET
========================================================= */

function createRocket(
    targetX,
    targetY,
    palette,
    type,
    power = 1,
    delay = 0
) {

    const startX =
        random(
            width * 0.08,
            width * 0.92
        );

    const startY =
        height +
        random(
            15,
            80
        );


    const dx =
        targetX -
        startX;

    const dy =
        targetY -
        startY;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    const speed =
        random(
            8.5,
            11.5
        ) *
        power;


    rockets.push({

        x: startX,
        y: startY,

        vx:
            dx /
            distance *
            speed,

        vy:
            dy /
            distance *
            speed,

        targetX,
        targetY,

        palette,
        type,

        age:
            -delay,

        trail: [],

        exploded: false
    });


    if (
        delay === 0
    ) {

        playRocketSound(
            Math.min(
                power,
                1.5
            )
        );
    }
}


/* =========================================================
   NORMAL EXPLOSION
========================================================= */

function createExplosion(
    rocket
) {

    const {
        x,
        y,
        palette,
        type
    } = rocket;


    const baseCount = {

        sphere: 110,
        ring: 120,
        doubleRing: 105,
        willow: 130,
        crackle: 125,
        chrysanthemum: 145,
        peony: 125,
        fan: 100,
        heart: 105,
        spiral: 120,
        cross: 115,
        rainbow: 150,
        golden: 135

    }[type] || 110;


    const count =
        Math.floor(
            baseCount *
            random(
                0.82,
                1.12
            )
        );


    for (
        let i = 0;
        i < count;
        i++
    ) {

        let angle;
        let speed;


        if (
            type === "ring"
        ) {

            angle =
                Math.PI * 2 *
                i /
                count +
                random(
                    -0.025,
                    0.025
                );

            speed =
                random(
                    3.2,
                    5.8
                );


        } else if (
            type === "doubleRing"
        ) {

            const ring =
                i % 2 === 0
                    ? 0
                    : 1;


            angle =
                Math.PI * 2 *
                Math.floor(i / 2) /
                Math.ceil(count / 2) +
                random(
                    -0.025,
                    0.025
                );


            speed =
                ring === 0
                    ? random(
                        3.0,
                        4.4
                    )
                    : random(
                        5.2,
                        6.8
                    );


        } else if (
            type === "fan"
        ) {

            angle =
                Math.PI *
                random(
                    1.08,
                    1.92
                );

            speed =
                random(
                    3.5,
                    7
                );


        } else if (
            type === "heart"
        ) {

            const t =
                Math.PI * 2 *
                i /
                count;


            const hx =
                16 *
                Math.pow(
                    Math.sin(t),
                    3
                );


            const hy =
                -(
                    13 *
                    Math.cos(t) -
                    5 *
                    Math.cos(2 * t) -
                    2 *
                    Math.cos(3 * t) -
                    Math.cos(4 * t)
                );


            const scale =
                random(
                    0.20,
                    0.34
                );


            particles.push({

                x,
                y,

                vx:
                    hx *
                    scale,

                vy:
                    hy *
                    scale,

                gravity:
                    0.012,

                drag:
                    0.985,

                life:
                    random(
                        100,
                        150
                    ),

                maxLife:
                    150,

                size:
                    random(
                        1.1,
                        2.5
                    ),

                color:
                    pick(palette),

                twinkle:
                    Math.random() *
                    Math.PI *
                    2
            });


            continue;


        } else if (
            type === "spiral"
        ) {

            angle =
                i *
                0.21 +
                random(
                    -0.03,
                    0.03
                );

            speed =
                2.4 +
                i /
                count *
                4.2;


        } else if (
            type === "cross"
        ) {

            const arm =
                i % 4;


            angle =
                arm *
                Math.PI /
                2 +
                random(
                    -0.055,
                    0.055
                );


            speed =
                random(
                    3.0,
                    6.5
                );


        } else {

            angle =
                random(
                    0,
                    Math.PI * 2
                );


            speed =
                random(
                    2.8,
                    6.5
                );
        }


        let gravity =
            0.025;

        let drag =
            0.982;

        let life =
            random(
                72,
                125
            );


        if (
            type === "willow"
        ) {

            gravity =
                random(
                    0.035,
                    0.055
                );

            drag =
                random(
                    0.975,
                    0.988
                );

            life =
                random(
                    125,
                    190
                );
        }


        if (
            type === "crackle"
        ) {

            gravity =
                0.032;

            drag =
                0.979;

            life =
                random(
                    75,
                    120
                );
        }


        if (
            type === "golden"
        ) {

            gravity =
                random(
                    0.025,
                    0.045
                );

            drag =
                0.983;

            life =
                random(
                    110,
                    175
                );
        }


        if (
            type === "rainbow"
        ) {

            const hue =
                Math.floor(
                    i /
                    count *
                    360
                );


            particles.push({

                x,
                y,

                vx:
                    Math.cos(angle) *
                    speed,

                vy:
                    Math.sin(angle) *
                    speed,

                gravity,
                drag,

                life,
                maxLife:
                    life,

                size:
                    random(
                        1.2,
                        2.7
                    ),

                color:
                    `hsl(${hue},100%,70%)`,

                twinkle:
                    Math.random() *
                    Math.PI * 2,

                crackle:
                    false
            });


            continue;
        }


        particles.push({

            x,
            y,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            gravity,
            drag,

            life,
            maxLife:
                life,

            size:
                type === "crackle"
                    ? random(
                        1,
                        2.3
                    )
                    : random(
                        1.2,
                        2.7
                    ),

            color:
                pick(palette),

            twinkle:
                Math.random() *
                Math.PI * 2,

            crackle:
                type === "crackle"
        });
    }


    for (
        let i = 0;
        i < 20;
        i++
    ) {

        const angle =
            random(
                0,
                Math.PI * 2
            );


        const speed =
            random(
                0.5,
                3.2
            );


        particles.push({

            x,
            y,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            gravity:
                0.01,

            drag:
                0.94,

            life:
                random(
                    15,
                    28
                ),

            maxLife:
                28,

            size:
                random(
                    1.5,
                    3.5
                ),

            color:
                "#ffffff",

            twinkle:
                Math.random() *
                Math.PI * 2
        });
    }


    playStandardFireworkSound(
        type,
        1
    );
}

/* =========================================================
   LETTER TARGETS
========================================================= */

function createLetterTargets(
    text
) {

    text =
        text
            .toUpperCase()
            .replace(
                /[^A-Z ]/g,
                ""
            );


    if (!text) {
        text = "ZAYDEN";
    }


    const cell =
        clamp(
            Math.min(
                22,
                width /
                    Math.max(
                        text.length * 6.2,
                        1
                    ),
                height / 10
            ),
            7,
            22
        );


    const letterWidth =
        5 * cell;


    const spacing =
        cell * 1.35;


    const totalWidth =
        text.length *
        letterWidth +
        Math.max(
            0,
            text.length - 1
        ) *
        spacing;


    const startX =
        (
            width -
            totalWidth
        ) / 2;


    const startY =
        height * 0.38;


    const targets = [];


    for (
        let letterIndex = 0;
        letterIndex <
            text.length;
        letterIndex++
    ) {

        const letter =
            FONT[
                text[
                    letterIndex
                ]
            ] ||
            FONT[" "];


        const offsetX =
            startX +
            letterIndex *
            (
                letterWidth +
                spacing
            );


        for (
            let row = 0;
            row < 7;
            row++
        ) {

            for (
                let col = 0;
                col < 5;
                col++
            ) {

                if (
                    letter[row][col] ===
                    "1"
                ) {

                    targets.push({

                        x:
                            offsetX +
                            col * cell +
                            cell / 2,

                        y:
                            startY +
                            row * cell +
                            cell / 2
                    });
                }
            }
        }
    }


    return targets;
}


/* =========================================================
   TEXT ROCKET
========================================================= */

function createTextRocket(
    targetX,
    targetY,
    palette,
    textTargets,
    delay = 0
) {

    const startX =
        random(
            width * 0.15,
            width * 0.85
        );


    const startY =
        height + 50;


    const dx =
        targetX -
        startX;


    const dy =
        targetY -
        startY;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    const speed =
        9.5;


    rockets.push({

        x: startX,
        y: startY,

        vx:
            dx /
            distance *
            speed,

        vy:
            dy /
            distance *
            speed,

        targetX,
        targetY,

        palette,

        type: "text",

        age:
            -delay,

        trail: [],

        textTargets,

        exploded: false
    });


    if (
        delay === 0
    ) {

        playRocketSound(
            1.15
        );
    }
}


/* =========================================================
   TEXT FIREWORK EXPLOSION
========================================================= */

function createTextExplosion(
    rocket
) {

    textParticles.length = 0;


    const targets =
        rocket.textTargets ||
        [];


    if (!targets.length) {
        return;
    }


    const palette =
        rocket.palette;


    const centerX =
        rocket.x;


    const centerY =
        rocket.y;


    /*
        Every single lit pixel in the bitmap
        is a real firework particle.

        They start at the explosion,
        fly outward,
        then reverse toward their
        assigned letter position.
    */

    for (
        let i = 0;
        i < targets.length;
        i++
    ) {

        const target =
            targets[i];


        const angle =
            random(
                0,
                Math.PI * 2
            );


        const burstDistance =
            random(
                45,
                155
            );


        const burstX =
            centerX +
            Math.cos(angle) *
            burstDistance;


        const burstY =
            centerY +
            Math.sin(angle) *
            burstDistance;


        const burstSpeed =
            random(
                2.8,
                7.2
            );


        textParticles.push({

            x: centerX,
            y: centerY,

            vx:
                Math.cos(angle) *
                burstSpeed,

            vy:
                Math.sin(angle) *
                burstSpeed,

            burstX,
            burstY,

            targetX:
                target.x,

            targetY:
                target.y,

            life: 0,

            /*
                Staggering the assembly keeps
                the text from appearing all at once.
            */

            assembleDelay:
                random(
                    18,
                    50
                ),

            size:
                random(
                    1.1,
                    2.3
                ),

            color:
                pick(palette),

            phase:
                random(
                    0,
                    Math.PI * 2
                ),

            trail: [],

            assembled: false,

            bright:
                Math.random() <
                0.30
        });
    }


    /*
        Additional tiny sparks make the
        text firework look like a real
        explosion instead of just a font
        animation.
    */

    for (
        let i = 0;
        i < 140;
        i++
    ) {

        if (
            textParticles.length >=
            MAX_TEXT_PARTICLES
        ) {

            break;
        }


        const angle =
            random(
                0,
                Math.PI * 2
            );


        const speed =
            random(
                2.5,
                8
            );


        textParticles.push({

            x: centerX,
            y: centerY,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            burstX:
                centerX +
                Math.cos(angle) *
                random(
                    70,
                    180
                ),

            burstY:
                centerY +
                Math.sin(angle) *
                random(
                    70,
                    180
                ),

            targetX:
                centerX,

            targetY:
                centerY,

            life: 0,

            assembleDelay:
                999999,

            size:
                random(
                    0.65,
                    1.7
                ),

            color:
                pick(palette),

            phase:
                random(
                    0,
                    Math.PI * 2
                ),

            trail: [],

            assembled: false,

            loose: true,

            bright:
                Math.random() <
                0.20
        });
    }


    playTextFireworkSound(
        1.25
    );
}


/* =========================================================
   TEXT PARTICLE UPDATE
========================================================= */

function updateTextParticles() {

    for (
        let i =
            textParticles.length - 1;
        i >= 0;
        i--
    ) {

        const p =
            textParticles[i];


        p.life++;


        /*
            Keep short particle trails.
        */

        p.trail.push({

            x: p.x,
            y: p.y

        });


        if (
            p.trail.length >
            4
        ) {

            p.trail.shift();
        }


        /*
            Loose sparks fly away from
            the text explosion.
        */

        if (
            p.loose
        ) {

            p.x +=
                p.vx;

            p.y +=
                p.vy;


            p.vx *=
                0.975;

            p.vy *=
                0.975;


            p.vy +=
                0.018;


            if (
                p.life >
                78
            ) {

                textParticles.splice(
                    i,
                    1
                );
            }


            continue;
        }


        /*
            PHASE 1:
            Tiny firework particle flies
            outward from the explosion.
        */

        if (
            p.life <
            p.assembleDelay
        ) {

            p.x +=
                p.vx;

            p.y +=
                p.vy;


            p.vx *=
                0.965;

            p.vy *=
                0.965;


            p.vy +=
                0.010;


            continue;
        }


        /*
            PHASE 2:
            The firework particle now flies
            back toward its assigned pixel.

            This creates the effect of hundreds
            of sparks forming the letters.
        */

        const dx =
            p.targetX -
            p.x;


        const dy =
            p.targetY -
            p.y;


        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        if (
            distance >
            3.5
        ) {

            p.vx +=
                dx *
                0.020;


            p.vy +=
                dy *
                0.020;


            p.vx *=
                0.91;

            p.vy *=
                0.91;


            p.x +=
                p.vx;

            p.y +=
                p.vy;


        } else {

            /*
                PHASE 3:
                Particle has reached its
                exact letter pixel.
            */

            p.assembled =
                true;


            p.x =
                p.targetX +
                Math.sin(
                    p.life *
                    0.11 +
                    p.phase
                ) *
                0.42;


            p.y =
                p.targetY +
                Math.cos(
                    p.life *
                    0.09 +
                    p.phase
                ) *
                0.42;
        }
    }
}


/* =========================================================
   NORMAL PARTICLE UPDATE
========================================================= */

function updateParticles() {

    for (
        let i =
            particles.length - 1;
        i >= 0;
        i--
    ) {

        const p =
            particles[i];


        p.vx *=
            p.drag;

        p.vy *=
            p.drag;


        p.vy +=
            p.gravity;


        p.x +=
            p.vx;

        p.y +=
            p.vy;


        p.life--;


        if (
            p.crackle &&
            Math.random() <
                0.025
        ) {

            for (
                let j = 0;
                j < 3;
                j++
            ) {

                const angle =
                    random(
                        0,
                        Math.PI * 2
                    );


                const speed =
                    random(
                        1,
                        3
                    );


                particles.push({

                    x: p.x,
                    y: p.y,

                    vx:
                        Math.cos(angle) *
                        speed,

                    vy:
                        Math.sin(angle) *
                        speed,

                    gravity:
                        0.035,

                    drag:
                        0.96,

                    life:
                        random(
                            20,
                            40
                        ),

                    maxLife:
                        40,

                    size:
                        random(
                            0.8,
                            1.8
                        ),

                    color:
                        "#ffffff",

                    twinkle:
                        Math.random() *
                        Math.PI *
                        2
                });
            }
        }


        if (
            p.life <= 0
        ) {

            particles.splice(
                i,
                1
            );
        }
    }
}


/* =========================================================
   ROCKET UPDATE
========================================================= */

function updateRockets() {

    for (
        let i =
            rockets.length - 1;
        i >= 0;
        i--
    ) {

        const r =
            rockets[i];


        r.age++;


        if (
            r.age < 0
        ) {

            continue;
        }


        r.trail.push({

            x: r.x,
            y: r.y

        });


        if (
            r.trail.length >
            9
        ) {

            r.trail.shift();
        }


        r.x +=
            r.vx;

        r.y +=
            r.vy;


        r.vy +=
            0.018;


        const dx =
            r.targetX -
            r.x;


        const dy =
            r.targetY -
            r.y;


        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        if (
            distance < 18 ||
            r.y <= r.targetY
        ) {

            if (
                !r.exploded
            ) {

                r.exploded =
                    true;


                if (
                    r.type === "text"
                ) {

                    createTextExplosion(
                        r
                    );

                } else {

                    createExplosion(
                        r
                    );
                }
            }


            rockets.splice(
                i,
                1
            );
        }
    }
}


/* =========================================================
   DRAW ROCKETS
========================================================= */

function drawRockets() {

    for (
        const r of rockets
    ) {

        if (
            r.age < 0
        ) {

            continue;
        }


        for (
            let i = 0;
            i < r.trail.length;
            i++
        ) {

            const point =
                r.trail[i];


            const alpha =
                i /
                r.trail.length;


            ctx.globalAlpha =
                alpha *
                0.55;


            ctx.fillStyle =
                "#ffffff";


            ctx.beginPath();


            ctx.arc(
                point.x,
                point.y,
                1.5,
                0,
                Math.PI * 2
            );


            ctx.fill();
        }


        ctx.globalAlpha =
            1;


        ctx.fillStyle =
            "#ffffff";


        ctx.beginPath();


        ctx.arc(
            r.x,
            r.y,
            2.2,
            0,
            Math.PI * 2
        );


        ctx.fill();
    }
}


/* =========================================================
   DRAW NORMAL PARTICLES
========================================================= */

function drawParticles() {

    for (
        const p of particles
    ) {

        const alpha =
            clamp(
                p.life /
                p.maxLife,
                0,
                1
            );


        const twinkle =
            0.65 +
            0.35 *
            Math.sin(
                p.twinkle +
                performance.now() *
                0.015
            );


        ctx.globalAlpha =
            alpha *
            twinkle;


        ctx.fillStyle =
            p.color;


        ctx.beginPath();


        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );


        ctx.fill();
    }
}


/* =========================================================
   DRAW TEXT PARTICLES
========================================================= */

function drawTextParticles() {

    for (
        const p of textParticles
    ) {

        let alpha =
            1;


        /*
            Loose explosion sparks fade
            toward the end of their life.
        */

        if (
            p.loose
        ) {

            alpha =
                clamp(
                    1 -
                    p.life /
                    78,
                    0,
                    1
                );
        }


        /*
            Tiny natural sparkle.
        */

        const sparkle =
            0.72 +
            0.28 *
            Math.sin(
                p.phase +
                performance.now() *
                0.018
            );


        ctx.globalAlpha =
            alpha *
            sparkle;


        /*
            Draw the tiny firework trail.
        */

        if (
            p.trail.length > 1
        ) {

            ctx.beginPath();

            ctx.moveTo(
                p.trail[0].x,
                p.trail[0].y
            );


            for (
                let i = 1;
                i < p.trail.length;
                i++
            ) {

                ctx.lineTo(
                    p.trail[i].x,
                    p.trail[i].y
                );
            }


            ctx.strokeStyle =
                p.color;

            ctx.lineWidth =
                Math.max(
                    0.45,
                    p.size * 0.55
                );

            ctx.stroke();
        }


        /*
            Main tiny spark.
        */

        ctx.fillStyle =
            p.color;


        ctx.beginPath();


        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );


        ctx.fill();


        /*
            Bright white-hot core on some sparks.
        */

        if (
            p.bright
        ) {

            ctx.globalAlpha =
                alpha *
                sparkle *
                0.85;


            ctx.fillStyle =
                "#ffffff";


            ctx.beginPath();


            ctx.arc(
                p.x,
                p.y,
                p.size *
                0.42,
                0,
                Math.PI * 2
            );


            ctx.fill();
        }
    }
}


/* =========================================================
   SHOW SETTINGS
========================================================= */

const SHOW_DURATION =
    5 *
    60 *
    1000;


const FIREWORK_BUFFER =
    400;


const MIN_LAUNCH_INTERVAL =
    550;


const MAX_LAUNCH_INTERVAL =
    800;


const MAX_ROCKETS =
    28;


const MAX_PARTICLES =
    3400;


/*
    Higher than the old limit because the
    letters themselves are made from sparks,
    plus loose explosion sparks.
*/

const MAX_TEXT_PARTICLES =
    900;


/* =========================================================
   SHOW STATE
========================================================= */

let showRunning =
    false;

let finaleRunning =
    false;

let showFinished =
    false;

let showStartTime =
    0;

let nextLaunchTime =
    0;

let nextSpecialTime =
    0;

let showItemIndex =
    0;

let birthdayName =
    "ZAYDEN";


/* =========================================================
   LAUNCH SHOW ITEM
========================================================= */

function launchShowItem(
    intensity = 1
) {

    if (
        rockets.length >=
        MAX_ROCKETS
    ) {

        return;
    }


    const item =
        showItems[
            showItemIndex %
            showItems.length
        ];


    showItemIndex++;


    const count =
        Math.min(
            item.count,
            MAX_ROCKETS -
            rockets.length
        );


    for (
        let i = 0;
        i < count;
        i++
    ) {

        const targetX =
            random(
                width * 0.10,
                width * 0.90
            );


        const targetY =
            random(
                height * 0.13,
                height * 0.56
            );


        createRocket(
            targetX,
            targetY,
            palettes[
                item.palette %
                palettes.length
            ],
            item.type,
            random(
                0.9,
                1.12
            ) *
            intensity
        );
    }
}


/* =========================================================
   SPECIAL SEQUENCE
========================================================= */

function specialSequence(
    intensity = 1
) {

    const sequence =
        randomInt(
            0,
            5
        );


    if (
        sequence === 0
    ) {

        for (
            let i = 0;
            i < 4;
            i++
        ) {

            setTimeout(
                () => {

                    if (
                        showRunning &&
                        rockets.length <
                            MAX_ROCKETS
                    ) {

                        launchShowItem(
                            intensity
                        );
                    }

                },
                i * 220
            );
        }


    } else if (
        sequence === 1
    ) {

        const palette =
            randomInt(
                0,
                palettes.length - 1
            );


        for (
            let i = 0;
            i < 5;
            i++
        ) {

            setTimeout(
                () => {

                    if (
                        showRunning &&
                        rockets.length <
                            MAX_ROCKETS
                    ) {

                        createRocket(
                            width *
                                (
                                    0.20 +
                                    i *
                                    0.15
                                ),
                            random(
                                height * 0.18,
                                height * 0.48
                            ),
                            palettes[
                                palette
                            ],
                            i % 2 === 0
                                ? "ring"
                                : "sphere",
                            intensity
                        );
                    }

                },
                i * 170
            );
        }


    } else if (
        sequence === 2
    ) {

        for (
            let i = 0;
            i < 3;
            i++
        ) {

            setTimeout(
                () => {

                    if (
                        showRunning
                    ) {

                        createRocket(
                            random(
                                width * 0.20,
                                width * 0.80
                            ),
                            random(
                                height * 0.18,
                                height * 0.43
                            ),
                            palettes[
                                randomInt(
                                    0,
                                    palettes.length - 1
                                )
                            ],
                            "doubleRing",
                            intensity
                        );
                    }

                },
                i * 280
            );
        }


    } else if (
        sequence === 3
    ) {

        for (
            let i = 0;
            i < 6;
            i++
        ) {

            setTimeout(
                () => {

                    if (
                        showRunning
                    ) {

                        createRocket(
                            random(
                                width * 0.08,
                                width * 0.92
                            ),
                            random(
                                height * 0.18,
                                height * 0.55
                            ),
                            palettes[
                                randomInt(
                                    0,
                                    palettes.length - 1
                                )
                            ],
                            pick([
                                "sphere",
                                "ring",
                                "peony",
                                "chrysanthemum"
                            ]),
                            intensity
                        );
                    }

                },
                i * 130
            );
        }


    } else if (
        sequence === 4
    ) {

        for (
            let i = 0;
            i < 5;
            i++
        ) {

            setTimeout(
                () => {

                    if (
                        showRunning
                    ) {

                        createRocket(
                            random(
                                width * 0.15,
                                width * 0.85
                            ),
                            random(
                                height * 0.15,
                                height * 0.50
                            ),
                            palettes[
                                randomInt(
                                    0,
                                    palettes.length - 1
                                )
                            ],
                            pick([
                                "willow",
                                "golden",
                                "crackle"
                            ]),
                            intensity
                        );
                    }

                },
                i * 190
            );
        }


    } else {

        for (
            let i = 0;
            i < 7;
            i++
        ) {

            setTimeout(
                () => {

                    if (
                        showRunning
                    ) {

                        createRocket(
                            random(
                                width * 0.05,
                                width * 0.95
                            ),
                            random(
                                height * 0.12,
                                height * 0.52
                            ),
                            palettes[
                                randomInt(
                                    0,
                                    palettes.length - 1
                                )
                            ],
                            pick([
                                "sphere",
                                "ring",
                                "doubleRing",
                                "spiral",
                                "cross"
                            ]),
                            intensity
                        );
                    }

                },
                i * 110
            );
        }
    }
}


/* =========================================================
   MAIN SHOW SCHEDULER
========================================================= */

function scheduleMainShow(
    now
) {

    if (
        !showRunning
    ) {

        return;
    }


    const elapsed =
        now -
        showStartTime;


    if (
        elapsed >=
        SHOW_DURATION
    ) {

        beginFinale();

        return;
    }


    const progress =
        elapsed /
        SHOW_DURATION;


    let intensity =
        0.95;


    if (
        progress >
        0.55
    ) {

        intensity =
            1.05;
    }


    if (
        progress >
        0.70
    ) {

        intensity =
            1.12;
    }


    if (
        progress >
        0.80
    ) {

        intensity =
            1.20;
    }


    if (
        progress >
        0.93
    ) {

        intensity =
            1.30;
    }


    if (
        now +
        FIREWORK_BUFFER >=
        nextLaunchTime
    ) {

        launchShowItem(
            intensity
        );


        nextLaunchTime =
            now +
            random(
                MIN_LAUNCH_INTERVAL,
                MAX_LAUNCH_INTERVAL
            );
    }


    if (
        now +
        FIREWORK_BUFFER >=
        nextSpecialTime
    ) {

        specialSequence(
            intensity
        );


        nextSpecialTime =
            now +
            random(
                2600,
                5200
            );
    }


    if (
        progress >
        0.92 &&
        Math.random() <
            0.025
    ) {

        specialSequence(
            intensity * 1.12
        );
    }
}


/* =========================================================
   FINALE
========================================================= */

function beginFinale() {

    if (
        finaleRunning ||
        showFinished
    ) {

        return;
    }


    showRunning =
        false;

    finaleRunning =
        true;


    rockets.length = 0;
    particles.length = 0;
    textParticles.length = 0;


    const finalePalette = [
        "#ffffff",
        "#ffe066",
        "#74c0fc",
        "#ff6b6b"
    ];


    const centerX =
        width / 2;


    const centerY =
        height * 0.38;


    /*
        HAPPY
    */

    const happyTargets =
        createLetterTargets(
            "HAPPY"
        );


    createTextRocket(
        centerX,
        centerY,
        finalePalette,
        happyTargets,
        0
    );


    /*
        BIRTHDAY
    */

    setTimeout(
        () => {

            if (
                !finaleRunning
            ) {

                return;
            }


            textParticles.length = 0;


            const birthdayTargets =
                createLetterTargets(
                    "BIRTHDAY"
                );


            createTextRocket(
                centerX,
                centerY,
                finalePalette,
                birthdayTargets,
                0
            );

        },
        5000
    );


    /*
        NAME
    */

    setTimeout(
        () => {

            if (
                !finaleRunning
            ) {

                return;
            }


            textParticles.length = 0;


            const nameTargets =
                createLetterTargets(
                    birthdayName
                );


            createTextRocket(
                centerX,
                centerY,
                finalePalette,
                nameTargets,
                0
            );

        },
        9700
    );


    /*
        Name gets a second larger presentation.
    */

    setTimeout(
        () => {

            if (
                !finaleRunning
            ) {

                return;
            }


            textParticles.length = 0;


            const nameTargets =
                createLetterTargets(
                    birthdayName
                );


            createTextRocket(
                centerX,
                centerY,
                finalePalette,
                nameTargets,
                0
            );

        },
        13500
    );


    /*
        End the show.
    */

    setTimeout(
        () => {

            finaleRunning =
                false;

            showFinished =
                true;

            textParticles.length = 0;

        },
        18100
    );
}


/* =========================================================
   MAIN LOOP
========================================================= */

function drawBackground() {

    ctx.globalCompositeOperation =
        "source-over";


    ctx.fillStyle =
        "rgba(0, 0, 8, 0.22)";


    ctx.fillRect(
        0,
        0,
        width,
        height
    );
}


function animate(
    now
) {

    requestAnimationFrame(
        animate
    );


    drawBackground();


    ctx.globalCompositeOperation =
        "lighter";


    if (
        showRunning
    ) {

        scheduleMainShow(
            now
        );
    }


    updateRockets();

    updateParticles();

    updateTextParticles();


    drawRockets();

    drawParticles();

    drawTextParticles();


    ctx.globalAlpha =
        1;

    ctx.globalCompositeOperation =
        "source-over";
}


requestAnimationFrame(
    animate
);


/* =========================================================
   START SHOW
========================================================= */

const startScreen =
    document.getElementById(
        "startScreen"
    );


const nameInput =
    document.getElementById(
        "nameInput"
    );


const startButton =
    document.getElementById(
        "startButton"
    );


function sanitizeName(
    value
) {

    return value
        .toUpperCase()
        .replace(
            /[^A-Z ]/g,
            ""
        )
        .replace(
            /\s+/g,
            " "
        )
        .trim()
        .slice(
            0,
            20
        );
}


function startShow() {

    initAudio();


    const enteredName =
        sanitizeName(
            nameInput.value
        );


    birthdayName =
        enteredName ||
        "ZAYDEN";


    startScreen.classList.add(
        "hidden"
    );


    rockets.length = 0;
    particles.length = 0;
    textParticles.length = 0;


    showRunning =
        true;

    finaleRunning =
        false;

    showFinished =
        false;


    showItemIndex =
        0;


    showStartTime =
        performance.now();


    const now =
        showStartTime;


    nextLaunchTime =
        now +
        250;


    nextSpecialTime =
        now +
        random(
            1800,
            3000
        );
}


startButton.addEventListener(
    "click",
    startShow
);


nameInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Enter"
        ) {

            startShow();
        }
    }
);


/* =========================================================
   TOUCH / GESTURE PROTECTION
========================================================= */

document.addEventListener(
    "touchmove",
    event => {

        event.preventDefault();

    },
    {
        passive: false
    }
);


document.addEventListener(
    "gesturestart",
    event => {

        event.preventDefault();

    },
    {
        passive: false
    }
);


document.addEventListener(
    "dblclick",
    event => {

        event.preventDefault();

    },
    {
        passive: false
    }
);

</script>
