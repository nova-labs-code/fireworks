<script>
"use strict";

/* =========================================================
   CANVAS
========================================================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let width = 0;
let height = 0;
let dpr = 1;

function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);

    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resize);
resize();


/* =========================================================
   AUDIO
========================================================= */

let audioContext = null;
let masterGain = null;
let audioReady = false;

const FIREWORK_AUDIO_BUFFER = 0.4;

function initAudio() {

    if (audioReady) {
        if (
            audioContext &&
            audioContext.state === "suspended"
        ) {
            audioContext.resume();
        }

        return;
    }

    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

    if (!AudioContext) {
        return;
    }

    audioContext = new AudioContext();

    masterGain =
        audioContext.createGain();

    masterGain.gain.value = 0.24;

    masterGain.connect(
        audioContext.destination
    );

    audioReady = true;

    if (audioContext.state === "suspended") {
        audioContext.resume();
    }
}


/* =========================================================
   AUDIO HELPERS
========================================================= */

function audioTime() {

    if (!audioContext) {
        return 0;
    }

    return (
        audioContext.currentTime +
        FIREWORK_AUDIO_BUFFER / 1000
    );
}


function createNoiseBuffer(duration) {

    const sampleRate =
        audioContext.sampleRate;

    const length =
        Math.max(
            1,
            Math.floor(
                sampleRate * duration
            )
        );

    const buffer =
        audioContext.createBuffer(
            1,
            length,
            sampleRate
        );

    const data =
        buffer.getChannelData(0);

    for (let i = 0; i < length; i++) {
        data[i] =
            Math.random() * 2 - 1;
    }

    return buffer;
}


/* =========================================================
   ROCKET WHISTLE
========================================================= */

function playRocketSound(intensity = 1) {

    if (!audioReady) {
        return;
    }

    const now =
        audioTime();

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    const filter =
        audioContext.createBiquadFilter();

    oscillator.type = "sine";

    oscillator.frequency.setValueAtTime(
        random(420, 650),
        now
    );

    oscillator.frequency.exponentialRampToValueAtTime(
        random(1250, 1900),
        now + random(0.34, 0.62)
    );

    filter.type = "lowpass";

    filter.frequency.setValueAtTime(
        2800,
        now
    );

    gain.gain.setValueAtTime(
        0.0001,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        0.045 * intensity,
        now + 0.035
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + 0.58
    );

    oscillator.connect(filter);
    filter.connect(gain);
    gain.connect(masterGain);

    oscillator.start(now);
    oscillator.stop(now + 0.62);
}


/* =========================================================
   FIREWORK BOOM
========================================================= */

function playBoom(
    type = "normal",
    intensity = 1
) {

    if (!audioReady) {
        return;
    }

    const now =
        audioTime();

    let duration = 0.65;
    let startFrequency = 75;
    let endFrequency = 34;
    let volume = 0.19;

    if (type === "doubleRing") {
        duration = 0.78;
        startFrequency = 82;
        endFrequency = 30;
        volume = 0.22;
    }

    if (type === "willow") {
        duration = 0.85;
        startFrequency = 65;
        endFrequency = 27;
        volume = 0.15;
    }

    if (type === "crackle") {
        duration = 0.48;
        startFrequency = 90;
        endFrequency = 38;
        volume = 0.16;
    }

    if (type === "golden") {
        duration = 0.82;
        startFrequency = 70;
        endFrequency = 28;
        volume = 0.19;
    }

    if (type === "text") {
        duration = 0.95;
        startFrequency = 70;
        endFrequency = 24;
        volume = 0.24;
    }

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    const filter =
        audioContext.createBiquadFilter();

    oscillator.type = "sine";

    oscillator.frequency.setValueAtTime(
        startFrequency,
        now
    );

    oscillator.frequency.exponentialRampToValueAtTime(
        endFrequency,
        now + duration
    );

    filter.type = "lowpass";

    filter.frequency.setValueAtTime(
        420,
        now
    );

    filter.frequency.exponentialRampToValueAtTime(
        85,
        now + duration
    );

    gain.gain.setValueAtTime(
        0.0001,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        volume * intensity,
        now + 0.012
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + duration
    );

    oscillator.connect(filter);
    filter.connect(gain);
    gain.connect(masterGain);

    oscillator.start(now);
    oscillator.stop(now + duration + 0.03);
}


/* =========================================================
   CRACKLE SOUND
========================================================= */

function playCrackle(
    amount = 12,
    intensity = 1
) {

    if (!audioReady) {
        return;
    }

    const now =
        audioTime();

    const buffer =
        createNoiseBuffer(0.035);

    for (let i = 0; i < amount; i++) {

        const source =
            audioContext.createBufferSource();

        const filter =
            audioContext.createBiquadFilter();

        const gain =
            audioContext.createGain();

        const start =
            now +
            random(0.04, 0.55);

        source.buffer =
            buffer;

        filter.type =
            "bandpass";

        filter.frequency.value =
            random(1500, 5000);

        filter.Q.value =
            random(0.5, 2.5);

        gain.gain.setValueAtTime(
            0.0001,
            start
        );

        gain.gain.exponentialRampToValueAtTime(
            random(0.012, 0.035) *
            intensity,
            start + 0.003
        );

        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            start + 0.035
        );

        source.connect(filter);
        filter.connect(gain);
        gain.connect(masterGain);

        source.start(start);
        source.stop(start + 0.04);
    }
}


/* =========================================================
   RING TONE
========================================================= */

function playRingTone(
    doubleRing = false,
    intensity = 1
) {

    if (!audioReady) {
        return;
    }

    const now =
        audioTime();

    const frequencies =
        doubleRing
            ? [420, 590, 780]
            : [500, 690];

    frequencies.forEach(
        (frequency, index) => {

            const oscillator =
                audioContext.createOscillator();

            const gain =
                audioContext.createGain();

            oscillator.type =
                "sine";

            oscillator.frequency.value =
                frequency;

            const start =
                now +
                index * 0.015;

            const duration =
                doubleRing
                    ? 0.65
                    : 0.48;

            gain.gain.setValueAtTime(
                0.0001,
                start
            );

            gain.gain.exponentialRampToValueAtTime(
                0.028 * intensity,
                start + 0.008
            );

            gain.gain.exponentialRampToValueAtTime(
                0.0001,
                start + duration
            );

            oscillator.connect(gain);
            gain.connect(masterGain);

            oscillator.start(start);
            oscillator.stop(
                start + duration + 0.02
            );
        }
    );
}


/* =========================================================
   SPECIAL FIREWORK SOUND
========================================================= */

function playFireworkSound(
    type,
    intensity = 1
) {

    playBoom(
        type,
        intensity
    );

    if (
        type === "ring" ||
        type === "doubleRing"
    ) {

        playRingTone(
            type === "doubleRing",
            intensity
        );
    }

    if (
        type === "crackle" ||
        type === "chrysanthemum"
    ) {

        playCrackle(
            type === "crackle"
                ? 18
                : 8,
            intensity
        );
    }

    if (type === "willow") {

        playCrackle(
            7,
            intensity * 0.65
        );
    }

    if (type === "golden") {

        playCrackle(
            10,
            intensity * 0.75
        );
    }

    if (type === "rainbow") {

        playRingTone(
            false,
            intensity * 0.9
        );
    }
}

/* =========================================================
   HELPERS
========================================================= */

function random(min, max) {
    return Math.random() *
        (max - min) +
        min;
}

function randomInt(min, max) {
    return Math.floor(
        random(min, max + 1)
    );
}

function pick(array) {
    return array[
        Math.floor(
            Math.random() *
            array.length
        )
    ];
}

function clamp(value, min, max) {
    return Math.max(
        min,
        Math.min(max, value)
    );
}

/* =========================================================
   ROCKET CREATION
========================================================= */

function createRocket(
    targetX,
    targetY,
    palette,
    type,
    power = 1,
    text = null,
    delay = 0
) {

    const startX =
        random(
            width * 0.08,
            width * 0.92
        );

    const startY =
        height +
        random(15, 80);

    const dx =
        targetX - startX;

    const dy =
        targetY - startY;

    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );

    const speed =
        random(8.5, 11.5) *
        power;

    const rocket = {

        x: startX,
        y: startY,

        vx:
            (dx / distance) *
            speed,

        vy:
            (dy / distance) *
            speed,

        targetX,
        targetY,

        palette,
        type,

        age: -delay,

        trail: [],

        text,
        exploded: false
    };

    rockets.push(
        rocket
    );

    playRocketSound(
        Math.min(power, 1.5)
    );
}


/* =========================================================
   EXPLOSION
========================================================= */

function createExplosion(
    rocket
) {

    const {
        x,
        y,
        palette,
        type
    } = rocket;

    const baseCount = {

        sphere: 110,
        ring: 120,
        doubleRing: 105,
        willow: 130,
        crackle: 125,
        chrysanthemum: 145,
        peony: 125,
        fan: 100,
        heart: 105,
        spiral: 120,
        cross: 115,
        rainbow: 150,
        golden: 135

    }[type] || 110;

    const count =
        Math.floor(
            baseCount *
            random(0.82, 1.12)
        );

    for (
        let i = 0;
        i < count;
        i++
    ) {

        let angle;
        let speed;

        if (type === "ring") {

            angle =
                (
                    Math.PI * 2 * i /
                    count
                ) +
                random(-0.025, 0.025);

            speed =
                random(3.2, 5.8);

        } else if (
            type === "doubleRing"
        ) {

            const ring =
                i % 2 === 0
                    ? 0
                    : 1;

            angle =
                (
                    Math.PI * 2 *
                    Math.floor(i / 2) /
                    Math.ceil(count / 2)
                ) +
                random(-0.025, 0.025);

            speed =
                ring === 0
                    ? random(3.0, 4.4)
                    : random(5.2, 6.8);

        } else if (
            type === "fan"
        ) {

            angle =
                Math.PI *
                random(1.08, 1.92);

            speed =
                random(3.5, 7);

        } else if (
            type === "heart"
        ) {

            const t =
                (
                    Math.PI * 2 * i
                ) / count;

            const hx =
                16 *
                Math.pow(
                    Math.sin(t),
                    3
                );

            const hy =
                -(
                    13 *
                    Math.cos(t)
                    -
                    5 *
                    Math.cos(2 * t)
                    -
                    2 *
                    Math.cos(3 * t)
                    -
                    Math.cos(4 * t)
                );

            const scale =
                random(0.20, 0.34);

            particles.push({

                x,
                y,

                vx:
                    hx * scale,

                vy:
                    hy * scale,

                gravity: 0.012,
                drag: 0.985,

                life:
                    random(100, 150),

                maxLife: 150,

                size:
                    random(1.1, 2.5),

                color:
                    pick(palette),

                twinkle:
                    Math.random() *
                    Math.PI * 2
            });

            continue;
        } else if (
            type === "spiral"
        ) {

            angle =
                i * 0.21 +
                random(-0.03, 0.03);

            speed =
                2.4 +
                (i / count) * 4.2;

        } else if (
            type === "cross"
        ) {

            const arm =
                i % 4;

            angle =
                arm *
                Math.PI / 2 +
                random(-0.055, 0.055);

            speed =
                random(3.0, 6.5);

        } else if (
            type === "rainbow"
        ) {

            angle =
                (
                    Math.PI * 2 * i /
                    count
                ) +
                random(-0.025, 0.025);

            speed =
                random(3.0, 6.2);

        } else if (
            type === "golden"
        ) {

            angle =
                random(0, Math.PI * 2);

            speed =
                random(2.4, 6.4);

        } else if (
            type === "willow"
        ) {

            angle =
                random(0, Math.PI * 2);

            speed =
                random(2.2, 5.4);

        } else if (
            type === "crackle"
        ) {

            angle =
                random(0, Math.PI * 2);

            speed =
                random(2.7, 6.4);

        } else {

            angle =
                random(0, Math.PI * 2);

            speed =
                random(2.8, 6.5);
        }

        const vx =
            Math.cos(angle) *
            speed;

        const vy =
            Math.sin(angle) *
            speed;

        let gravity =
            0.025;

        let drag =
            0.982;

        let life =
            random(72, 125);

        if (type === "willow") {

            gravity =
                random(
                    0.035,
                    0.055
                );

            drag =
                random(
                    0.975,
                    0.988
                );

            life =
                random(
                    125,
                    190
                );
        }

        if (type === "crackle") {

            gravity =
                0.032;

            drag =
                0.979;

            life =
                random(
                    75,
                    120
                );
        }

        if (type === "golden") {

            gravity =
                random(
                    0.025,
                    0.045
                );

            drag =
                0.983;

            life =
                random(
                    110,
                    175
                );
        }

        particles.push({

            x,
            y,

            vx,
            vy,

            gravity,
            drag,

            life,
            maxLife: life,

            size:
                type === "crackle"
                    ? random(1.0, 2.3)
                    : random(1.2, 2.7),

            color:
                type === "rainbow"
                    ? `hsl(${
                        Math.floor(
                            (
                                i /
                                count
                            ) *
                            360
                        )
                    },100%,70%)`
                    : pick(palette),

            twinkle:
                Math.random() *
                Math.PI * 2,

            crackle:
                type === "crackle"
        });
    }

    /*
        Bright central flash.
    */

    for (let i = 0; i < 20; i++) {

        const angle =
            random(
                0,
                Math.PI * 2
            );

        const speed =
            random(
                0.5,
                3.2
            );

        particles.push({

            x,
            y,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            gravity: 0.01,
            drag: 0.94,

            life:
                random(15, 28),

            maxLife: 28,

            size:
                random(1.5, 3.5),

            color: "#ffffff",

            twinkle:
                Math.random() *
                Math.PI * 2
        });
    }

    playFireworkSound(
        type,
        1
    );
}

/* =========================================================
   TEXT TARGETS
========================================================= */

function createLetterTargets(text) {

    text =
        text
            .toUpperCase()
            .replace(
                /[^A-Z ]/g,
                ""
            );

    if (!text) {
        text = "ZAYDEN";
    }

    const cell =
        clamp(
            Math.min(
                22,
                width /
                    Math.max(
                        text.length *
                        6.2,
                        1
                    ),
                height / 10
            ),
            7,
            22
        );

    const letterWidth =
        5 * cell;

    const spacing =
        cell * 1.35;

    const totalWidth =
        text.length *
        letterWidth +
        Math.max(
            0,
            text.length - 1
        ) *
        spacing;

    const startX =
        (width - totalWidth) /
        2;

    const startY =
        height * 0.38;

    const targets = [];

    for (
        let letterIndex = 0;
        letterIndex < text.length;
        letterIndex++
    ) {

        const letter =
            FONT[
                text[
                    letterIndex
                ]
            ] ||
            FONT[" "];

        const offsetX =
            startX +
            letterIndex *
            (
                letterWidth +
                spacing
            );

        for (
            let row = 0;
            row < 7;
            row++
        ) {

            for (
                let col = 0;
                col < 5;
                col++
            ) {

                if (
                    letter[row][col] ===
                    "1"
                ) {

                    targets.push({

                        x:
                            offsetX +
                            col * cell +
                            cell / 2,

                        y:
                            startY +
                            row * cell +
                            cell / 2
                    });
                }
            }
        }
    }

    return targets;
}


/* =========================================================
   TEXT ROCKET
========================================================= */

function createTextRocket(
    targetX,
    targetY,
    palette,
    textTargets,
    delay = 0
) {

    const startX =
        random(
            width * 0.15,
            width * 0.85
        );

    const startY =
        height + 50;

    const dx =
        targetX - startX;

    const dy =
        targetY - startY;

    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );

    const speed =
        9.5;

    rockets.push({

        x: startX,
        y: startY,

        vx:
            (dx / distance) *
            speed,

        vy:
            (dy / distance) *
            speed,

        targetX,
        targetY,

        palette,

        type: "text",

        age: -delay,

        trail: [],

        textTargets,

        exploded: false
    });

    playRocketSound(
        1.15
    );
}


/* =========================================================
   TEXT EXPLOSION
========================================================= */

function createTextExplosion(
    rocket
) {

    textParticles.length = 0;

    const targets =
        rocket.textTargets ||
        [];

    const palette =
        rocket.palette;

    if (!targets.length) {
        return;
    }

    const centerX =
        rocket.x;

    const centerY =
        rocket.y;

    for (
        let i = 0;
        i < targets.length &&
        textParticles.length <
            MAX_TEXT_PARTICLES;
        i++
    ) {

        const target =
            targets[i];

        const angle =
            random(
                0,
                Math.PI * 2
            );

        const distance =
            random(
                40,
                150
            );

        textParticles.push({

            x:
                centerX +
                Math.cos(angle) *
                distance,

            y:
                centerY +
                Math.sin(angle) *
                distance,

            vx:
                random(-1.5, 1.5),

            vy:
                random(-1.5, 1.5),

            targetX:
                target.x,

            targetY:
                target.y,

            life: 0,

            maxLife: 300,

            size:
                random(1.5, 3.0),

            color:
                pick(palette),

            phase:
                random(
                    0,
                    Math.PI * 2
                )
        });
    }

    for (let i = 0; i < 80; i++) {

        if (
            textParticles.length >=
            MAX_TEXT_PARTICLES
        ) {
            break;
        }

        const angle =
            random(
                0,
                Math.PI * 2
            );

        const speed =
            random(
                1.5,
                5.5
            );

        textParticles.push({

            x: centerX,
            y: centerY,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            targetX: centerX,
            targetY: centerY,

            life: 0,

            maxLife:
                random(35, 70),

            size:
                random(1, 2),

            color:
                pick(palette),

            phase:
                random(
                    0,
                    Math.PI * 2
                ),

            spark: true
        });
    }

    playFireworkSound(
        "text",
        1.25
    );
}


/* =========================================================
   TEXT PARTICLES UPDATE
========================================================= */

function updateTextParticles() {

    for (
        let i =
            textParticles.length - 1;
        i >= 0;
        i--
    ) {

        const p =
            textParticles[i];

        p.life++;

        if (p.spark) {

            p.x += p.vx;
            p.y += p.vy;

            p.vx *= 0.97;
            p.vy *= 0.97;

        } else {

            const dx =
                p.targetX -
                p.x;

            const dy =
                p.targetY -
                p.y;

            if (p.life < 38) {

                p.vx +=
                    dx * 0.035;

                p.vy +=
                    dy * 0.035;

                p.vx *= 0.82;
                p.vy *= 0.82;

                p.x += p.vx;
                p.y += p.vy;

            } else {

                p.x =
                    p.targetX +
                    Math.sin(
                        p.life * 0.09 +
                        p.phase
                    ) *
                    0.45;

                p.y =
                    p.targetY +
                    Math.cos(
                        p.life * 0.08 +
                        p.phase
                    ) *
                    0.45;
            }
        }

        if (
            p.life >
            p.maxLife
        ) {

            textParticles.splice(
                i,
                1
            );
        }
    }
}


/* =========================================================
   NORMAL PARTICLES UPDATE
========================================================= */

function updateParticles() {

    for (
        let i =
            particles.length - 1;
        i >= 0;
        i--
    ) {

        const p =
            particles[i];

        p.vx *= p.drag;
        p.vy *= p.drag;

        p.vy +=
            p.gravity;

        p.x += p.vx;
        p.y += p.vy;

        p.life--;

        if (
            p.crackle &&
            Math.random() < 0.025
        ) {

            for (
                let j = 0;
                j < 3;
                j++
            ) {

                const angle =
                    random(
                        0,
                        Math.PI * 2
                    );

                const speed =
                    random(
                        1,
                        3
                    );

                particles.push({

                    x: p.x,
                    y: p.y,

                    vx:
                        Math.cos(angle) *
                        speed,

                    vy:
                        Math.sin(angle) *
                        speed,

                    gravity: 0.035,
                    drag: 0.96,

                    life:
                        random(20, 40),

                    maxLife: 40,

                    size:
                        random(0.8, 1.8),

                    color: "#ffffff",

                    twinkle:
                        Math.random() *
                        Math.PI * 2
                });
            }
        }

        if (
            p.life <= 0
        ) {

            particles.splice(
                i,
                1
            );
        }
    }
}


/* =========================================================
   ROCKET UPDATE
========================================================= */

function updateRockets() {

    for (
        let i =
            rockets.length - 1;
        i >= 0;
        i--
    ) {

        const r =
            rockets[i];

        r.age++;

        if (r.age < 0) {
            continue;
        }

        r.trail.push({
            x: r.x,
            y: r.y
        });

        if (
            r.trail.length > 9
        ) {
            r.trail.shift();
        }

        r.x += r.vx;
        r.y += r.vy;

        r.vy += 0.018;

        const dx =
            r.targetX -
            r.x;

        const dy =
            r.targetY -
            r.y;

        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );

        if (
            distance < 18 ||
            r.y <= r.targetY
        ) {

            if (!r.exploded) {

                r.exploded = true;

                if (
                    r.type === "text"
                ) {

                    createTextExplosion(
                        r
                    );

                } else {

                    createExplosion(
                        r
                    );
                }
            }

            rockets.splice(
                i,
                1
            );
        }
    }
}


/* =========================================================
   DRAW ROCKETS
========================================================= */

function drawRockets() {

    for (const r of rockets) {

        if (r.age < 0) {
            continue;
        }

        for (
            let i = 0;
            i < r.trail.length;
            i++
        ) {

            const point =
                r.trail[i];

            const alpha =
                i /
                r.trail.length;

            ctx.globalAlpha =
                alpha * 0.55;

            ctx.fillStyle =
                "#ffffff";

            ctx.beginPath();

            ctx.arc(
                point.x,
                point.y,
                1.5,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }

        ctx.globalAlpha = 1;

        ctx.fillStyle =
            "#ffffff";

        ctx.beginPath();

        ctx.arc(
            r.x,
            r.y,
            2.2,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }
}


/* =========================================================
   DRAW PARTICLES
========================================================= */

function drawParticles() {

    for (const p of particles) {

        const alpha =
            clamp(
                p.life /
                p.maxLife,
                0,
                1
            );

        const twinkle =
            0.72 +
            Math.sin(
                p.life * 0.35 +
                p.twinkle
            ) *
            0.28;

        ctx.globalAlpha =
            alpha *
            twinkle;

        ctx.fillStyle =
            p.color;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.globalAlpha = 1;
}


/* =========================================================
   DRAW TEXT
========================================================= */

function drawTextParticles() {

    for (
        const p of textParticles
    ) {

        const alpha =
            p.spark
                ? clamp(
                    1 -
                    p.life /
                    p.maxLife,
                    0,
                    1
                )
                : 0.82 +
                  Math.sin(
                      p.life * 0.12 +
                      p.phase
                  ) *
                  0.18;

        ctx.globalAlpha =
            alpha;

        ctx.fillStyle =
            p.color;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fill();

        if (!p.spark) {

            ctx.globalAlpha =
                alpha * 0.25;

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                p.size * 3.5,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }
    }

    ctx.globalAlpha = 1;
}

        showItems[

            palettes.length

        random(

                height * 0.53
            );

            targetX,

        }
    }
}


/* =========================================================
   MAIN SHOW
========================================================= */

function scheduleMainShow(
    now
) {

    if (
        !showRunning ||
        finaleRunning
    ) {
        return;
    }

    const elapsed =
        now -
        showStartTime;

    const progress =
        clamp(
            elapsed /
            SHOW_DURATION,
            0,
            1
        );

    if (
        elapsed >=
        SHOW_DURATION
    ) {

        beginFinale();

        return;
    }

    let intensity = 1;

    if (progress > 0.55) {
        intensity += 0.18;
    }

    if (progress > 0.70) {
        intensity += 0.25;
    }

    if (progress > 0.80) {
        intensity += 0.65;
    }

    if (progress > 0.93) {
        intensity += 0.8;
    }

    if (
        now +
        FIREWORK_BUFFER >=
        nextLaunchTime
    ) {

        launchShowItem(
            intensity
        );

        nextLaunchTime =
            now +
            random(
                MIN_LAUNCH_INTERVAL,
                MAX_LAUNCH_INTERVAL
            );
    }

    if (
        now +
        FIREWORK_BUFFER >=
        nextSpecialTime
    ) {

        specialSequence(
            intensity
        );

        nextSpecialTime =
            now +
            random(
                2600,
                5200
            );
    }

    if (
        progress > 0.92 &&
        Math.random() < 0.018
    ) {

        specialSequence(
            intensity * 1.35
        );
    }
}


/* =========================================================
   FINALE
========================================================= */

function beginFinale() {

    if (
        finaleRunning ||
        showFinished
    ) {
        return;
    }

    showRunning = false;
    finaleRunning = true;

    rockets.length = 0;
    particles.length = 0;
    textParticles.length = 0;

    const palette = [
        "#ffffff",
        "#ffe066",
        "#74c0fc",
        "#ff6b6b"
    ];

    const happyTargets =
        createLetterTargets(
            "HAPPY"
        );

    const birthdayTargets =
        createLetterTargets(
            "BIRTHDAY"
        );

    const nameTargets =
        createLetterTargets(
            birthdayName
        );


    /* HAPPY */

    setTimeout(
        () => {

            createTextRocket(
                width * 0.50,
                height * 0.34,
                palette,
                happyTargets
            );

        },
        400
    );


    /* BIRTHDAY */

    setTimeout(
        () => {

            createTextRocket(
                width * 0.50,
                height * 0.34,
                palette,
                birthdayTargets
            );

        },
        5000
    );


    /* NAME */

    setTimeout(
        () => {

            createTextRocket(
                width * 0.50,
                height * 0.34,
                palette,
                nameTargets
            );

        },
        9700
    );


    /* FINAL NAME */

    setTimeout(
        () => {

            createTextRocket(
                width * 0.50,
                height * 0.34,
                palette,
                nameTargets
            );

        },
        13500
    );


    /* END */

    setTimeout(
        () => {

            finaleRunning = false;

            setTimeout(
                () => {
                    showFinished = true;
                },
                1600
            );

        },
        18100
    );
}


/* =========================================================
   BACKGROUND
========================================================= */

function drawBackground() {

    ctx.globalCompositeOperation =
        "source-over";

    ctx.fillStyle =
        "rgba(0, 0, 8, 0.22)";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );
}


/* =========================================================
   RENDER
========================================================= */

function draw() {

    drawBackground();

    ctx.globalCompositeOperation =
        "lighter";

    drawRockets();
    drawParticles();
    drawTextParticles();

    ctx.globalCompositeOperation =
        "source-over";

    ctx.globalAlpha = 1;
}


/* =========================================================
   MAIN LOOP
========================================================= */

function loop(now) {

    if (showRunning) {
        scheduleMainShow(
            now
        );
    }

    updateRockets();
    updateParticles();
    updateTextParticles();

    draw();

    requestAnimationFrame(
        loop
    );
}

requestAnimationFrame(
    loop
);


/* =========================================================
   START
========================================================= */

const startScreen =
    document.getElementById(
        "startScreen"
    );

const nameInput =
    document.getElementById(
        "nameInput"
    );

const startButton =
    document.getElementById(
        "startButton"
    );


function startShow() {

    if (
        showRunning ||
        finaleRunning
    ) {
        return;
    }

    /*
        Starting audio here is important:
        mobile browsers require a user gesture
        before Web Audio can play.
    */

    initAudio();

    let enteredName =
        nameInput.value
            .toUpperCase()
            .replace(
                /[^A-Z ]/g,
                ""
            )
            .replace(
                /\s+/g,
                " "
            )
            .trim()
            .slice(
                0,
                20
            );

    if (!enteredName) {
        enteredName =
            "ZAYDEN";
    }

    birthdayName =
        enteredName;

    startScreen.classList.add(
        "hidden"
    );

    rockets.length = 0;
    particles.length = 0;
    textParticles.length = 0;

    showItemIndex = 0;

    showRunning = true;
    finaleRunning = false;
    showFinished = false;

    showStartTime =
        performance.now();

    const now =
        showStartTime;

    nextLaunchTime =
        now + 100;

    nextSpecialTime =
        now + 1200;
}


startButton.addEventListener(
    "click",
    startShow
);


/* =========================================================
   ENTER TO START
========================================================= */

nameInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {
            startButton.click();
        }
    }
);


/* =========================================================
   TOUCH / GESTURE PREVENTION
========================================================= */

document.addEventListener(
    "touchmove",
    event => {
        event.preventDefault();
    },
    {
        passive: false
    }
);

document.addEventListener(
    "gesturestart",
    event => {
        event.preventDefault();
    }
);

document.addEventListener(
    "dblclick",
    event => {
        event.preventDefault();
    }
);

</script>
