<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<title>Birthday Fireworks</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    touch-action: none;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    position: relative;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #000;
}

#nameScreen {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background:
        radial-gradient(circle at 50% 35%, rgba(38, 80, 150, 0.24), transparent 45%),
        #000;
}

#nameBox {
    width: min(440px, 100%);
    padding: 30px;
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 24px;
    background: rgba(10,10,18,0.88);
    box-shadow:
        0 0 70px rgba(0,120,255,0.14),
        inset 0 0 30px rgba(255,255,255,0.025);
    text-align: center;
}

#nameBox h1 {
    margin: 0 0 10px;
    color: #fff;
    font-size: clamp(30px, 8vw, 46px);
    letter-spacing: 2px;
}

#nameBox p {
    margin: 0 0 22px;
    color: rgba(255,255,255,0.65);
    line-height: 1.5;
}

#nameInput {
    width: 100%;
    height: 54px;
    padding: 0 16px;
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 14px;
    outline: none;
    background: rgba(255,255,255,0.06);
    color: #fff;
    font-size: 18px;
    text-align: center;
}

#nameInput:focus {
    border-color: rgba(80,170,255,0.8);
    box-shadow: 0 0 25px rgba(30,130,255,0.16);
}

#startButton {
    width: 100%;
    height: 54px;
    margin-top: 12px;
    border: 0;
    border-radius: 14px;
    background: linear-gradient(135deg, #2979ff, #7c4dff);
    color: white;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.5px;
    cursor: pointer;
}

#startButton:active {
    transform: scale(0.98);
}

#showInfo {
    position: fixed;
    z-index: 10;
    top: max(16px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    padding: 8px 14px;
    border-radius: 999px;
    background: rgba(0,0,0,0.34);
    border: 1px solid rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.55);
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    pointer-events: none;
}

#finaleText {
    position: fixed;
    z-index: 15;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    color: white;
    font-size: clamp(42px, 12vw, 110px);
    font-weight: 900;
    letter-spacing: 5px;
    text-align: center;
    text-shadow:
        0 0 8px white,
        0 0 25px rgba(100,170,255,0.9),
        0 0 55px rgba(120,80,255,0.7);
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="nameScreen">
    <div id="nameBox">
        <h1>Birthday Fireworks</h1>

        <p>
            Enter the birthday person's name and enjoy a full
            five-minute digital fireworks show.
        </p>

        <input
            id="nameInput"
            type="text"
            maxlength="20"
            autocomplete="off"
            autocapitalize="characters"
            placeholder="Birthday Name"
        >

        <button id="startButton">
            Start Fireworks
        </button>
    </div>
</div>

<div id="showInfo">
    Birthday Firework Show
</div>

<div id="finaleText"></div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", {
    alpha: false
});

const nameScreen = document.getElementById("nameScreen");
const nameInput = document.getElementById("nameInput");
const startButton = document.getElementById("startButton");
const finaleText = document.getElementById("finaleText");

let width = 0;
let height = 0;
let dpr = 1;

function resizeCanvas() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);

    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();


/* =========================================================
   SHOW SETTINGS
========================================================= */

const SHOW_DURATION = 5 * 60 * 1000;

/*
    New fireworks are introduced about every 0.55–0.80 seconds.

    Because fireworks themselves remain on screen much longer
    than this, multiple bursts overlap continuously.
*/
const MIN_LAUNCH_INTERVAL = 550;
const MAX_LAUNCH_INTERVAL = 800;

const MAX_ROCKETS = 28;
const MAX_PARTICLES = 3400;

let showActive = false;
let showFinished = false;
let showStartTime = 0;
let showElapsed = 0;

let nextContinuousLaunch = 0;
let nextSpecialLaunch = 2500;

let birthdayName = "";
let finaleRunning = false;


/* =========================================================
   COLORS
========================================================= */

const palettes = [
    ["#ff1744", "#ff4081", "#ffffff"],
    ["#2979ff", "#00b0ff", "#ffffff"],
    ["#d500f9", "#7c4dff", "#ffffff"],
    ["#00e676", "#76ff03", "#ffffff"],
    ["#ffc107", "#ff9800", "#fff176"],
    ["#00e5ff", "#2979ff", "#ffffff"],
    ["#ff4081", "#d500f9", "#ffffff"],
    ["#ff7043", "#ff1744", "#fff176"],
    ["#536dfe", "#00e5ff", "#ffffff"],
    ["#c6ff00", "#00e676", "#fff176"],
    ["#ff00aa", "#7c4dff", "#00e5ff"],
    ["#ffffff", "#00e5ff", "#7c4dff"],
    ["#fff176", "#ffffff", "#ff9800"],
    ["#00bfa5", "#00e676", "#ffffff"],
    ["#ff3d71", "#ff1744", "#ffc107"],
    ["#651fff", "#d500f9", "#00e5ff"],
    ["#40c4ff", "#2979ff", "#7c4dff"],
    ["#ff6d00", "#ffab00", "#fff176"],
    ["#00e676", "#00b0ff", "#ffffff"],
    ["#ff4081", "#00e5ff", "#ffffff"]
];


/* =========================================================
   HELPERS
========================================================= */

function random(min, max) {
    return Math.random() * (max - min) + min;
}

function randomInt(min, max) {
    return Math.floor(random(min, max + 1));
}

function pick(array) {
    return array[Math.floor(Math.random() * array.length)];
}

function distance(x1, y1, x2, y2) {
    return Math.hypot(x2 - x1, y2 - y1);
}

function randomPalette() {
    return pick(palettes);
}

function randomTargetX() {
    return random(width * 0.08, width * 0.92);
}

function randomTargetY() {
    return random(height * 0.13, height * 0.52);
}


/* =========================================================
   ROCKET
========================================================= */

class Rocket {
    constructor(options = {}) {
        this.x = options.x ?? random(width * 0.1, width * 0.9);
        this.y = height + random(10, 35);

        this.targetX = options.targetX ?? randomTargetX();
        this.targetY = options.targetY ?? randomTargetY();

        this.color = options.color ?? pick(randomPalette());

        this.type = options.type || "sphere";

        this.speed = options.speed ?? random(8.5, 13.5);

        this.vx = 0;
        this.vy = -this.speed;

        this.gravity = options.gravity ?? 0.055;

        this.trail = [];
        this.maxTrail = randomInt(7, 13);

        this.dead = false;

        this.exploded = false;

        this.life = 0;
        this.delay = options.delay || 0;

        this.age = 0;

        this.hueShift = random(-20, 20);
    }

    update() {
        if (this.delay > 0) {
            this.delay--;
            return;
        }

        this.age++;

        this.trail.push({
            x: this.x,
            y: this.y
        });

        if (this.trail.length > this.maxTrail) {
            this.trail.shift();
        }

        const dx = this.targetX - this.x;
        const dy = this.targetY - this.y;

        const dist = Math.hypot(dx, dy);

        if (dist < 28 || this.vy > -1.5) {
            this.explode();
            this.dead = true;
            return;
        }

        const steer = 0.012;

        this.vx += dx * steer;
        this.vy += dy * steer;

        const velocity = Math.hypot(this.vx, this.vy);

        if (velocity > this.speed) {
            this.vx = this.vx / velocity * this.speed;
            this.vy = this.vy / velocity * this.speed;
        }

        this.x += this.vx;
        this.y += this.vy;

        this.vy += this.gravity;
    }

    draw() {
        if (this.delay > 0) return;

        ctx.save();

        for (let i = 0; i < this.trail.length; i++) {
            const point = this.trail[i];
            const alpha = i / this.trail.length;

            ctx.globalAlpha = alpha * 0.55;

            ctx.beginPath();
            ctx.arc(
                point.x,
                point.y,
                1 + alpha * 1.7,
                0,
                Math.PI * 2
            );

            ctx.fillStyle = this.color;
            ctx.fill();
        }

        ctx.globalAlpha = 1;

        ctx.shadowBlur = 18;
        ctx.shadowColor = this.color;

        ctx.beginPath();
        ctx.arc(this.x, this.y, 2.7, 0, Math.PI * 2);
        ctx.fillStyle = "#fff";
        ctx.fill();

        ctx.restore();
    }

    explode() {
        if (this.exploded) return;

        this.exploded = true;

        createExplosion(
            this.x,
            this.y,
            this.color,
            this.type
        );
    }
}


/* =========================================================
   PARTICLE
========================================================= */

class Particle {
    constructor(x, y, options = {}) {
        this.x = x;
        this.y = y;

        this.vx = options.vx ?? random(-3, 3);
        this.vy = options.vy ?? random(-3, 3);

        this.gravity = options.gravity ?? 0.035;

        this.drag = options.drag ?? 0.985;

        this.life = options.life ?? random(65, 115);
        this.maxLife = this.life;

        this.size = options.size ?? random(1, 2.8);

        this.color = options.color ?? "#ffffff";

        this.twinkle = options.twinkle ?? true;

        this.alpha = 1;

        this.type = options.type || "normal";

        this.decay = options.decay ?? random(0.008, 0.018);
    }

    update() {
        this.vx *= this.drag;
        this.vy *= this.drag;

        this.vy += this.gravity;

        this.x += this.vx;
        this.y += this.vy;

        this.life--;

        this.alpha = Math.max(
            0,
            this.life / this.maxLife
        );
    }

    draw() {
        if (this.alpha <= 0) return;

        let alpha = this.alpha;

        if (this.twinkle) {
            alpha *= 0.75 + Math.random() * 0.25;
        }

        ctx.globalAlpha = alpha;

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = this.color;
        ctx.fill();
    }

    get dead() {
        return this.life <= 0;
    }
}


/* =========================================================
   FIREWORK ARRAYS
========================================================= */

const rockets = [];
const particles = [];

function addRocket(options) {
    if (rockets.length >= MAX_ROCKETS) {
        rockets.shift();
    }

    rockets.push(new Rocket(options));
}

function addParticle(x, y, options) {
    if (particles.length >= MAX_PARTICLES) {
        particles.splice(
            0,
            Math.max(1, Math.floor(MAX_PARTICLES * 0.08))
        );
    }

    particles.push(
        new Particle(x, y, options)
    );
}


/* =========================================================
   SPECIAL PARTICLE EFFECTS
========================================================= */

function flash(x, y, color, radius = 45) {
    addParticle(x, y, {
        vx: 0,
        vy: 0,
        gravity: 0,
        drag: 1,
        life: 18,
        size: radius,
        color,
        twinkle: false,
        type: "flash"
    });
}

function createStarCore(x, y, color) {
    for (let i = 0; i < 20; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = random(1.5, 4);

        addParticle(x, y, {
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            gravity: 0.015,
            life: randomInt(35, 65),
            size: random(1.5, 3.2),
            color: "#ffffff"
        });
    }

    flash(x, y, color, 30);
}

function createRing(x, y, color, radius = 5) {
    const count = randomInt(45, 75);

    for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count;

        const speed = radius / 8;

        addParticle(x, y, {
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            gravity: 0.018,
            drag: 0.991,
            life: randomInt(70, 110),
            size: random(1.4, 2.7),
            color
        });
    }
}

function createWillow(x, y, color) {
    const count = randomInt(70, 110);

    for (let i = 0; i < count; i++) {
        const angle = random(0, Math.PI * 2);
        const speed = random(1.5, 5.4);

        addParticle(x, y, {
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - random(0.5, 2),
            gravity: random(0.055, 0.085),
            drag: 0.992,
            life: randomInt(120, 190),
            size: random(1.2, 2.5),
            color
        });
    }
}

function createCometBurst(x, y, colors) {
    const count = randomInt(18, 30);

    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = random(3, 7);

        const color = pick(colors);

        addParticle(x, y, {
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            gravity: 0.045,
            drag: 0.987,
            life: randomInt(85, 125),
            size: random(2, 3.4),
            color
        });
    }
}

function createCrackle(x, y, colors) {
    const count = randomInt(35, 60);

    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = random(1.5, 6);

        addParticle(x, y, {
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            gravity: 0.04,
            drag: 0.985,
            life: randomInt(25, 65),
            size: random(1.3, 2.6),
            color: pick(colors),
            twinkle: true
        });
    }
}


/* =========================================================
   EXPLOSION TYPES
========================================================= */

function createExplosion(x, y, color, type = "sphere") {
    const palette = randomPalette();

    let colors = [
        color,
        ...palette
    ];

    colors = [...new Set(colors)];

    const count = randomInt(65, 115);

    if (type === "ring") {
        createRing(x, y, color, random(28, 48));
        createStarCore(x, y, color);
        return;
    }

    if (type === "doubleRing") {
        createRing(x, y, color, 35);

        setTimeout(() => {
            if (!showActive && !finaleRunning) return;

            createRing(
                x,
                y,
                pick(colors),
                62
            );
        }, 100);

        createStarCore(x, y, color);
        return;
    }

    if (type === "willow") {
        createWillow(x, y, color);
        createStarCore(x, y, color);
        return;
    }

    if (type === "crackle") {
        createCometBurst(x, y, colors);
        createCrackle(x, y, colors);
        return;
    }

    if (type === "chrysanthemum") {
        for (let i = 0; i < count; i++) {
            const angle =
                Math.random() * Math.PI * 2;

            const speed =
                random(2.5, 6.5);

            addParticle(x, y, {
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                gravity: 0.025,
                drag: 0.989,
                life: randomInt(85, 140),
                size: random(1.2, 2.6),
                color: pick(colors)
            });
        }

        createStarCore(x, y, color);
        return;
    }

    if (type === "peony") {
        for (let i = 0; i < count + 30; i++) {
            const angle =
                Math.random() * Math.PI * 2;

            const speed =
                random(1.5, 5.8);

            addParticle(x, y, {
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                gravity: 0.02,
                drag: 0.988,
                life: randomInt(75, 120),
                size: random(1.5, 3),
                color: pick(colors)
            });
        }

        flash(x, y, color, 38);
        return;
    }

    if (type === "fan") {
        const direction = Math.random() > 0.5 ? -1 : 1;

        for (let i = 0; i < count; i++) {
            const angle =
                direction *
                random(
                    Math.PI * 0.08,
                    Math.PI * 0.92
                );

            const speed =
                random(2.5, 6.8);

            addParticle(x, y, {
                vx: Math.cos(angle) * speed,
                vy: -Math.abs(Math.sin(angle) * speed),
                gravity: 0.035,
                life: randomInt(75, 125),
                size: random(1.3, 2.8),
                color: pick(colors)
            });
        }

        createStarCore(x, y, color);
        return;
    }

    if (type === "heart") {
        for (let i = 0; i < count; i++) {
            const t =
                (Math.PI * 2 * i) / count;

            const hx =
                16 * Math.pow(Math.sin(t), 3);

            const hy =
                -(
                    13 * Math.cos(t) -
                    5 * Math.cos(2 * t) -
                    2 * Math.cos(3 * t) -
                    Math.cos(4 * t)
                );

            const scale = random(0.18, 0.32);

            addParticle(x, y, {
                vx: hx * scale,
                vy: hy * scale,
                gravity: 0.025,
                drag: 0.99,
                life: randomInt(75, 115),
                size: random(1.4, 2.8),
                color: pick(colors)
            });
        }

        createStarCore(x, y, color);
        return;
    }

    if (type === "spiral") {
        for (let i = 0; i < count + 30; i++) {
            const t = i * 0.34;

            const radius = i * 0.055;

            const angle =
                t + Math.random() * 0.2;

            const speed =
                2.3 + radius;

            addParticle(x, y, {
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                gravity: 0.02,
                drag: 0.99,
                life: randomInt(75, 125),
                size: random(1.2, 2.5),
                color: pick(colors)
            });
        }

        createStarCore(x, y, color);
        return;
    }

    if (type === "cross") {
        for (let i = 0; i < count; i++) {
            const axis =
                i % 2 === 0
                    ? 0
                    : Math.PI / 2;

            const angle =
                axis +
                (Math.random() - 0.5) * 0.18;

            const speed =
                random(2, 7);

            addParticle(x, y, {
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                gravity: 0.02,
                life: randomInt(75, 120),
                size: random(1.3, 2.8),
                color: pick(colors)
            });
        }

        createStarCore(x, y, color);
        return;
    }

    if (type === "saturn") {
        for (let i = 0; i < count; i++) {
            const angle =
                Math.random() * Math.PI * 2;

            const speed =
                random(2, 5.5);

            addParticle(x, y, {
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed * 0.55,
                gravity: 0.025,
                life: randomInt(75, 120),
                size: random(1.4, 2.6),
                color: pick(colors)
            });
        }

        for (let i = 0; i < 80; i++) {
            const angle =
                Math.random() * Math.PI * 2;

            const rx = 1.8;
            const ry = 0.42;

            addParticle(x, y, {
                vx: Math.cos(angle) * rx * random(3, 5),
                vy: Math.sin(angle) * ry * random(3, 5),
                gravity: 0.015,
                life: randomInt(80, 125),
                size: random(1.3, 2.5),
                color: pick(colors)
            });
        }

        createStarCore(x, y, color);
        return;
    }

    if (type === "rainbow") {
        const rainbow = [
            "#ff1744",
            "#ff9800",
            "#fff176",
            "#00e676",
            "#00e5ff",
            "#2979ff",
            "#d500f9"
        ];

        for (let i = 0; i < count + 50; i++) {
            const angle =
                Math.random() * Math.PI * 2;

            const speed =
                random(2, 6.2);

            addParticle(x, y, {
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                gravity: 0.025,
                drag: 0.989,
                life: randomInt(75, 125),
                size: random(1.4, 2.8),
                color: rainbow[
                    i % rainbow.length
                ]
            });
        }

        createStarCore(x, y, "#ffffff");
        return;
    }

    if (type === "golden") {
        const gold = [
            "#fff176",
            "#ffc107",
            "#ffb300",
            "#ff9800",
            "#ffffff"
        ];

        for (let i = 0; i < count + 35; i++) {
            const angle =
                Math.random() * Math.PI * 2;

            const speed =
                random(1.8, 5.7);

            addParticle(x, y, {
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                gravity: 0.04,
                drag: 0.989,
                life: randomInt(100, 170),
                size: random(1.4, 3),
                color: pick(gold)
            });
        }

        createStarCore(x, y, "#fff176");
        return;
    }

    /* Standard sphere */

    for (let i = 0; i < count; i++) {
        const angle =
            Math.random() * Math.PI * 2;

        const speed =
            Math.pow(Math.random(), 0.55) *
            random(3.5, 7);

        addParticle(x, y, {
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            gravity: random(0.02, 0.045),
            drag: random(0.985, 0.992),
            life: randomInt(70, 125),
            size: random(1.3, 2.8),
            color: pick(colors)
        });
    }

    createStarCore(x, y, color);

    if (Math.random() < 0.35) {
        createCrackle(x, y, colors);
    }
}


/* =========================================================
   120+ SHOW VARIATIONS
========================================================= */

const fireworkTypes = [
    "sphere",
    "ring",
    "doubleRing",
    "willow",
    "crackle",
    "chrysanthemum",
    "peony",
    "fan",
    "heart",
    "spiral",
    "cross",
    "saturn",
    "rainbow",

let showItemIndex = 0;

function launchShowItem(intensity = 1) {
    const item =
        showItems[
            showItemIndex %
            showItems.length
        ];

    showItemIndex++;

    const palette =
        palettes[item.palette % palettes.length];

    let amount =
        Math.round(
            item.count *
            intensity
        );

    amount = Math.max(1, amount);

    /*
        Keep special effects distributed around
        the entire screen instead of clustering.
    */

    const baseX =
        random(width * 0.12, width * 0.88);

    const baseY =
        random(height * 0.13, height * 0.47);

    for (let i = 0; i < amount; i++) {
        let targetX =
            baseX +
            random(-Math.min(width * 0.25, 180),
                   Math.min(width * 0.25, 180));

        let targetY =
            baseY +
            random(-45, 45);

        targetX = Math.max(
            width * 0.06,
            Math.min(width * 0.94, targetX)
        );

        targetY = Math.max(
            height * 0.10,
            Math.min(height * 0.58, targetY)
        );

        addRocket({
            targetX,
            targetY,
            color: pick(palette),
            type: item.type,
            speed: random(9, 13.5)
        });
    }
}

function createLetterTargets(text) {
    const clean =
        text
            .toUpperCase()
            .replace(/[^A-Z ]/g, "")
            .trim();

    const letters =
        clean.split("");

    const spacing = 1;

    let totalUnits = 0;

    for (const char of letters) {
        if (char === " ") {
            totalUnits += 4;
        } else {
            totalUnits += 5 + spacing;
        }
    }

    totalUnits =
        Math.max(
            1,
            totalUnits - spacing
        );

    const cell =
        Math.min(
            18,
            Math.max(
                4,
                width * 0.88 / totalUnits
            )
        );

    const totalWidth =
        totalUnits * cell;

    let startX =
        (width - totalWidth) / 2;

    const startY =
        height * 0.32;

    const targets = [];

    for (const char of letters) {
        if (char === " ") {
            startX += 4 * cell;
            continue;
        }

        const pattern =
            letterFont[char];

        if (!pattern) {
            startX += 6 * cell;
            continue;
        }

        for (let row = 0; row < 7; row++) {
            for (let col = 0; col < 5; col++) {
                if (pattern[row][col] === "1") {
                    targets.push({
                        x:
                            startX +
                            col * cell +
                            cell * 0.5,

                        y:
                            startY +
                            row * cell +
                            cell * 0.5
                    });
                }
            }
        }

        startX += 6 * cell;
    }

    return targets;
}


function launchLetterRocket(target, color, delay = 0) {
    addRocket({
        targetX: target.x,
        targetY: target.y,
        color,
        type: "sphere",
        speed: random(10, 13.5),
        delay
    });
}


function launchLetterFireworks(text) {
    const targets =
        createLetterTargets(text);

    const colors = [
        "#ffffff",
        "#00e5ff",
        "#2979ff",
        "#d500f9",
        "#ff4081",
        "#ff1744",
        "#ffc107",
        "#76ff03"
    ];

    targets.forEach((target, index) => {
        launchLetterRocket(
            target,
            colors[
                index % colors.length
            ],
            Math.floor(index * 0.8)
        );
    });
}

/* =========================================================
   BIRTHDAY FINALE
========================================================= */

function runBirthdayFinale() {
    if (finaleRunning) return;

    finaleRunning = true;

    showActive = false;

    /*
        HAPPY
    */

    setFinaleMessage("HAPPY");

    launchLetterFireworks("HAPPY");

    finaleBurst(10);

    setTimeout(() => {
        if (!finaleRunning) return;

        hideFinaleMessage();

        finaleBurst(14);

        setFinaleMessage("BIRTHDAY");

        launchLetterFireworks("BIRTHDAY");
    }, 4300);

    setTimeout(() => {
        if (!finaleRunning) return;

        hideFinaleMessage();

        finaleBurst(18);

        setFinaleMessage(
            birthdayName.toUpperCase()
        );

        launchLetterFireworks(
            birthdayName
        );
    }, 8800);

    setTimeout(() => {
        if (!finaleRunning) return;

        hideFinaleMessage();

        finaleBurst(24);

        launchLetterFireworks(
            birthdayName
        );

        for (let i = 0; i < 8; i++) {
            setTimeout(() => {
                finaleBurst(5);
            }, i * 180);
        }
    }, 11600);

    setTimeout(() => {
        finaleRunning = false;
        showFinished = true;
        hideFinaleMessage();
    }, 16500);
}

    showActive = true;
    showFinished = false;
    finaleRunning = false;

    showStartTime =
        performance.now();

    showElapsed = 0;

    showItemIndex = 0;

    /*

    nextContinuousLaunch = 0;
    nextSpecialLaunch = 1800;

    launchShowItem(1.1);
}

========================================================= */

function updateShow(time) {
    if (!showActive) {
        return;
    }

    showElapsed =
        time - showStartTime;

    if (showElapsed >= SHOW_DURATION) {
        showActive = false;

        /*
            Immediately transition into
            the birthday finale.
        */

        runBirthdayFinale();
        return;
    }

    /*
        Main continuous launcher.

        This is deliberately much faster than the
        lifespan of a firework, causing the effects
        to overlap instead of leaving the sky empty.
    */

    while (
        showElapsed >= nextContinuousLaunch
    ) {
        const progress =
            showElapsed / SHOW_DURATION;

        /*
            The show gradually becomes bigger.
        */

        let intensity =
            1 +
            progress * 1.8;

        /*
            Final minute becomes noticeably busier.
        */

        if (progress > 0.80) {
            intensity += 0.65;
        }

        if (progress > 0.93) {
            intensity += 0.8;
        }

        launchShowItem(
            Math.min(
                3.8,
                intensity
            )
        );

        /*
            Random interval between 550 and 800 ms.
        */

        nextContinuousLaunch +=
            random(
                MIN_LAUNCH_INTERVAL,
                MAX_LAUNCH_INTERVAL
            );
    }

    /*
        Larger special sequences every few seconds.
    */

    while (
        showElapsed >= nextSpecialLaunch
    ) {
        launchSpecialSequence();

        nextSpecialLaunch +=
            random(2600, 5200);
    }

    /*
        Last 20 seconds:
        keep the sky extremely active.
    */

    if (
        showElapsed >
        SHOW_DURATION - 20000
    ) {
        if (
            Math.random() < 0.18
        ) {
            launchShowItem(2.8);
        }
    }
}


/* =========================================================
   UPDATE
========================================================= */

function update() {
    for (let i = rockets.length - 1; i >= 0; i--) {
        const rocket = rockets[i];

        rocket.update();

        if (rocket.dead) {
            rockets.splice(i, 1);
        }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        const particle = particles[i];

        particle.update();

        if (particle.dead) {
            particles.splice(i, 1);
        }
    }
}


/* =========================================================
   DRAW
========================================================= */

function draw() {
    /*
        Very slight persistence creates beautiful trails
        without allowing old fireworks to completely
        disappear instantly.
    */

    ctx.globalCompositeOperation =
        "source-over";

    ctx.fillStyle =
        "rgba(0, 0, 8, 0.22)";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );

    ctx.globalCompositeOperation =
        "lighter";

    /*
        Particles
    */

    ctx.save();

    ctx.shadowBlur = 8;

    for (const particle of particles) {
        if (particle.type === "flash") {
            ctx.globalAlpha =
                particle.alpha * 0.12;

            ctx.shadowBlur = 35;
            ctx.shadowColor =
                particle.color;

            ctx.beginPath();

            ctx.arc(
                particle.x,
                particle.y,
                particle.size *
                    particle.alpha,
                0,
                Math.PI * 2
            );

            ctx.fillStyle =
                particle.color;

            ctx.fill();

            continue;
        }

        ctx.shadowBlur = 8;
        ctx.shadowColor =
            particle.color;

        particle.draw();
    }

    ctx.restore();

    /*
        Rockets
    */

    for (const rocket of rockets) {
        rocket.draw();
    }

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation =
        "source-over";
}


/* =========================================================
   MAIN LOOP
========================================================= */

function loop(time) {
    updateShow(time);
    update();
    draw();

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);


/* =========================================================
   NAME HANDLING
========================================================= */

nameInput.addEventListener(
    "input",
    () => {
        let value =
            nameInput.value
                .toUpperCase()
                .replace(/[^A-Z ]/g, "");

        nameInput.value =
            value.slice(0, 20);
    }
);


function beginFromInput() {
    const enteredName =
        nameInput.value
            .toUpperCase()
            .replace(/[^A-Z ]/g, "")
            .trim();

    if (!enteredName) {
        nameInput.focus();
        return;
    }

    birthdayName =
        enteredName.slice(0, 20);

    nameScreen.style.display =
        "none";

    startFireworkShow();
}


startButton.addEventListener(
    "click",
    beginFromInput
);

nameInput.addEventListener(
    "keydown",
    event => {
        if (event.key === "Enter") {
            beginFromInput();
        }
    }
);


/* =========================================================
   PREVENT USER-PLACED FIREWORKS
========================================================= */

/*
    There is intentionally no click/touch
    firework launcher during the show.

    The entire show is automated.
*/

canvas.addEventListener(
    "pointerdown",
    event => {
        event.preventDefault();
    },
    {
        passive: false
    }
);

canvas.addEventListener(
    "pointermove",
    event => {
        event.preventDefault();
    },
    {
        passive: false
    }
);

canvas.addEventListener(
    "touchstart",
    event => {
        event.preventDefault();
    },
    {
        passive: false
    }
);


/* =========================================================
   FINAL INITIALIZATION
========================================================= */

ctx.fillStyle = "#000";
ctx.fillRect(
    0,
    0,
    width,
    height
);

nameInput.focus();

</script>
